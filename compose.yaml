services:
  laravel:
    build:
      context: .
      dockerfile: ./docker/app/Dockerfile
      secrets:
        - rt_token
    container_name: scenario-laravel
    restart: unless-stopped
    user: "1000:1000"
    command: ["run-roadrunner"]
    working_dir: /var/www/html
    ports:
      - "${LOCAL_IP:-127.0.0.3}:8000:8080"
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      centrifugo:
        condition: service_started
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: scenario
      DB_USERNAME: scenario
      DB_PASSWORD: scenario
      RR_HTTP_HOST: 0.0.0.0
      RR_HTTP_PORT: 8080
      RR_RPC_PORT: 6001
      RR_JOBS_DRIVER: boltdb
      RR_DEBUG: "true"
      BROADCAST_CONNECTION: null
      CENTRIFUGO_WS_URL: ws://${LOCAL_IP:-127.0.0.3}:8002/connection/websocket
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: cd261ef813b617080f4dadde374cef46f35fbc5fbf09fcd501891d91ab645c18
      RR_CENTRIFUGE_PROXY_PORT: "30001"
      CENTRIFUGO_GRPC_API_HOST: centrifugo
      CENTRIFUGO_GRPC_API_PORT: "10000"
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_CHANNEL: stack
      LOG_STACK: single,socket
      LOG_SOCKET_URL: buggregator:9913
      LOG_LEVEL: debug
      LOG_DEPRECATIONS_CHANNEL: stack
      VAR_DUMPER_FORMAT: server
      VAR_DUMPER_SERVER: tcp://buggregator:9912
      MAIL_MAILER: smtp
      MAIL_HOST: buggregator
      MAIL_PORT: 1025
      TEMPORAL_ADDRESS: temporal:7233
    labels:
      - traefik.enable=true
      - traefik.http.routers.scenario.rule=Host(`scenario.test`)
      - traefik.http.routers.scenario.entrypoints=web
      - traefik.http.services.scenario.loadbalancer.server.port=8080
    networks:
      - scenario

  redis:
    image: redis:7-alpine
    container_name: scenario-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - scenario

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: scenario-centrifugo
    restart: unless-stopped
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    ports:
      - "${LOCAL_IP:-127.0.0.3}:8002:8000"
    environment:
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "http://localhost:8000 http://${LOCAL_IP:-127.0.0.3}:8000 http://scenario.test http://centrifugo.scenario.test"
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - traefik.enable=true
      - traefik.http.routers.scenario-centrifugo.rule=Host(`centrifugo.scenario.test`)
      - traefik.http.routers.scenario-centrifugo.entrypoints=web
      - traefik.http.services.scenario-centrifugo.loadbalancer.server.port=8000
    networks:
      - scenario

  postgres:
    image: postgres:18.3
    container_name: scenario-postgres
    restart: unless-stopped
    ports:
      - "${LOCAL_IP:-127.0.0.3}:5432:5432"
    environment:
      POSTGRES_DB: scenario
      POSTGRES_USER: scenario
      POSTGRES_PASSWORD: scenario
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenario -d scenario"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - scenario

  traefik:
    image: traefik:v3.4
    container_name: scenario-traefik
    restart: unless-stopped
    profiles:
      - dev
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    ports:
      - "${LOCAL_IP:-127.0.0.3}:80:80"
      - "${LOCAL_IP:-127.0.0.3}:8081:8080"
    volumes:
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - scenario

  buggregator:
    image: ghcr.io/buggregator/server:latest
    container_name: scenario-buggregator
    restart: unless-stopped
    profiles:
      - dev
    expose:
      - "8000"
      - "9912"
      - "9913"
      - "1025"
    ports:
      - "${LOCAL_IP:-127.0.0.3}:8001:8000"
      - "${LOCAL_IP:-127.0.0.3}:1025:1025"
      - "${LOCAL_IP:-127.0.0.3}:9912:9912"
      - "${LOCAL_IP:-127.0.0.3}:9913:9913"
    labels:
      - traefik.enable=true
      - traefik.http.routers.buggregator.rule=Host(`buggregator.scenario.test`)
      - traefik.http.routers.buggregator.entrypoints=web
      - traefik.http.services.buggregator.loadbalancer.server.port=8000
    networks:
      - scenario

  temporal-postgresql:
    image: postgres:13-alpine
    container_name: scenario-temporal-postgresql
    restart: unless-stopped
    profiles:
      - temporal
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - scenario

  temporal:
    image: temporalio/auto-setup:1.27
    container_name: scenario-temporal
    restart: unless-stopped
    profiles:
      - temporal
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "${LOCAL_IP:-127.0.0.3}:7233:7233"
    networks:
      - scenario

  temporal-ui:
    image: temporalio/ui:latest
    container_name: scenario-temporal-ui
    restart: unless-stopped
    profiles:
      - temporal
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:8003 http://${LOCAL_IP:-127.0.0.3}:8003 http://temporal.scenario.test"
    ports:
      - "${LOCAL_IP:-127.0.0.3}:8003:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.scenario-temporal-ui.rule=Host(`temporal.scenario.test`)
      - traefik.http.routers.scenario-temporal-ui.entrypoints=web
      - traefik.http.services.scenario-temporal-ui.loadbalancer.server.port=8080
    networks:
      - scenario

  node:
    image: node:22-alpine
    container_name: scenario-node
    profiles:
      - tools
    working_dir: /app
    user: "1000:1000"
    volumes:
      - ./:/app
    ports:
      - "${LOCAL_IP:-127.0.0.3}:5173:5173"
    networks:
      - scenario

volumes:
  postgres_data:
  temporal_postgres_data:

networks:
  scenario:
    driver: bridge

secrets:
  # GitHub token for the Velox custom-RoadRunner build step (docker/app/Dockerfile) — needs no
  # scopes beyond public-repo read. Export RT_TOKEN in the shell before `task build`.
  rt_token:
    environment: RT_TOKEN
