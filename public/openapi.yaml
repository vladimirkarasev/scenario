          type: string
          example: <lead><name>{{ lead.name }}</name></lead>
        file_name:
          type:
            - string
            - 'null'
          example: lead.xml
    ProxyRequestActionConfig:
      type: object
      description: |
        Action вызывает существующий endpoint модуля Proxy через `endpoint_uuid` и получает ответ Proxy module. Нормализация, валидация, логирование и handler остаются внутри `module/Proxy`.
      required:
        - endpoint_uuid
      properties:
        endpoint_uuid:
          type: string
          format: uuid
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          default: POST
        headers:
          type: object
          additionalProperties: true
        query:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
    ExcelReportActionConfig:
      type: object
      required:
        - columns
      properties:
        file_name:
          type:
            - string
            - 'null'
          example: leads.xlsx
        sheet_name:
          type:
            - string
            - 'null'
          example: Leads
        columns:
          type: array
          items:
            type: object
            required:
              - header
              - key
            properties:
              header:
                type: string
                example: Email
              key:
                type: string
                example: lead.email
        rows:
          type:
            - array
            - 'null'
          items:
            type: object
            additionalProperties: true
    DirectoryImportActionConfig:
      type: object
      description: |
        Action создаёт `DirectoryImport` через `Module\Directories\Services\ImportService`. Сам импорт, версии, mapping, обработка строк и ошибки остаются внутри `module/Directories`.
      required:
        - directory_id
        - source_type
        - mode
        - mapping
        - columns
      properties:
        directory_id:
          type: string
          format: uuid
        source_type:
          type: string
          enum:
            - file
            - proxy
            - remote
        mode:
          type: string
          enum:
            - create
            - update
            - replace
        file_disk:
          type:
            - string
            - 'null'
          example: local
        file_path:
          type:
            - string
            - 'null'
          description: Путь к уже сохранённому Excel/CSV/ODS/XLS файлу для `source_type=file`.
          example: actions/leads/leads.xlsx
        proxy_endpoint_id:
          type:
            - integer
            - 'null'
          description: ID ProxyEndpoint для `source_type=proxy`.
        proxy_endpoint_uuid:
          type:
            - string
            - 'null'
          description: UUID ProxyEndpoint для `source_type=proxy`, если ID неизвестен.
        remote:
          type:
            - object
            - 'null'
          additionalProperties: true
        mapping:
          type: object
          additionalProperties:
            type: string
          example:
            email: email
            name: name
        columns:
          type: array
          items:
            type: object
            required:
              - key
              - name
            properties:
              key:
                type: string
              name:
                type: string
              type:
                type:
                  - string
                  - 'null'
              nullable:
                type:
                  - boolean
                  - 'null'
        match_by:
          type:
            - string
            - 'null'
        parent_key_field:
          type:
            - string
            - 'null'
        chunk_size:
          type:
            - integer
            - 'null'
          example: 500
        activate:
          type:
            - boolean
            - 'null'
        version_id:
          type:
            - integer
            - 'null'
    ActionExecutionRequest:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
          example:
            lead:
              name: Иван
              email: ivan@example.com
    ActionExecutionResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - success
            - failed
            - skipped
        output:
          type:
            - object
            - 'null'
          additionalProperties: true
        error:
          type:
            - string
            - 'null'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/ActionRun'
    ActionRunRequest:
      type: object
      properties:
        execution_mode:
          type: string
          enum:
            - sync
            - async
            - chain
            - batch
          description: |
            Режим выполнения текущего запуска. `chain` выполняет `action_ids` последовательно, `batch` запускает `action_ids` параллельно.
          example: chain
        action_ids:
          type: array
          description: Основные actions для последовательного или параллельного выполнения.
          items:
            type: integer
          example:
            - 10
            - 11
            - 12
        before_action_ids:
          type: array
          description: Actions, которые выполняются перед основной очередью.
          items:
            type: integer
          example:
            - 7
        after_action_ids:
          type: array
          description: Actions, которые выполняются после успешной обработки основной очереди.
          items:
            type: integer
          example:
            - 20
        failed_action_ids:
          type: array
          description: Actions, которые выполняются при ошибке before/main/batch обработки.
          items:
            type: integer
          example:
            - 30
        retry:
          type: object
          properties:
            attempts:
              type: integer
              minimum: 1
              example: 3
            backoff:
              type: array
              items:
                type: integer
              example:
                - 60
                - 120
                - 300
        input:
          type: object
          additionalProperties: true
          example:
            scenario_run_id: 15
            rows:
              - lead:
                  email: ivan@example.com
    ActionRunResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - completed
            - queued
        result:
          type:
            - object
            - 'null'
          properties:
            status:
              type: string
              enum:
                - success
                - failed
                - skipped
            output:
              type:
                - object
                - 'null'
              additionalProperties: true
            error:
              type:
                - string
                - 'null'
    ActionScheduleRequest:
      type: object
      required:
        - enabled
        - frequency
      properties:
        enabled:
          type: boolean
          example: true
        frequency:
          type: string
          enum:
            - every_minute
            - hourly
            - daily
            - weekly
            - monthly
          example: daily
        run_at:
          type:
            - string
            - 'null'
          pattern: ^\\d{2}:\\d{2}$
          description: |
            Время запуска в указанной timezone. Для `hourly` используется только минута, для `every_minute` поле игнорируется.
          example: '09:30'
        timezone:
          type:
            - string
            - 'null'
          example: Europe/Moscow
        input:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Input, который будет передан в orchestrator.
          example:
            source: schedule
        options:
          anyOf:
            - $ref: '#/components/schemas/ActionRunRequest'
            - type: 'null'
        settings:
          type:
            - object
            - 'null'
          properties:
            day_of_week:
              type: integer
              minimum: 1
              maximum: 7
              description: Для weekly. 1 = понедельник, 7 = воскресенье.
              example: 1
            day_of_month:
              type: integer
              minimum: 1
              maximum: 31
              description: Для monthly.
              example: 1
    ActionSchedule:
      type: object
      properties:
        id:
          type: integer
        action_id:
          type: integer
        enabled:
          type: boolean
        frequency:
          type: string
          enum:
            - every_minute
            - hourly
            - daily
            - weekly
            - monthly
        run_at:
          type:
            - string
            - 'null'
        timezone:
          type: string
        input:
          type:
            - object
            - 'null'
          additionalProperties: true
        options:
          type:
            - object
            - 'null'
          additionalProperties: true
        settings:
          type:
            - object
            - 'null'
          additionalProperties: true
        last_run_at:
          type:
            - string
            - 'null'
          format: date-time
        next_run_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    ActionScheduleResource:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          example: '5'
        type:
          type: string
          example: action-schedules
        attributes:
          $ref: '#/components/schemas/ActionSchedule'
    ActionRun:
      type: object
      properties:
        id:
          type: integer
        action_id:
          type: integer
        status:
          type: string
          enum:
            - running
            - success
            - failed
            - skipped
        input:
          type:
            - object
            - 'null'
          additionalProperties: true
        output:
          type:
            - object
            - 'null'
          additionalProperties: true
        error:
          type:
            - string
            - 'null'
        reason:
          type:
            - string
            - 'null'
          description: Причина ошибки. Для успешных задач `null`.
        attempts_count:
          type: integer
          minimum: 1
          description: Номер попытки, на которой была создана запись выполнения.
        started_at:
          type:
            - string
            - 'null'
          format: date-time
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
        duration_ms:
          type:
            - integer
            - 'null'
        created_at:
          type:
            - string
            - 'null'
          format: date-time
    ActionRunListResponse:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionRun'
        meta:
          type: object
          properties:
            total:
              type: integer
    EmbedAuthExchangeRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Значение `launch_token`, полученное от `POST /api/users/launch-token`
          example: a3f8c2d1e9b7...
    EmbedAuthRefreshRequest:
      type: object
      required:
        - refresh_token
