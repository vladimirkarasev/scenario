      summary: Запустить action через оркестратор
      description: |
        Режим, основной список actions и lifecycle hooks передаются в теле запроса: `execution_mode`, `action_ids`, `before_action_ids`, `after_action_ids`, `failed_action_ids`. Если параметры не переданы, используется текущий action и fallback из `action.config` для старых записей.
