openapi: 3.1.0
info:
  title: Platform API
  description: |
    API платформы сценариев.

    ## Как авторизоваться

    Все запросы (кроме публичных) требуют заголовок `Authorization: Bearer {access_token}`.

    **Боевой флоу (встраивание во внешнюю систему).** Авторизация не по паролю, а через обмен одноразового launch-токена:

    1. Внешний бэкенд с токеном системного пользователя проекта вызывает `POST /api/users/launch-token` → получает одноразовый `_token` (TTL 5 мин).
    2. Внешний фронт открывает приложение в `<iframe>` с `?_token={_token}`.
    3. Приложение вызывает `POST /api/embed/auth/exchange` с этим `_token` → получает пару `access_token` + `refresh_token` (**здесь и происходит авторизация**).
    4. Дальше все запросы идут с `Authorization: Bearer {access_token}`; протухший access обновляется через `POST /api/embed/auth/refresh` (ротация).
    5. Выход — `POST /api/auth/logout` (отзывает access и связанный refresh).

    Подробнее — см. тег «Авторизация».
  version: 1.0.0
servers:
  - url: /api
    description: Основной сервер
security:
  - BearerAuth: []
tags:
  - name: Каталог
    description: Сводный каталог категорий и сценариев
  - name: Сценарии
    description: CRUD-операции над сценариями
  - name: Версии
    description: Управление версиями сценариев
  - name: Категории
    description: CRUD-операции над категориями
  - name: Запуск
    description: Запуск сценария и прохождение шагов
  - name: Прогоны
    description: Административный журнал прогонов — просмотр, создание, управление
  - name: Опросы
    description: Список прогонов и просмотр состояния прогона
  - name: Авторизация
    description: Вход/выход, текущий пользователь, разрешения и обмен токенов. Полный флоу — во вступлении вверху страницы.
  - name: Пользователи
    description: CRUD-операции над пользователями системы
  - name: Проекты
    description: Управление проектами. Запись требует роль `project_admin`.
  - name: Роли
    description: Управление ролями (Spatie Permission). Роли назначаются пользователям и используются для авторизации (`project_admin` и др.).
  - name: Actions
    description: CRUD, выполнение и оркестрация actions через jobs, chain и batch.
  - name: Группы
    description: Управление группами доступа. Группы привязываются к категориям и сценариям для ограничения видимости.
  - name: Proxy
    description: Интеграции, доступы, каталоги и журнал запросов в формате JSON:API.
paths:
  /scenarios/catalog:
    get:
      tags:
        - Каталог
      summary: Сводный каталог (категории + сценарии)
      security:
        - BearerAuth: []
      description: |
        Возвращает постраничный список элементов каталога. Каждый элемент имеет тип `category` или `scenario` и содержит атрибуты соответствующей сущности.
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          description: |
            Фильтры каталога (`filter[q]`, `filter[parent_id]`).
          schema:
            type: object
            properties:
              q:
                type: string
                description: |
                  Текстовый поиск по названию (категории) и названию/описанию (сценарии). Регистронезависимый ILIKE-поиск.
                example: оформление
              parent_id:
                type:
                  - string
                  - 'null'
                format: uuid
                description: |
                  UUID родительской категории. Если ключ передан с пустым значением — возвращаются элементы корневого уровня (без родителя). При одновременном использовании с `filter[q]` поиск ведётся по всему поддереву указанной категории.
                example: 018e1b2c-3d4f-7e8a-9b0c-1d2e3f4a5b6c
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Список элементов каталога
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /scenarios:
    get:
      tags:
        - Сценарии
      summary: Список сценариев
      security:
        - BearerAuth: []
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          description: |
            Фильтры JSON:API (`filter[search]`, `filter[is_active]`, `filter[active_only]`, `filter[tags][]`, `filter[category_id]`)
          schema:
            type: object
            properties:
              search:
                type: string
                description: Поиск по названию, описанию, alias и тегам (регистронезависимо)
                example: оформление
              is_active:
                type: boolean
                description: Фильтр по признаку активности сценария
                example: true
              active_only:
                type: boolean
                description: Показывать только сценарии с активной версией (по умолчанию `true`)
                default: true
              tags:
                type: array
                items:
                  type: string
                description: Фильтр по тегам (любое совпадение)
                example:
                  - onboarding
                  - hr
              category_id:
                type: string
                format: uuid
                description: UUID категории для фильтрации
                example: 018e1b2c-3d4f-7e8a-9b0c-1d2e3f4a5b6c
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Список сценариев (JSON:API коллекция)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ScenarioResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Сценарии
      summary: Создать сценарий
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRequest'
      responses:
        '201':
          description: Сценарий создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/ScenarioItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /scenarios/{scenario}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags:
        - Сценарии
      summary: Получить сценарий
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Сценарий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Сценарии
      summary: Обновить сценарий
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioRequest'
      responses:
        '200':
          description: Обновлённый сценарий
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/ScenarioItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Сценарии
      summary: Удалить сценарий
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Сценарий удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenarios/{scenario}/duplicate:
    post:
      tags:
        - Сценарии
      summary: Дублировать сценарий
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '201':
          description: Копия сценария создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: '#/components/schemas/ScenarioItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenarios/{scenario}/versions:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags:
        - Версии
      summary: Список версий сценария
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список версий (JSON:API коллекция)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/VersionResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Версии
      summary: Создать версию сценария
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '201':
          description: Версия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /scenarios/{scenario}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags:
        - Версии
      summary: Получить версию сценария
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Версия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Версии
      summary: Обновить версию сценария
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Обновлённая версия
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Версии
      summary: Удалить версию сценария
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Результат удаления
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenarios/categories:
    get:
      tags:
        - Категории
      summary: Список категорий
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список категорий (JSON:API коллекция)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Категории
      summary: Создать категорию
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /scenarios/categories/{category}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags:
        - Категории
      summary: Получить категорию
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Категории
      summary: Обновить категорию
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Обновлённая категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
        - Категории
      summary: Удалить категорию
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Категория удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenarios/runner/start:
    post:
      tags:
        - Запуск
      summary: Запустить сценарий
      security:
        - BearerAuth: []
      description: |
        Создаёт новый прогон (`ScenarioRun`) и автоматически продвигает его до первого интерактивного узла. Возвращает ID прогона, который затем используется в `/runner/{runId}/jump`.
        Необходимо передать ровно один из параметров: `scenario_id`, `version_id` или `alias`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerStartRequest'
      responses:
        '201':
          description: Прогон создан
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
                    description: ID созданного прогона
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /scenarios/runner/{runId}/jump:
    post:
      tags:
        - Запуск
      summary: Перейти к следующему узлу
      security:
        - BearerAuth: []
      description: |
        Принимает пользовательский ввод для текущего узла и продвигает прогон вперёд до следующего интерактивного узла. Возвращает полный payload прогона с отрендеренным состоянием текущего узла и историей шагов.
      parameters:
        - name: runId
          in: path
          required: true
          description: UUID прогона
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerJumpRequest'
      responses:
        '200':
          description: Обновлённое состояние прогона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /scenario-runs:
    get:
      tags:
        - Прогоны
      summary: Список прогонов
      security:
        - BearerAuth: []
      description: |
        Возвращает постраничный список прогонов сценариев с информацией об авторах. Поддерживает фильтрацию по `scenario_id`, `status`, `created_by` и текстовый поиск по названию сценария и ID прогона.
      parameters:
        - name: scenario_id
          in: query
          description: UUID сценария для фильтрации
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Фильтр по статусу прогона
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: created_by
          in: query
          description: ID пользователя (можно передать массив)
          schema:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
        - name: search
          in: query
          description: Текстовый поиск по названию сценария и UUID прогона
          schema:
            type: string
      responses:
        '200':
          description: Список прогонов с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRunListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Прогоны
      summary: Создать прогон
      security:
        - BearerAuth: []
      description: |
        Создаёт новый прогон и автоматически продвигает его до первого интерактивного узла через `ScenarioPlayerService`. Публикует начальный payload в Centrifugo-канал `scenario-run:{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreScenarioRunRequest'
      responses:
        '201':
          description: Прогон создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /scenario-runs/users:
    get:
      tags:
        - Прогоны
      summary: Поиск пользователей
      security:
        - BearerAuth: []
      description: |
        Возвращает до 30 пользователей, совпадающих с поисковым запросом. Используется для фильтра «создатель прогона» в интерфейсе. Если `search` не передан или пустой — возвращает пустой список.
      parameters:
        - name: search
          in: query
          required: true
          description: Строка поиска по имени, ФИО, логину или email
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioRunUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /scenario-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags:
        - Прогоны
      summary: Получить прогон
      security:
        - BearerAuth: []
      description: |
        Возвращает полный payload прогона (текущий узел, рендер, история шагов). Прогон автоматически продвигается до ближайшего интерактивного узла.
      responses:
        '200':
          description: Состояние прогона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenario-runs/{runId}/continue:
    post:
      tags:
        - Прогоны
      summary: Продолжить прогон
      security:
        - BearerAuth: []
      description: |
        Принимает пользовательский ввод и продвигает прогон вперёд. Публикует обновлённый payload в Centrifugo-канал `scenario-run:{id}`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueRunRequest'
      responses:
        '200':
          description: Обновлённое состояние прогона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /scenario-runs/{runId}/jump:
    post:
      tags:
        - Прогоны
      summary: Перейти к узлу
      security:
        - BearerAuth: []
      description: |
        Переводит прогон к конкретному узлу (`node_id`). Публикует обновлённый payload в Centrifugo-канал `scenario-run:{id}`.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminJumpRunRequest'
      responses:
        '200':
          description: Обновлённое состояние прогона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /scenarios/surveys:
    get:
      tags:
        - Опросы
      summary: Список прогонов (опросов)
      security:
        - BearerAuth: []
      description: |
        Возвращает постраничный список запущенных прогонов сценариев. Позволяет вернуться к незавершённому опросу — достаточно взять `id` нужного прогона и вызвать `/scenarios/survey/{id}`.
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу прогона
          schema:
            $ref: '#/components/schemas/RunStatus'
        - name: scenario_id
          in: query
          description: UUID сценария для фильтрации
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Список прогонов с пагинацией
          content:
            application/json:
              schema:
                type: object
                required:
                  - surveys
                  - pagination
                properties:
                  surveys:
                    type: array
                    items:
                      $ref: '#/components/schemas/SurveySummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
