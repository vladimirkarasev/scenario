    get:
      tags:
        - Опросы
      summary: Получить состояние прогона
      security:
        - BearerAuth: []
      description: |
        Возвращает полный payload прогона: текущий узел, его отрендеренное содержимое и историю пройденных шагов. Прогон автоматически продвигается до ближайшего интерактивного узла перед возвратом.
