  /embed/auth/exchange:
    post:
      tags:
        - Авторизация
      summary: Обмен launch-токена на access + refresh токены
      description: |
        Принимает одноразовый `launch_token`, полученный через `POST /api/users/launch-token`. Проверяет: токен существует, не использован, не истёк; проект активен; пользователь состоит в проекте; заголовок `Origin` совпадает с `project.host` (если задан). Помечает токен использованным, создаёт Sanctum access-токен (TTL 30 мин) и refresh-токен (TTL 7 дней).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedAuthExchangeRequest'
      responses:
        '200':
          description: Пара токенов выдана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedTokenPairResponse'
        '401':
          description: Токен не найден, истёк или уже использован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin не разрешён или пользователь не в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Проект неактивен или ошибка валидации
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
  /embed/auth/refresh:
    post:
      tags:
        - Авторизация
      summary: Обновление access-токена (token rotation)
      description: |
        Принимает действующий `refresh_token`. Отзывает старый access-токен, создаёт новые access и refresh токены (ротация). Старый refresh-токен помечается отозванным и повторно использован быть не может.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedAuthRefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedTokenPairResponse'
        '401':
          description: Refresh-токен не найден, отозван или истёк
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Пользователь не состоит в проекте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Проект неактивен или ошибка валидации
          content:
