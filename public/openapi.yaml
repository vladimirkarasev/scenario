  /proxy/categories:
    get:
      tags:
        - Proxy
      summary: Список разделов интеграций
      parameters:
        - name: filter[parent_id]
          in: query
          schema:
            type:
              - string
              - 'null'
            format: uuid
      responses:
        '200':
          description: JSON:API коллекция разделов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryResource'
    post:
      tags:
        - Proxy
      summary: Создать раздел интеграций
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Раздел создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryResource'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '422':
          $ref: '#/components/responses/ValidationErrors'
  /proxy/categories/{category}:
    parameters:
      - name: category
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Proxy
      summary: Получить раздел интеграций
      responses:
        '200':
          description: JSON:API ресурс раздела
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CategoryResource'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '404':
          $ref: '#/components/responses/NotFoundErrors'
    put:
      tags:
        - Proxy
      summary: Обновить раздел интеграций
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Раздел обновлён
        '404':
          $ref: '#/components/responses/NotFoundErrors'
        '422':
          $ref: '#/components/responses/ValidationErrors'
    delete:
      tags:
        - Proxy
      summary: Удалить раздел интеграций
      responses:
        '204':
          description: Раздел удалён
        '403':
          $ref: '#/components/responses/ForbiddenErrors'
        '404':
          $ref: '#/components/responses/NotFoundErrors'
  /proxy/requests:
    get:
      tags:
        - Proxy
      summary: Журнал запросов
      parameters:
        - name: filter[endpoint_id]
          in: query
          schema:
            type: integer
        - name: filter[status]
          in: query
          schema:
            type: string
        - name: filter[search]
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: JSON:API коллекция запросов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxyRequest'
                      meta:
                        $ref: '#/components/schemas/CollectionMeta'
  /proxy/requests/{proxyRequest}:
    get:
      tags:
        - Proxy
      summary: Детали запроса
      parameters:
        - name: proxyRequest
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: JSON:API ресурс запроса
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ProxyRequest'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '404':
          $ref: '#/components/responses/NotFoundErrors'
  /proxies/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Proxy
      summary: Вызвать публичную GET-интеграцию
      responses:
        '200':
          description: Ответ обработчика интеграции
        '404':
          description: Интеграция не найдена или неактивна
        '405':
          description: Метод не разрешён
    post:
      tags:
        - Proxy
      summary: Вызвать публичную POST-интеграцию
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Запрос принят
        '404':
          description: Интеграция не найдена или неактивна
        '405':
          description: Метод не разрешён
        '422':
          description: Payload не прошёл схему обработчика
  /proxies/{uuid}/fields:
    get:
      tags:
        - Proxy
      summary: Поля публичной интеграции
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: JSON:API коллекция полей
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProxyCatalogResource'
        '404':
          $ref: '#/components/responses/NotFoundErrors'
components:
  parameters:
    ScenarioId:
      name: scenario
      in: path
      required: true
      description: UUID сценария
      schema:
        type: string
        format: uuid
    VersionId:
      name: version
      in: path
      required: true
      description: UUID версии сценария
      schema:
        type: string
        format: uuid
    CategoryId:
      name: category
      in: path
      required: true
      description: UUID категории
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      description: UUID прогона
      schema:
        type: string
        format: uuid
    PerPage:
      name: per_page
      in: query
      description: Количество записей на страницу (1–100, по умолчанию 15)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    Page:
      name: page
      in: query
      description: Номер страницы
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page[size]
      in: query
      description: Количество записей на страницу — JSON:API (1–100, по умолчанию 20)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageNumber:
      name: page[number]
      in: query
      description: Номер страницы — JSON:API
      schema:
        type: integer
        minimum: 1
        default: 1
    IncludeUserRelations:
      name: include
      in: query
      description: JSON:API include связей через запятую. Поддерживаются `roles`, `groups`. Включённые объекты возвращаются в top-level `included`.
      schema:
        type: string
        example: roles,groups
    FieldsGroups:
      name: fields[groups]
      in: query
      description: Sparse fieldset для включённых групп (поля через запятую).
      schema:
        type: string
        example: name,slug
    FieldsRoles:
      name: fields[roles]
      in: query
      description: Sparse fieldset для включённых ролей (поля через запятую).
      schema:
        type: string
        example: name,title
    IncludeGroupRelations:
      name: include
      in: query
      description: JSON:API include связей через запятую. Поддерживаются `createdBy`, `updatedBy` (users). Включённые объекты возвращаются в top-level `included`.
      schema:
        type: string
        example: createdBy,updatedBy
    FieldsUsers:
      name: fields[users]
      in: query
      description: Sparse fieldset для включённых пользователей (поля через запятую).
      schema:
        type: string
        example: name,email
  responses:
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Ошибки валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    UnauthorizedErrors:
      description: Не аутентифицирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ValidationErrors:
      description: Ошибки валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFoundErrors:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ForbiddenErrors:
      description: Недостаточно прав / нарушение доступа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    EndpointCollection:
      description: JSON:API коллекция интеграций
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/JsonApiCollection'
              - properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProxyEndpoint'
                  meta:
                    $ref: '#/components/schemas/CollectionMeta'
    EndpointItem:
      description: JSON:API ресурс интеграции
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: '#/components/schemas/ProxyEndpoint'
              meta:
                $ref: '#/components/schemas/ApiMeta'
    ConnectionItem:
      description: JSON:API ресурс доступа
      content:
        application/json:
          schema:
            type: object
            required:
              - data
              - meta
            properties:
              data:
                $ref: '#/components/schemas/ProxyConnection'
              meta:
                $ref: '#/components/schemas/ApiMeta'
  schemas:
    Actor:
      type:
        - object
        - 'null'
      description: Пользователь (автор создания или изменения)
      properties:
        id:
          type: integer
        name:
          type:
            - string
            - 'null'
        login:
          type:
            - string
            - 'null'
    JsonApiCollection:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          description: Мета-данные (пагинация и др.)
        links:
          type: object
    JsonApiResourceEnvelope:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - type
            - attributes
          properties:
            id:
              type: string
            type:
              type: string
            attributes:
              type: object
            relationships:
              type: object
    Pagination:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 94
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Ресурс не найден.
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Поле name обязательно для заполнения.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            name:
              - Поле name обязательно для заполнения.
    ApiMeta:
      type: object
      description: |
        Сквозной блок meta, присутствует в каждом ответе модуля Users (и успешном, и ошибочном).
      required:
        - timestamp
        - requestId
      properties:
        timestamp:
          type: string
          format: date-time
          description: Момент формирования ответа (ISO 8601).
          example: '2026-07-02T10:00:00+00:00'
        requestId:
          type: string
          description: Идентификатор запроса (echo заголовка `X-Request-Id`).
          example: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
    CollectionMeta:
      description: |
        meta для JSON:API коллекции: пагинация плюс сквозные timestamp и requestId.
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - $ref: '#/components/schemas/ApiMeta'
    ApiError:
      type: object
      description: Одна ошибка в формате JSON:API.
      required:
        - status
        - code
        - title
        - detail
      properties:
        status:
          type: string
          description: HTTP-статус строкой.
          example: '404'
        code:
          type: string
          description: Машиночитаемый код ошибки (см. UserErrorCode).
          example: USER_NOT_FOUND
        title:
          type: string
          description: Краткий заголовок.
          example: Пользователь не найден
        detail:
          type: string
          description: Человекочитаемое описание.
          example: Пользователь не найден в проекте.
        source:
          type: object
          description: Указатель на источник ошибки (для ошибок валидации).
          properties:
            pointer:
              type: string
              example: /data/attributes/login
    ApiErrorResponse:
      type: object
      description: Единый конверт ошибки модуля Users.
      required:
        - errors
        - meta
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/ApiMeta'
    CatalogItem:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - category
            - scenario
        attributes:
          type: object
          properties:
            name:
              type: string
            is_active:
              type: boolean
            active_version_id:
              type:
                - string
                - 'null'
              format: uuid
              description: Только для type=scenario
            parent_id:
              type:
                - string
                - 'null'
              format: uuid
              description: Только для type=category
            child_count:
              type: integer
              description: Количество вложенных категорий (только для type=category)
            scenario_count:
              type: integer
              description: Количество сценариев в категории (только для type=category)
            version_count:
              type: integer
              description: Количество версий (только для type=scenario)
        relationships:
          type: object
          properties:
            path:
              type: object
              description: Цепочка родительских категорий
              properties:
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        example: category
                      id:
                        type: string
                        format: uuid
                      meta:
                        type: object
                        properties:
                          name:
                            type: string
    ScenarioResource:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: scenarios
        attributes:
          $ref: '#/components/schemas/ScenarioAttributes'
        relationships:
          type: object
          properties:
            created_by:
              type:
                - object
                - 'null'
              properties:
                data:
                  $ref: '#/components/schemas/Actor'
            updated_by:
              type:
                - object
                - 'null'
              properties:
                data:
                  $ref: '#/components/schemas/Actor'
    ScenarioAttributes:
      type: object
      properties:
        name:
          type: string
          example: Опрос клиента
        description:
          type:
            - string
            - 'null'
        is_active:
          type: boolean
        alias:
          type:
            - string
            - 'null'
          description: Уникальный псевдоним для запуска сценария по alias
        tags:
          type:
            - array
            - 'null'
          items:
            type: string
          description: Теги категоризации
        active_version_id:
          type:
            - string
            - 'null'
          format: uuid
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    ScenarioItem:
      type: object
      description: Упрощённое представление сценария (возвращается при create/update)
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        is_active:
          type: boolean
    ScenarioRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: Опрос клиента
        description:
          type:
            - string
            - 'null'
        alias:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Уникальный alias для запуска сценария
        tags:
          type:
            - array
            - 'null'
          items:
            type: string
            maxLength: 255
          description: Теги категоризации
        category_ids:
          type:
            - array
            - 'null'
          items:
            type: string
            format: uuid
          description: UUID категорий, к которым относится сценарий
        active_version_id:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID активной версии (должна принадлежать этому сценарию)
    VersionResource:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: scenario_versions
        attributes:
          $ref: '#/components/schemas/VersionAttributes'
        relationships:
          type: object
          properties:
            created_by:
              type:
                - object
                - 'null'
              properties:
                data:
                  $ref: '#/components/schemas/Actor'
            updated_by:
              type:
                - object
                - 'null'
              properties:
                data:
                  $ref: '#/components/schemas/Actor'
    VersionAttributes:
      type: object
      properties:
        scenario_id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/VersionStatus'
        schema_json:
          type: object
          description: Граф сценария (узлы и рёбра)
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    VersionItem:
      type: object
      description: Представление версии (возвращается при create/update)
      properties:
        id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        name:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/VersionStatus'
    VersionRequest:
      type: object
      required:
        - schema_json
      properties:
        name:
          type:
            - string
            - 'null'
          maxLength: 255
          example: v1.0
        status:
          $ref: '#/components/schemas/VersionStatus'
        schema_json:
          type: object
          description: |
            Граф сценария. Содержит массивы `nodes` и `edges` в формате Vue Flow / React Flow.
          example:
            nodes:
              - id: node_start
                type: start
                data: {}
            edges: []
    VersionStatus:
      type: string
      enum:
        - draft
        - active
        - archived
      description: |
        - `draft` — черновик, не виден пользователям - `active` — активная версия - `archived` — архивная версия
    VersionRevision:
      type: object
      description: Снимок версии сценария (создаётся при каждом сохранении графа)
      properties:
        id:
          type: string
          format: uuid
        scenario_version_id:
          type: string
          format: uuid
        schema_json:
          type: object
          description: Граф сценария на момент создания ревизии
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        created_by:
          $ref: '#/components/schemas/Actor'
    CategoryResource:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: category
        attributes:
          $ref: '#/components/schemas/CategoryAttributes'
        relationships:
          type: object
          properties:
            parent:
              type:
                - object
                - 'null'
              description: Родительская категория (если есть)
              properties:
                data:
                  $ref: '#/components/schemas/CategoryResource'
            created_by:
              type:
                - object
                - 'null'
              properties:
                data:
                  $ref: '#/components/schemas/Actor'
            updated_by:
              type:
                - object
                - 'null'
              properties:
                data:
                  $ref: '#/components/schemas/Actor'
    CategoryAttributes:
      type: object
      properties:
        parent_id:
          type:
            - string
            - 'null'
          format: uuid
        name:
          type: string
          example: Онбординг
        is_active:
          type: boolean
        scenarios_count:
          type: integer
          description: Количество сценариев в категории
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    CategoryRequest:
      type: object
      required:
        - name
        - is_active
      properties:
        parent_id:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID родительской категории (не может быть самой категорией или её потомком)
        name:
          type: string
          maxLength: 255
          description: Уникальное название категории
          example: Онбординг
        is_active:
          type: boolean
          example: true
    RunnerStartRequest:
      type: object
      description: |
        Необходимо передать ровно один из трёх параметров: `scenario_id`, `version_id` или `alias`.
      properties:
        scenario_id:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID сценария — будет выбрана активная версия
        version_id:
          type:
            - string
            - 'null'
          format: uuid
          description: UUID конкретной версии сценария
        alias:
          type:
            - string
            - 'null'
          maxLength: 255
          description: Строковый псевдоним сценария
        context:
