        '200':
          description: Группа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    put:
      tags: [Группы]
      summary: Обновить группу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '200':
          description: Группа обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    delete:
      tags: [Группы]
      summary: Удалить группу
      responses:
        '204':
          description: Удалено

  # ── Участники групп ────────────────────────────────────────────────────────
  /users/groups/{group}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Участники групп]
      summary: Список участников группы
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              search:
                type: string
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список участников
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
    post:
      tags: [Участники групп]
      summary: Добавить участников в группу
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Участники добавлены

  /users/groups/{group}/members/{user}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Участники групп]
      summary: Удалить участника из группы
      responses:
        '204':
          description: Удалено

  # ── Роли ───────────────────────────────────────────────────────────────────
  /users/roles:
    get:
      tags: [Роли]
      summary: Список ролей
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              search:
                type: string
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
    post:
      tags: [Роли]
      summary: Создать роль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'

  /users/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      tags: [Роли]
      summary: Просмотр роли
      responses:
        '200':
          description: Роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
    put:
      tags: [Роли]
      summary: Обновить роль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: Роль обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
    delete:
      tags: [Роли]
      summary: Удалить роль
      responses:
        '204':
          description: Удалено

  # ── Права доступа (permissions) ─────────────────────────────────────────────
  /users/permissions:
    get:
      tags: [Роли]
      summary: Список всех прав доступа
      responses:
        '200':
          description: Список прав
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        guard_name:
                          type: string

  # ══════════════════════════════════════════════════════════════════════════
  # EMBED AUTH
  # ══════════════════════════════════════════════════════════════════════════

  /embed/register:
    post:
      tags: [Регистрация]
      summary: Зарегистрировать пользователя и получить launch-токен
      description: >
        Регистрирует пользователя (или возвращает существующего по `external_id`)
        и выдаёт одноразовый `launch_token` для последующего обмена на JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id, project_id]
              properties:
                external_id:
                  type: string
                  description: Уникальный идентификатор пользователя во внешней системе
                project_id:
                  type: string
                  format: uuid
                name:
                  type: string
                email:
                  type: string
                  format: email
                meta:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Launch-токен выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  launch_token:
                    type: string
                    description: Одноразовый токен (TTL 5 минут)
        '422':
          $ref: '#/components/responses/ValidationError'

  /embed/auth/token:
    post:
      tags: [Авторизация iframe]
      summary: Обменять launch-токен на access/refresh токены
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [launch_token]
              properties:
                launch_token:
                  type: string
      responses:
        '200':
          description: JWT-токены выданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /embed/auth/refresh:
    post:
      tags: [Авторизация iframe]
      summary: Обновить access-токен через refresh-токен
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /embed/auth/logout:
    post:
      tags: [Авторизация iframe]
      summary: Выход — инвалидация refresh-токена
      responses:
        '204':
          description: Выполнено

# ─────────────────────────────────────────────────────────────────────────────
# КОМПОНЕНТЫ
# ─────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Параметры ─────────────────────────────────────────────────────────────
  parameters:
    ScenarioId:
      name: scenario
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: category
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DirectoryId:
      name: directory
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: group
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: role
      in: path
      required: true
      schema:
        type: integer

    # Устаревшие flat-параметры пагинации (legacy, некоторые эндпоинты)
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    # JSON:API-стиль пагинации (предпочтительный)
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  # ── Ответы ────────────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: No query results for model.
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  # ── Схемы ─────────────────────────────────────────────────────────────────
  schemas:

    # Общие
    JsonApiCollection:
      type: object
      properties:
        meta:
          type: object
          properties:
            total:
              type: integer
            per_page:
              type: integer
            current_page:
              type: integer
            last_page:
              type: integer
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: [string, 'null']
            next:
              type: [string, 'null']

    # ── Сценарии ──────────────────────────────────────────────────────────
    Scenario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        tag:
          type: string
          nullable: true
        is_active:
          type: boolean
        active_version_id:
          type: string
          format: uuid
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScenarioVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, active, archived]
        nodes_json:
          type: string
          description: JSON граф узлов (Vue Flow nodes)
        edges_json:
          type: string
          description: JSON граф рёбер (Vue Flow edges)
        schema_json:
          type: string
          description: JSON схема блоков
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CatalogItem:
      type: object
      properties:
        type:
          type: string
          enum: [category, scenario]
        id:
          type: string
          format: uuid
        name:
          type: string
        children_count:
          type: integer
          description: Только для type=category
        is_active:
          type: boolean
          description: Только для type=scenario

    ScenarioRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scenario_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        current_node_id:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    ScenarioRunStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        node_id:
          type: string
        node_type:
          type: string
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    RunStep:
      type: object
      description: Текущий шаг прогона, возвращаемый player-сервисом
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        node_type:
          type: string
          enum: [block, condition, end, scenario_link]
        node_id:
          type: string
        data:
          type: object
          additionalProperties: true
          description: Данные узла (заголовок, поля и т.д.)

    # ── Справочники ────────────────────────────────────────────────────────
    Directory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        published_version_id:
          type: string
          format: uuid
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DirectoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        category_ids:
          type: array
          items:
            type: string
            format: uuid

    DirectoryVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        directory_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, published]
        items_count:
          type: integer
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    DirectoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        directory_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
        value:
          type: string
        extra:
          type: object
          additionalProperties: true
          nullable: true
        children_count:
          type: integer
        created_at:
          type: string
          format: date-time

    DirectoryItemInput:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        extra:
          type: object
          additionalProperties: true

    # ── Действия ──────────────────────────────────────────────────────────
    Action:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          description: Тип действия (email, http, crm и т.д.)
        config:
          type: object
          additionalProperties: true
        credential_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ActionInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        config:
          type: object
          additionalProperties: true
        credential_id:
          type: string
          format: uuid
          nullable: true

    ActionCredential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time

    ActionCredentialInput:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Конфиденциальные поля (токены, пароли и т.д.) — не возвращаются в GET

    # ── Прокси / Вебхуки ──────────────────────────────────────────────────
    ProxyEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        handler:
          type: string
          description: FQCN handler-класса
        is_active:
          type: boolean
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    WebhookField:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [string, integer, boolean, list, array]
        required:
          type: boolean
        example:
          nullable: true
        filterable:
          type: boolean

    WebhookLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        endpoint_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [received, processed, failed, retrying]
        payload:
          type: object
          additionalProperties: true
        error:
          type: string
          nullable: true
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time

    # ── Проекты ───────────────────────────────────────────────────────────
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        is_active:
          type: boolean

    # ── Пользователи ──────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        role_ids:
          type: array
          items:
            type: integer
        group_ids:
          type: array
          items:
            type: string
            format: uuid

    UserToken:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Группы ────────────────────────────────────────────────────────────
    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        members_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # ── Роли ──────────────────────────────────────────────────────────────
    Role:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        guard_name:
          type: string
        permissions:
          type: array
          items:
            type: string
          description: Имена прав доступа
        users_count:
          type: integer

    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    # ── Категории (общая схема) ────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true
        children_count:
          type: integer
        created_at:
          type: string
          format: date-time

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          nullable: true

    # ── Embed Auth ─────────────────────────────────────────────────────────
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access-токен (короткоживущий)
        refresh_token:
          type: string
          description: Refresh-токен для ротации
        expires_in:
          type: integer
          description: TTL access-токена в секундах
