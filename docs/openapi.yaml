openapi: 3.1.0

info:
  title: Platform API
  description: API платформы сценариев
  version: 2.0.0

servers:
  - url: /api
    description: Основной сервер

security:
  - BearerAuth: []

x-tagGroups:
  - name: Модуль «Сценарии»
    tags:
      - Каталог
      - Сценарии
      - Версии
      - Категории сценариев
      - Запуск
      - Прогоны
      - Опросы
  - name: Модуль «Справочники»
    tags:
      - Справочники
      - Версии справочника
      - Элементы справочника
      - Категории справочников
  - name: Модуль «Действия»
    tags:
      - Действия
      - Учётные данные
  - name: Модуль «Прокси / Вебхуки»
    tags:
      - Вебхуки (admin)
      - Вебхуки (public)
  - name: Модуль «Проекты»
    tags:
      - Проекты
  - name: Пользователи и роли
    tags:
      - Пользователи
      - Токены пользователей
      - Группы
      - Участники групп
      - Роли
  - name: Embed Auth
    tags:
      - Регистрация
      - Авторизация iframe

tags:
  # Сценарии
  - name: Каталог
    description: Сводный каталог категорий и сценариев
  - name: Сценарии
    description: CRUD-операции над сценариями
  - name: Версии
    description: Управление версиями сценариев
  - name: Категории сценариев
    description: CRUD-операции над категориями сценариев
  - name: Запуск
    description: Запуск сценария и прохождение шагов
  - name: Прогоны
    description: Административный журнал прогонов — просмотр, создание, управление
  - name: Опросы
    description: Список прогонов и просмотр состояния прогона
  # Справочники
  - name: Справочники
    description: CRUD-операции над справочниками
  - name: Версии справочника
    description: Управление версиями справочника (черновики, публикация)
  - name: Элементы справочника
    description: CRUD-операции над элементами опубликованной версии справочника
  - name: Категории справочников
    description: CRUD-операции над категориями справочников
  # Действия
  - name: Действия
    description: Управление переиспользуемыми шагами-действиями
  - name: Учётные данные
    description: Управление учётными данными (credentials) для действий
  # Прокси
  - name: Вебхуки (admin)
    description: Администрирование вебхук-эндпоинтов, просмотр логов
  - name: Вебхуки (public)
    description: Публичный приём вебхуков (без авторизации)
  # Проекты
  - name: Проекты
    description: Управление проектами (тенантами)
  # Пользователи
  - name: Пользователи
    description: CRUD-операции над пользователями системы
  - name: Токены пользователей
    description: Управление API-токенами пользователей
  - name: Группы
    description: CRUD-операции над группами пользователей
  - name: Участники групп
    description: Управление составом групп
  - name: Роли
    description: CRUD-операции над ролями доступа (Spatie Permission)
  # Embed Auth
  - name: Регистрация
    description: Регистрация пользователя в проекте и выдача одноразового launch-токена
  - name: Авторизация iframe
    description: Обмен launch-токена на access/refresh токены, ротация и выход

# ─────────────────────────────────────────────────────────────────────────────
# ПУТИ
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════════════════════════════════
  # СЦЕНАРИИ
  # ══════════════════════════════════════════════════════════════════════════

  # ── Каталог ────────────────────────────────────────────────────────────────
  /scenarios/catalog:
    get:
      tags: [Каталог]
      summary: Сводный каталог (категории + сценарии)
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              q:
                type: string
                example: оформление
              parent_id:
                type: string
                format: uuid
                nullable: true
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Список элементов каталога
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Сценарии ───────────────────────────────────────────────────────────────
  /scenarios:
    get:
      tags: [Сценарии]
      summary: Список сценариев
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              search:
                type: string
              is_active:
                type: boolean
              active_only:
                type: boolean
                default: true
              tag:
                type: string
              category_id:
                type: string
                format: uuid
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список сценариев
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Scenario'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Сценарии]
      summary: Создать сценарий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                tag:
                  type: string
                is_active:
                  type: boolean
                  default: false
                category_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Сценарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scenarios/{scenario}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Сценарии]
      summary: Просмотр сценария
      responses:
        '200':
          description: Сценарий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Сценарии]
      summary: Обновить сценарий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                tag:
                  type: string
                is_active:
                  type: boolean
                category_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Сценарий обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Сценарии]
      summary: Удалить сценарий
      responses:
        '204':
          description: Удалено

  /scenarios/{scenario}/copy:
    post:
      tags: [Сценарии]
      summary: Дублировать сценарий
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      responses:
        '201':
          description: Копия сценария создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'

  # ── Версии ─────────────────────────────────────────────────────────────────
  /scenarios/{scenario}/versions:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Версии]
      summary: Список версий сценария
      responses:
        '200':
          description: Список версий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioVersion'
    post:
      tags: [Версии]
      summary: Создать новую версию (черновик)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nodes_json:
                  type: string
                edges_json:
                  type: string
                schema_json:
                  type: string
      responses:
        '201':
          description: Версия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioVersion'

  /scenarios/{scenario}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
      - $ref: '#/components/parameters/VersionId'
    get:
      tags: [Версии]
      summary: Просмотр версии
      responses:
        '200':
          description: Версия сценария
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioVersion'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Версии]
      summary: Обновить версию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodes_json:
                  type: string
                edges_json:
                  type: string
                schema_json:
                  type: string
      responses:
        '200':
          description: Версия обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioVersion'
    delete:
      tags: [Версии]
      summary: Удалить черновик версии
      responses:
        '204':
          description: Удалено

  /scenarios/{scenario}/versions/{version}/activate:
    post:
      tags: [Версии]
      summary: Активировать версию
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Версия активирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioVersion'

  /scenarios/{scenario}/versions/{version}/archive:
    post:
      tags: [Версии]
      summary: Архивировать версию
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Версия архивирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioVersion'

  # ── Категории сценариев ────────────────────────────────────────────────────
  /scenarios/categories:
    get:
      tags: [Категории сценариев]
      summary: Список категорий сценариев
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              parent_id:
                type: string
                format: uuid
                nullable: true
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
    post:
      tags: [Категории сценариев]
      summary: Создать категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /scenarios/categories/{category}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags: [Категории сценариев]
      summary: Просмотр категории
      responses:
        '200':
          description: Категория
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    put:
      tags: [Категории сценариев]
      summary: Обновить категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Категория обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags: [Категории сценариев]
      summary: Удалить категорию
      responses:
        '204':
          description: Удалено

  # ── Запуск ─────────────────────────────────────────────────────────────────
  /scenarios/{scenario}/run:
    post:
      tags: [Запуск]
      summary: Запустить сценарий
      parameters:
        - $ref: '#/components/parameters/ScenarioId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  additionalProperties: true
                  description: Произвольный начальный контекст (переменные)
      responses:
        '200':
          description: Прогон запущен, возвращается первый шаг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStep'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scenario-runs/{run}/step:
    post:
      tags: [Запуск]
      summary: Выполнить шаг прогона
      parameters:
        - name: run
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: object
                  additionalProperties: true
                  description: Данные из формы текущего шага
                transition:
                  type: string
                  description: ID целевого узла (для condition-нод)
      responses:
        '200':
          description: Следующий шаг или завершение прогона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStep'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scenario-runs/{run}/restart:
    post:
      tags: [Запуск]
      summary: Перезапустить прогон с начала
      parameters:
        - name: run
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Прогон перезапущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStep'

  /scenario-runs/{run}/state:
    get:
      tags: [Запуск]
      summary: Текущее состояние прогона
      parameters:
        - name: run
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Состояние прогона
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStep'

  # ── Прогоны (admin) ────────────────────────────────────────────────────────
  /scenario-runs:
    get:
      tags: [Прогоны]
      summary: Список прогонов (административный)
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              scenario_id:
                type: string
                format: uuid
              status:
                type: string
                enum: [pending, running, completed, failed, cancelled]
              user_id:
                type: string
                format: uuid
              search:
                type: string
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список прогонов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ScenarioRun'
    post:
      tags: [Прогоны]
      summary: Создать прогон (административно)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_id]
              properties:
                scenario_id:
                  type: string
                  format: uuid
                context:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Прогон создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'

  /scenario-runs/{run}:
    parameters:
      - name: run
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Прогоны]
      summary: Просмотр прогона
      responses:
        '200':
          description: Прогон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'
    delete:
      tags: [Прогоны]
      summary: Удалить прогон
      responses:
        '204':
          description: Удалено

  /scenario-runs/{run}/cancel:
    post:
      tags: [Прогоны]
      summary: Отменить прогон
      parameters:
        - name: run
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Прогон отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'

  /scenario-runs/{run}/steps:
    get:
      tags: [Прогоны]
      summary: Шаги прогона (audit log)
      parameters:
        - name: run
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список шагов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioRunStep'

  # ── Опросы ─────────────────────────────────────────────────────────────────
  /surveys:
    get:
      tags: [Опросы]
      summary: Список прогонов (опросная точка зрения)
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              scenario_id:
                type: string
                format: uuid
              status:
                type: string
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список прогонов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ScenarioRun'

  /surveys/{run}:
    get:
      tags: [Опросы]
      summary: Состояние прогона (опросная точка зрения)
      parameters:
        - name: run
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Прогон
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'

  # ══════════════════════════════════════════════════════════════════════════
  # СПРАВОЧНИКИ
  # ══════════════════════════════════════════════════════════════════════════

  /directories:
    get:
      tags: [Справочники]
      summary: Список справочников
      parameters:
        - name: filter
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
            properties:
              search:
                type: string
              category_id:
                type: string
                format: uuid
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список справочников
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/JsonApiCollection'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Directory'
    post:
      tags: [Справочники]
      summary: Создать справочник
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryInput'
      responses:
        '201':
          description: Справочник создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '422':
          $ref: '#/components/responses/ValidationError'

  /directories/{directory}:
    parameters:
      - $ref: '#/components/parameters/DirectoryId'
    get:
      tags: [Справочники]
      summary: Просмотр справочника
      responses:
        '200':
          description: Справочник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Справочники]
      summary: Обновить справочник
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectoryInput'
      responses:
        '200':
          description: Справочник обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
    delete:
      tags: [Справочники]
      summary: Удалить справочник
      responses:
        '204':
          description: Удалено

  # ── Версии справочника ─────────────────────────────────────────────────────
  /directories/{directory}/versions:
    parameters:
      - $ref: '#/components/parameters/DirectoryId'
    get:
      tags: [Версии справочника]
      summary: Список версий справочника
      responses:
        '200':
          description: Список версий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectoryVersion'
    post:
      tags: [Версии справочника]
      summary: Создать новую версию (черновик)
      responses:
        '201':
          description: Версия создана
          content:
            application/json:
              schema:
