openapi: 3.1.0

info:
  title: Platform API
  description: API платформы сценариев
  version: 1.0.0

servers:
  - url: /api
    description: Основной сервер

security:
  - BearerAuth: [ ]

x-tagGroups:
  - name: Модуль «Сценарии»
    tags:
      - Каталог
      - Сценарии
      - Версии
      - Категории
      - Запуск
      - Прогоны
      - Опросы
  - name: Пользователи
    tags:
      - Пользователи
  - name: Администрирование
    tags:
      - Проекты
      - Роли
      - Actions
  - name: Группы доступа
    tags:
      - Группы
  - name: Embed Auth
    tags:
      - Регистрация
      - Авторизация iframe

tags:
  - name: Каталог
    description: Сводный каталог категорий и сценариев
  - name: Сценарии
    description: CRUD-операции над сценариями
  - name: Версии
    description: Управление версиями сценариев
  - name: Категории
    description: CRUD-операции над категориями
  - name: Запуск
    description: Запуск сценария и прохождение шагов
  - name: Прогоны
    description: Административный журнал прогонов — просмотр, создание, управление
  - name: Опросы
    description: Список прогонов и просмотр состояния прогона
  - name: Пользователи
    description: CRUD-операции над пользователями системы
  - name: Проекты
    description: Управление проектами. Запись требует роль `project_admin`.
  - name: Роли
    description: Управление ролями (Spatie Permission). Роли назначаются пользователям и используются для авторизации (`project_admin` и др.).
  - name: Actions
    description: CRUD, выполнение и оркестрация actions через jobs, chain и batch.
  - name: Группы
    description: Управление группами доступа. Группы привязываются к категориям и сценариям для ограничения видимости.
  - name: Регистрация
    description: Регистрация пользователя в проекте и выдача одноразового launch-токена
  - name: Авторизация iframe
    description: Обмен launch-токена на access/refresh токены, ротация и выход

paths:
  /scenarios/catalog:
    $ref: './paths/catalog.yaml'

  /scenarios:
    $ref: './paths/scenarios.yaml#/collection'
  /scenarios/{scenario}:
    $ref: './paths/scenarios.yaml#/item'
  /scenarios/{scenario}/duplicate:
    $ref: './paths/scenarios.yaml#/duplicate'

  /scenarios/{scenario}/versions:
    $ref: './paths/versions.yaml#/collection'
  /scenarios/{scenario}/versions/{version}:
    $ref: './paths/versions.yaml#/item'

  /scenarios/categories:
    $ref: './paths/categories.yaml#/collection'
  /scenarios/categories/{category}:
    $ref: './paths/categories.yaml#/item'

  /scenarios/runner/start:
    $ref: './paths/runner.yaml#/start'
  /scenarios/runner/{runId}/jump:
    $ref: './paths/runner.yaml#/jump'

  /scenario-runs:
    $ref: './paths/runs.yaml#/collection'
  /scenario-runs/users:
    $ref: './paths/runs.yaml#/users'
  /scenario-runs/{runId}:
    $ref: './paths/runs.yaml#/item'
  /scenario-runs/{runId}/continue:
    $ref: './paths/runs.yaml#/continue'
  /scenario-runs/{runId}/jump:
    $ref: './paths/runs.yaml#/jump'

  /scenarios/surveys:
    $ref: './paths/surveys.yaml#/list'
  /scenarios/survey/{runId}:
    $ref: './paths/surveys.yaml#/item'

  /projects:
    $ref: './paths/projects.yaml#/collection'
  /projects/{project}:
    $ref: './paths/projects.yaml#/item'

  /roles:
    $ref: './paths/roles.yaml#/collection'
  /roles/{role}:
    $ref: './paths/roles.yaml#/item'

  /users:
    $ref: './paths/users.yaml#/collection'
  /users/{user}:
    $ref: './paths/users.yaml#/item'

  /groups:
    $ref: './paths/groups.yaml#/collection'
  /groups/{group}:
    $ref: './paths/groups.yaml#/item'
  /groups/{group}/members:
    $ref: './paths/users.yaml#/members'
  /groups/{group}/members/{user}:
    $ref: './paths/users.yaml#/memberItem'

  /actions:
    $ref: './paths/actions.yaml#/collection'
  /actions/{action}:
    $ref: './paths/actions.yaml#/item'
  /actions/{action}/execute:
    $ref: './paths/actions.yaml#/execute'
  /actions/{action}/run:
    $ref: './paths/actions.yaml#/run'
  /actions/{action}/schedule:
    $ref: './paths/actions.yaml#/schedule'

  /action-runs:
    $ref: './paths/action-runs.yaml#/collection'
  /action-runs/completed:
    $ref: './paths/action-runs.yaml#/completed'
  /action-runs/failed:
    $ref: './paths/action-runs.yaml#/failed'

  /project/{projectUuid}/user-register:
    $ref: './paths/embed-auth.yaml#/user-register'
  /embed/auth/exchange:
    $ref: './paths/embed-auth.yaml#/exchange'
  /embed/auth/refresh:
    $ref: './paths/embed-auth.yaml#/refresh'
  /embed/auth/logout:
    $ref: './paths/embed-auth.yaml#/logout'

