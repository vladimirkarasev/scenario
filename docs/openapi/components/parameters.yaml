ScenarioId:
  name: scenario
  in: path
  required: true
  description: UUID сценария
  schema:
    type: string
    format: uuid

VersionId:
  name: version
  in: path
  required: true
  description: UUID версии сценария
  schema:
    type: string
    format: uuid

CategoryId:
  name: category
  in: path
  required: true
  description: UUID категории
  schema:
    type: string
    format: uuid

RunId:
  name: runId
  in: path
  required: true
  description: UUID прогона
  schema:
    type: string
    format: uuid

PerPage:
  name: per_page
  in: query
  description: Количество записей на страницу (1–100, по умолчанию 15)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 15

Page:
  name: page
  in: query
  description: Номер страницы
  schema:
    type: integer
    minimum: 1
    default: 1

PageSize:
  name: page[size]
  in: query
  description: Количество записей на страницу — JSON:API (1–100, по умолчанию 15)
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 15

PageNumber:
  name: page[number]
  in: query
  description: Номер страницы — JSON:API
  schema:
    type: integer
    minimum: 1
    default: 1

IncludeUserRelations:
  name: include
  in: query
  description: >-
    JSON:API include связей через запятую. Поддерживаются `roles`, `groups`.
    Включённые объекты возвращаются в top-level `included`.
  schema:
    type: string
    example: roles,groups

FieldsGroups:
  name: fields[groups]
  in: query
  description: Sparse fieldset для включённых групп (поля через запятую).
  schema:
    type: string
    example: name,slug

FieldsRoles:
  name: fields[roles]
  in: query
  description: Sparse fieldset для включённых ролей (поля через запятую).
  schema:
    type: string
    example: name,title
