CategoryResource:
  type: object
  required: [ id, type, attributes ]
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      example: category
    attributes:
      $ref: '#/CategoryAttributes'
    relationships:
      type: object
      properties:
        parent:
          type: [ object, 'null' ]
          description: Родительская категория (если есть)
          properties:
            data:
              $ref: '#/CategoryResource'
        created_by:
          type: [ object, 'null' ]
          properties:
            data:
              $ref: './common.yaml#/Actor'
        updated_by:
          type: [ object, 'null' ]
          properties:
            data:
              $ref: './common.yaml#/Actor'

CategoryAttributes:
  type: object
  properties:
    parent_id:
      type: [ string, 'null' ]
      format: uuid
    name:
      type: string
      example: Онбординг
    is_active:
      type: boolean
    is_system:
      type: boolean
    is_workspace:
      type: boolean
    group_ids:
      type: array
      items:
        type: string
        format: uuid
    scenarios_count:
      type: integer
      description: Количество сценариев в категории
    created_at:
      type: [ string, 'null' ]
      format: date-time
    updated_at:
      type: [ string, 'null' ]
      format: date-time

CategoryRequest:
  type: object
  required: [ name, is_active ]
  properties:
    parent_id:
      type: [ string, 'null' ]
      format: uuid
      description: UUID родительской категории (не может быть самой категорией или её потомком)
    name:
      type: string
      maxLength: 255
      description: Уникальное название категории
      example: Онбординг
    is_active:
      type: boolean
      example: true
    group_ids:
      type: [array, 'null']
      items:
        type: string
        format: uuid
    inherit_to_descendants:
      type: [boolean, 'null']
    is_workspace:
      type: [boolean, 'null']
