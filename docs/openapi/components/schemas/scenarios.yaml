ScenarioResource:
  type: object
  required: [ id, type, attributes ]
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      example: scenarios
    attributes:
      $ref: '#/ScenarioAttributes'
    relationships:
      type: object
      properties:
        created_by:
          type: [ object, 'null' ]
          properties:
            data:
              $ref: './common.yaml#/Actor'
        updated_by:
          type: [ object, 'null' ]
          properties:
            data:
              $ref: './common.yaml#/Actor'

ScenarioAttributes:
  type: object
  properties:
    name:
      type: string
      example: Опрос клиента
    description:
      type: [ string, 'null' ]
    is_active:
      type: boolean
    alias:
      type: [ string, 'null' ]
      description: Уникальный псевдоним для запуска сценария по alias
    tags:
      type: [ array, 'null' ]
      items:
        type: string
      description: Теги категоризации
    active_version_id:
      type: [ string, 'null' ]
      format: uuid
    created_at:
      type: [ string, 'null' ]
      format: date-time
    updated_at:
      type: [ string, 'null' ]
      format: date-time

ScenarioItem:
  type: object
  description: Упрощённое представление сценария (возвращается при create/update)
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    is_active:
      type: boolean

ScenarioRequest:
  type: object
  required: [ name ]
  properties:
    name:
      type: string
      maxLength: 255
      example: Опрос клиента
    description:
      type: [ string, 'null' ]
    alias:
      type: [ string, 'null' ]
      maxLength: 255
      description: Уникальный alias для запуска сценария
    tags:
      type: [ array, 'null' ]
      items:
        type: string
        maxLength: 255
      description: Теги категоризации
    category_ids:
      type: [ array, 'null' ]
      items:
        type: string
        format: uuid
      description: UUID категорий, к которым относится сценарий
    active_version_id:
      type: [ string, 'null' ]
      format: uuid
      description: UUID активной версии (должна принадлежать этому сценарию)
