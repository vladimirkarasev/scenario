ActionResource:
  type: object
  required: [id, type, attributes]
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      const: actions
    attributes:
      $ref: '#/ActionAttributes'
    relationships:
      type: object
      properties:
        runs:
          type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/ActionRun'
        schedule:
          type: object
          required: [data]
          properties:
            data:
              oneOf:
                - $ref: '#/ActionSchedule'
                - type: 'null'

ActionAttributes:
  type: object
  required: [name, slug, code, type, is_active, input_fields, category_ids]
  properties:
    name:
      type: string
      example: Создать XML заявки
    slug:
      type: string
      example: create-lead-xml
    code:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      example: create_lead_xml
    description:
      type: [string, 'null']
    type:
      $ref: '#/ActionType'
    is_active:
      type: boolean
    config:
      type: [object, 'null']
      additionalProperties: true
    schema:
      type: [object, 'null']
      additionalProperties: true
    ui_schema:
      type: [object, 'null']
      additionalProperties: true
    input_fields:
      type: array
      items:
        $ref: '#/ActionInputField'
    category_ids:
      type: array
      items:
        type: string
        format: uuid
    created_at:
      type: [string, 'null']
      format: date-time
    updated_at:
      type: [string, 'null']
      format: date-time

ActionEnvelope:
  type: object
  required: [data, meta]
  properties:
    data:
      $ref: '#/ActionResource'
    meta:
      $ref: './common.yaml#/ApiMeta'

ActionType:
  type: string
  enum:
    - email
    - template_file
    - proxy_request
    - excel_report
    - directory_import
    - scenario_run_result

ActionInputField:
  type: object
  required: [key, type]
  properties:
    key:
      type: string
      pattern: '^[a-z][a-z0-9_]*$'
      example: client_uuid
    label:
      type: [string, 'null']
      example: UUID клиента
    type:
      type: string
      enum: [string, number, boolean, uuid, email]
    required:
      type: boolean
      default: false
    default: {}

ActionRequest:
  type: object
  required: [name, slug, code, type, is_active]
  properties:
    name:
      type: string
      maxLength: 255
      example: Создать отчёт по заявкам
    slug:
      type: string
      maxLength: 255
      example: leads-report
    code:
      type: string
      maxLength: 64
      pattern: '^[a-z][a-z0-9_]*$'
      example: leads_report
    description:
      type: [string, 'null']
    type:
      $ref: '#/ActionType'
    is_active:
      type: boolean
    config:
      type: [object, 'null']
      additionalProperties: true
    schema:
      type: [object, 'null']
      additionalProperties: true
    ui_schema:
      type: [object, 'null']
      additionalProperties: true
    input_fields:
      type: [array, 'null']
      items:
        $ref: '#/ActionInputField'
    category_ids:
      type: [array, 'null']
      items:
        type: string
        format: uuid

ActionTypeField:
  type: object
  required: [key, label, type, required]
  additionalProperties: true
  properties:
    key:
      type: string
    label:
      type: string
    type:
      type: string
    required:
      type: boolean
    description:
      type: [string, 'null']
    placeholder:
      type: [string, 'null']
    default: {}
    options:
      type: array
      items:
        type: object
        additionalProperties: true

ActionTypeMeta:
  type: object
  required: [value, label, default_code, fields]
  properties:
    value:
      $ref: '#/ActionType'
    label:
      type: string
    default_code:
      type: string
    fields:
      type: array
      items:
        $ref: '#/ActionTypeField'

ActionTypeListResponse:
  type: object
  required: [items, meta]
  properties:
    items:
      type: array
      items:
        $ref: '#/ActionTypeMeta'
    meta:
      $ref: './common.yaml#/ApiMeta'

ActionRunRequest:
  type: object
  required: [mode, actions]
  properties:
    mode:
      type: string
      enum: [parallel, sequential]
    actions:
      allOf:
        - $ref: '#/ActionCodeMap'
      minProperties: 1
    before:
      $ref: '#/ActionCodeMap'
    after:
      $ref: '#/ActionCodeMap'
    on_error:
      $ref: '#/ActionCodeMap'
    input:
      type: [object, 'null']
      additionalProperties: true
    schedule:
      type: [object, 'null']
      properties:
        cron:
          type: string
          maxLength: 120
        timezone:
          type: [string, 'null']
          example: Europe/Moscow

ActionCodeMap:
  type: object
  description: Объект `code => UUID action`.
  additionalProperties:
    type: string
    format: uuid
  example:
    prepare_report: 8a3abf99-7861-4c62-a467-fc90bc8c519f

ActionRunResponse:
  type: object
  required: [status, meta]
  properties:
    status:
      type: string
      enum: [queued, scheduled]
    queued:
      type: integer
      minimum: 0
    schedule_id:
      type: integer
    next_run_at:
      type: [string, 'null']
      format: date-time
    error:
      type: string
    errors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    meta:
      $ref: './common.yaml#/ApiMeta'

ActionRunRejectedResponse:
  type: object
  required: [status]
  properties:
    status:
      type: string
      const: error
    error:
      type: string
    errors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

ActionScheduleRequest:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
    cron:
      type: [string, 'null']
      maxLength: 120
      example: '0 9 * * 1-5'
    timezone:
      type: [string, 'null']
      example: Europe/Moscow
    input:
      type: [object, 'null']
      additionalProperties: true
    options:
      type: [object, 'null']
      additionalProperties: true
    settings:
      type: [object, 'null']
      additionalProperties: true

ActionSchedule:
  type: object
  required: [action_id, enabled, timezone]
  properties:
    id:
      type: integer
    action_id:
      type: string
      format: uuid
    enabled:
      type: boolean
    cron:
      type: [string, 'null']
    timezone:
      type: string
    input:
      type: [object, 'null']
      additionalProperties: true
    options:
      type: [object, 'null']
      additionalProperties: true
    settings:
      type: [object, 'null']
      additionalProperties: true
    last_run_at:
      type: [string, 'null']
      format: date-time
    next_run_at:
      type: [string, 'null']
      format: date-time
    created_at:
      type: [string, 'null']
      format: date-time
    updated_at:
      type: [string, 'null']
      format: date-time

ActionScheduleResource:
  type: object
  required: [id, type, attributes]
  properties:
    id:
      type: string
    type:
      type: string
      const: action-schedules
    attributes:
      $ref: '#/ActionSchedule'

ActionScheduleEnvelope:
  type: object
  required: [data, meta]
  properties:
    data:
      oneOf:
        - $ref: '#/ActionScheduleResource'
        - type: 'null'
    meta:
      $ref: './common.yaml#/ApiMeta'

ActionRun:
  type: object
  required: [id, action_id, status, attempts_count]
  properties:
    id:
      type: integer
    action_id:
      type: string
      format: uuid
    action_name:
      type: [string, 'null']
    action_key:
      type: [string, 'null']
    status:
      type: string
      enum: [pending, running, success, failed, skipped]
    input:
      type: [object, 'null']
      additionalProperties: true
    output:
      type: [object, 'null']
      additionalProperties: true
    error:
      type: [string, 'null']
    reason:
      type: [string, 'null']
    attempts_count:
      type: integer
      minimum: 0
    started_at:
      type: [string, 'null']
      format: date-time
    finished_at:
      type: [string, 'null']
      format: date-time
    duration_ms:
      type: [integer, 'null']
    created_at:
      type: [string, 'null']
      format: date-time

ActionRunListResponse:
  type: object
  required: [items, meta]
  properties:
    items:
      type: array
      items:
        $ref: '#/ActionRun'
    meta:
      allOf:
        - $ref: './common.yaml#/ApiMeta'
        - type: object
          required: [total]
          properties:
            total:
              type: integer

ActionFeedFolder:
  type: object
  required: [type, id, name, is_system, children_count]
  properties:
    type:
      type: string
      const: folder
    id:
      type: string
      format: uuid
    name:
      type: string
    parent_id:
      type: [string, 'null']
      format: uuid
    is_system:
      type: boolean
    children_count:
      type: integer
    created_at:
      type: [string, 'null']
      format: date-time
    updated_at:
      type: [string, 'null']
      format: date-time

ActionFeedItem:
  type: object
  required: [type, id, name, slug, action_type, action_type_label, is_active]
  properties:
    type:
      type: string
      const: action
    id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    action_type:
      $ref: '#/ActionType'
    action_type_label:
      type: string
    is_active:
      type: boolean
    description:
      type: [string, 'null']
    schedule:
      oneOf:
        - type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
            cron:
              type: [string, 'null']
            next_run_at:
              type: [string, 'null']
              format: date-time
        - type: 'null'
    created_at:
      type: [string, 'null']
      format: date-time
    updated_at:
      type: [string, 'null']
      format: date-time

ActionFeedResponse:
  type: object
  required: [data, pagination, meta]
  properties:
    data:
      type: array
      items:
        oneOf:
          - $ref: '#/ActionFeedFolder'
          - $ref: '#/ActionFeedItem'
        discriminator:
          propertyName: type
    pagination:
      type: object
      required: [current_page, last_page, per_page, total, folders_total, items_total]
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        folders_total:
          type: integer
        items_total:
          type: integer
    meta:
      $ref: './common.yaml#/ApiMeta'

ActionCredentialType:
  type: string
  enum: [none, bearer, basic, api_key, oauth2_placeholder]

ActionCredential:
  type: object
  required: [id, name, type, masked_secrets, has_secrets]
  properties:
    id:
      type: integer
    name:
      type: string
    type:
      $ref: '#/ActionCredentialType'
    config:
      type: [object, 'null']
      additionalProperties: true
    masked_secrets:
      type: object
      additionalProperties:
        type: string
    has_secrets:
      type: boolean
    created_at:
      type: [string, 'null']
      format: date-time
    updated_at:
      type: [string, 'null']
      format: date-time

ActionCredentialRequest:
  type: object
  required: [name, type]
  properties:
    name:
      type: string
      maxLength: 255
    type:
      $ref: '#/ActionCredentialType'
    config:
      type: [object, 'null']
      additionalProperties: true
    secrets:
      type: [object, 'null']
      additionalProperties: true
      writeOnly: true

ActionCredentialListResponse:
  type: object
  required: [items, meta]
  properties:
    items:
      type: array
      items:
        $ref: '#/ActionCredential'
    meta:
      $ref: './common.yaml#/ApiMeta'

ActionCredentialItemResponse:
  type: object
  required: [item, meta]
  properties:
    item:
      $ref: '#/ActionCredential'
    meta:
      $ref: './common.yaml#/ApiMeta'

ActionScheduleListItem:
  type: object
  required: [id, enabled, timezone]
  properties:
    id:
      type: integer
    enabled:
      type: boolean
    cron:
      type: [string, 'null']
    timezone:
      type: string
    last_run_at:
      type: [string, 'null']
      format: date-time
    next_run_at:
      type: [string, 'null']
      format: date-time
    action:
      oneOf:
        - type: object
          required: [id, name, code, type, is_active]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            code:
              type: string
            type:
              $ref: '#/ActionType'
            is_active:
              type: boolean
        - type: 'null'

ActionScheduleListResponse:
  type: object
  required: [items, meta]
  properties:
    items:
      type: array
      items:
        $ref: '#/ActionScheduleListItem'
    meta:
      allOf:
        - $ref: './common.yaml#/ApiMeta'
        - type: object
          required: [total]
          properties:
            total:
              type: integer

DirectorySyncScheduleRequest:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
    cron:
      type: [string, 'null']
      maxLength: 120
    timezone:
      type: [string, 'null']

DirectorySyncSchedule:
  type: object
  required: [enabled, timezone]
  properties:
    enabled:
      type: boolean
    cron:
      type: [string, 'null']
    timezone:
      type: string
    last_run_at:
      type: [string, 'null']
      format: date-time
    next_run_at:
      type: [string, 'null']
      format: date-time

DirectorySyncScheduleResponse:
  type: object
  required: [data, meta]
  properties:
    data:
      oneOf:
        - $ref: '#/DirectorySyncSchedule'
        - type: 'null'
    meta:
      $ref: './common.yaml#/ApiMeta'

TemplateFileActionConfig:
  type: object
  additionalProperties: true
  properties:
    template:
      type: string
    file_name:
      type: [string, 'null']

ProxyRequestActionConfig:
  type: object
  additionalProperties: true

ExcelReportActionConfig:
  type: object
  additionalProperties: true

DirectoryImportActionConfig:
  type: object
  additionalProperties: true
