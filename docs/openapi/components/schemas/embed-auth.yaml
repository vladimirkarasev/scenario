EmbedAuthExchangeRequest:
  type: object
  required: [ token ]
  properties:
    token:
      type: string
      description: Значение `launch_token`, полученное от `POST /api/users/launch-token`
      example: a3f8c2d1e9b7...

EmbedAuthRefreshRequest:
  type: object
  required: [ refresh_token ]
  properties:
    refresh_token:
      type: string
      description: Действующий refresh-токен
      example: 4f9a1b2c3d5e...

EmbedTokenPairResponse:
  type: object
  required: [ access_token, refresh_token, token_type, expires_in ]
  properties:
    access_token:
      type: string
      description: Sanctum Bearer-токен для API-запросов (TTL 30 мин)
      example: 1|Abc123...
    refresh_token:
      type: string
      description: Токен для ротации (TTL 7 дней). Хранить только в памяти JS
      example: 4f9a1b2c3d5e...
    token_type:
      type: string
      example: Bearer
    expires_in:
      type: integer
      description: Время жизни access-токена в секундах
      example: 1800
