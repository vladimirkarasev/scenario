ProjectUserRegisterRequest:
  type: object
  required: [login, name, roles]
  properties:
    login:
      type: string
      maxLength: 255
      description: Логин пользователя во внешней системе
      example: user_123
    email:
      type: string
      format: email
      nullable: true
      description: Email. Если не передан — генерируется фейковый `embed-*@local.invalid`
      example: user@example.com
    name:
      type: string
      maxLength: 255
      description: Отображаемое имя
      example: Иван Иванов
    external_id:
      type: string
      nullable: true
      maxLength: 255
      description: ID пользователя во внешней системе (CRM, ERP и т.п.)
      example: crm_user_123
    roles:
      type: array
      minItems: 1
      items:
        type: string
        maxLength: 100
      description: Роли пользователя в контексте данного проекта
      example: [client, manager]
    group:
      type: object
      nullable: true
      description: >
        Группа доступа пользователя. Если группа с таким `slug` не существует — создаётся автоматически.
        Пользователь добавляется в группу. Передавать при каждом вызове, чтобы поддерживать актуальность состава.
      required: [slug, name]
      properties:
        slug:
          type: string
          maxLength: 255
          description: Уникальный идентификатор группы (буквы, цифры, дефис, подчёркивание)
          example: sales_team
        name:
          type: string
          maxLength: 255
          description: Отображаемое название группы
          example: Отдел продаж
        ext_id:
          type: string
          nullable: true
          maxLength: 255
          description: Идентификатор группы во внешней системе
          example: crm_group_42

IframeLaunchTokenResponse:
  type: object
  required: [iframe_launch_token, expires_in]
  properties:
    iframe_launch_token:
      type: string
      description: Одноразовый токен для передачи в iframe через `postMessage`
      example: a3f8c2d1e9b7...
    expires_in:
      type: integer
      description: Время жизни токена в секундах
      example: 300

EmbedAuthExchangeRequest:
  type: object
  required: [token]
  properties:
    token:
      type: string
      description: Значение `iframe_launch_token`, полученное от `/user-register`
      example: a3f8c2d1e9b7...

EmbedAuthRefreshRequest:
  type: object
  required: [refresh_token]
  properties:
    refresh_token:
      type: string
      description: Действующий refresh-токен
      example: 4f9a1b2c3d5e...

EmbedTokenPairResponse:
  type: object
  required: [access_token, refresh_token, token_type, expires_in]
  properties:
    access_token:
      type: string
      description: Sanctum Bearer-токен для API-запросов (TTL 30 мин)
      example: 1|Abc123...
    refresh_token:
      type: string
      description: Токен для ротации (TTL 7 дней). Хранить только в памяти JS
      example: 4f9a1b2c3d5e...
    token_type:
      type: string
      example: Bearer
    expires_in:
      type: integer
      description: Время жизни access-токена в секундах
      example: 1800
