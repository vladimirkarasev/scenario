Actor:
  type: [ object, 'null' ]
  description: Пользователь (автор создания или изменения)
  properties:
    id:
      type: integer
    name:
      type: [ string, 'null' ]
    login:
      type: [ string, 'null' ]

JsonApiCollection:
  type: object
  required: [ data ]
  properties:
    data:
      type: array
      items:
        type: object
    meta:
      type: object
      description: Мета-данные (пагинация и др.)
    links:
      type: object

JsonApiResourceEnvelope:
  type: object
  required: [ data ]
  properties:
    data:
      type: object
      required: [ id, type, attributes ]
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
        relationships:
          type: object

Pagination:
  type: object
  required: [ current_page, last_page, per_page, total ]
  properties:
    current_page:
      type: integer
      example: 1
    last_page:
      type: integer
      example: 5
    per_page:
      type: integer
      example: 20
    total:
      type: integer
      example: 94

ApiMeta:
  type: object
  description: >
    Сквозной блок meta для API-модулей с единым контрактом ответов.
  required: [ timestamp, requestId ]
  properties:
    timestamp:
      type: string
      format: date-time
      description: Момент формирования ответа (ISO 8601).
      example: '2026-07-02T10:00:00+00:00'
    requestId:
      type: string
      description: Идентификатор запроса (echo заголовка `X-Request-Id`).
      example: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d

CollectionMeta:
  description: >
    meta для JSON:API коллекции: пагинация плюс сквозные timestamp и requestId.
  allOf:
    - $ref: '#/Pagination'
    - $ref: '#/ApiMeta'

ApiError:
  type: object
  description: Одна ошибка в формате JSON:API.
  required: [ status, code, title, detail ]
  properties:
    status:
      type: string
      description: HTTP-статус строкой.
      example: '404'
    code:
      type: string
      description: Машиночитаемый код ошибки из enum соответствующего модуля.
      example: ACTION_CATEGORY_NOT_FOUND
    title:
      type: string
      description: Краткий заголовок.
      example: Раздел не найден
    detail:
      type: string
      description: Человекочитаемое описание.
      example: Запрошенный ресурс не найден в текущем проекте.
    source:
      type: object
      description: Указатель на источник ошибки (для ошибок валидации).
      properties:
        pointer:
          type: string
          example: /data/attributes/login

ApiErrorResponse:
  type: object
  description: Единый конверт API-ошибки.
  required: [ errors, meta ]
  properties:
    errors:
      type: array
      items:
        $ref: '#/ApiError'
    meta:
      $ref: '#/ApiMeta'

ErrorResponse:
  type: object
  properties:
    message:
      type: string
      example: Ресурс не найден.

ValidationErrorResponse:
  type: object
  properties:
    message:
      type: string
      example: Поле name обязательно для заполнения.
    errors:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      example:
        name:
          - Поле name обязательно для заполнения.
