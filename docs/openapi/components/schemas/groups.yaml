UserGroup:
  type: object
  required: [ id, type, attributes ]
  properties:
    id:
      type: string
      format: uuid
    type:
      type: string
      example: groups
    attributes:
      $ref: '#/UserGroupAttributes'
    relationships:
      type: object
      description: >
        Авторы создания/изменения (users). Linkage (type+id); сами пользователи
        приходят в top-level `included` при запросе с `?include=createdBy,updatedBy`.
      properties:
        createdBy:
          type: object
          properties:
            data:
              $ref: '#/ActorLinkage'
        updatedBy:
          type: object
          properties:
            data:
              $ref: '#/ActorLinkage'

ActorLinkage:
  type: [ object, 'null' ]
  required: [ type, id ]
  properties:
    type:
      type: string
      example: users
    id:
      type: string
      example: '42'

UserGroupAttributes:
  type: object
  properties:
    name:
      type: string
      example: Отдел продаж
    slug:
      type: string
      example: sales-team
      description: Уникальный в пределах проекта идентификатор группы
    ext_id:
      type: [ string, 'null' ]
      description: Уникальный в пределах проекта идентификатор группы во внешней системе
      example: crm_group_42
    description:
      type: [ string, 'null' ]
    is_active:
      type: boolean
    members_count:
      type: integer
      description: Количество участников группы
    created_at:
      type: [ string, 'null' ]
      format: date-time
    updated_at:
      type: [ string, 'null' ]
      format: date-time

UserGroupRequest:
  type: object
  required: [ name, slug ]
  properties:
    name:
      type: string
      maxLength: 255
      example: Отдел продаж
    slug:
      type: string
      maxLength: 255
      description: Уникальный в пределах проекта идентификатор в формате latin-kebab-case
      example: sales-team
    ext_id:
      type: [ string, 'null' ]
      maxLength: 255
      description: Идентификатор группы во внешней системе
      example: crm_group_42
    description:
      type: [ string, 'null' ]
    is_active:
      type: boolean
      example: true
