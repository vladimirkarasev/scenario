Unauthorized:
  description: Не аутентифицирован
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'

NotFound:
  description: Ресурс не найден
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'

Forbidden:
  description: Недостаточно прав
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ErrorResponse'

ValidationError:
  description: Ошибки валидации
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ValidationErrorResponse'

# JSON:API-варианты для модуля Users (единый конверт errors[] + meta).

UnauthorizedErrors:
  description: Не аутентифицирован
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiErrorResponse'

ForbiddenErrors:
  description: Недостаточно прав / нарушение доступа
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiErrorResponse'

NotFoundErrors:
  description: Ресурс не найден
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiErrorResponse'

ConflictErrors:
  description: Нарушение бизнес-правила (422)
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiErrorResponse'

ValidationErrors:
  description: Ошибки валидации
  content:
    application/json:
      schema:
        $ref: './schemas/common.yaml#/ApiErrorResponse'
