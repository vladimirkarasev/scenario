collection:
  get:
    tags: [ Сценарии ]
    summary: Список сценариев
    security:
      - BearerAuth: [ ]
    parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        description: >
          Фильтры JSON:API (`filter[search]`, `filter[is_active]`,
          `filter[active_only]`, `filter[tags][]`, `filter[category_id]`)
        schema:
          type: object
          properties:
            search:
              type: string
              description: Поиск по названию, описанию, alias и тегам (регистронезависимо)
              example: оформление
            is_active:
              type: boolean
              description: Фильтр по признаку активности сценария
              example: true
            active_only:
              type: boolean
              description: Показывать только сценарии с активной версией (по умолчанию `true`)
              default: true
            tags:
              type: array
              items:
                type: string
              description: Фильтр по тегам (любое совпадение)
              example: [ onboarding, hr ]
            category_id:
              type: string
              format: uuid
              description: UUID категории для фильтрации
              example: 018e1b2c-3d4f-7e8a-9b0c-1d2e3f4a5b6c
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/PageNumber'
    responses:
      '200':
        description: Список сценариев (JSON:API коллекция)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/JsonApiCollection'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/scenarios.yaml#/ScenarioResource'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

  post:
    tags: [ Сценарии ]
    summary: Создать сценарий
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/scenarios.yaml#/ScenarioRequest'
    responses:
      '201':
        description: Сценарий создан
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  $ref: '../components/schemas/scenarios.yaml#/ScenarioItem'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

item:
  parameters:
    - $ref: '../components/parameters.yaml#/ScenarioId'

  get:
    tags: [ Сценарии ]
    summary: Получить сценарий
    security:
      - BearerAuth: [ ]
    responses:
      '200':
        description: Сценарий
        content:
          application/json:
            schema:
              $ref: '../components/schemas/scenarios.yaml#/ScenarioResource'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    tags: [ Сценарии ]
    summary: Обновить сценарий
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/scenarios.yaml#/ScenarioRequest'
    responses:
      '200':
        description: Обновлённый сценарий
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  $ref: '../components/schemas/scenarios.yaml#/ScenarioItem'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

  delete:
    tags: [ Сценарии ]
    summary: Удалить сценарий
    security:
      - BearerAuth: [ ]
    responses:
      '204':
        description: Сценарий удалён
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

duplicate:
  post:
    tags: [ Сценарии ]
    summary: Дублировать сценарий
    security:
      - BearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/ScenarioId'
    responses:
      '201':
        description: Копия сценария создана
        content:
          application/json:
            schema:
              type: object
              properties:
                item:
                  $ref: '../components/schemas/scenarios.yaml#/ScenarioItem'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

feed:
  get:
    tags: [ Сценарии ]
    summary: Лента сценариев
    security:
      - BearerAuth: [ ]
    description: >
      Возвращает смешанный поток «папки сверху + сценарии» с единой пагинацией.
      Папки всегда идут перед сценариями; внутри каждой группы — сортировка по имени.
      Если передан `filter[parent_id]`, возвращаются только прямые потомки указанной папки.
      Если `filter[parent_id]` передан с пустым значением — возвращаются элементы без категории.
    parameters:
      - name: filter
        in: query
        style: deepObject
        explode: true
        schema:
          type: object
          properties:
            parent_id:
              type: [ string, 'null' ]
              format: uuid
              description: >
                UUID родительской папки. Наличие ключа с пустым значением означает
                «показать элементы без категории» (корень).
            search:
              type: string
              maxLength: 255
              description: Поиск по названию папки / сценария
            status:
              type: string
              enum: [ active, draft, archived ]
              description: Фильтр сценариев по статусу (папки не фильтруются)
            exclude_scenario_id:
              type: string
              format: uuid
              description: Исключить сценарий из выборки
            root_id:
              type: string
              format: uuid
              description: Ограничить выдачу поддеревом этой папки (для Workspace-изоляции)
            project_id:
              type: string
              format: uuid
              description: Проект для фильтрации. Если не передан — берётся из токена авторизации.
      - $ref: '../components/parameters.yaml#/PageNumber'
      - $ref: '../components/parameters.yaml#/PageSize'
    responses:
      '200':
        description: Лента с пагинацией и счётчиками
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/scenarios.yaml#/ScenarioFeedItem'
                meta:
                  $ref: '../components/schemas/scenarios.yaml#/ScenarioFeedMeta'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
