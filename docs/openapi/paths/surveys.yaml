list:
  get:
    tags: [Опросы]
    summary: Список прогонов (опросов)
    security:
      - BearerAuth: []
    description: >
      Возвращает постраничный список запущенных прогонов сценариев.
      Позволяет вернуться к незавершённому опросу — достаточно взять `id`
      нужного прогона и вызвать `/scenarios/survey/{id}`.
    parameters:
      - name: status
        in: query
        description: Фильтр по статусу прогона
        schema:
          $ref: '../components/schemas/runs.yaml#/RunStatus'
      - name: scenario_id
        in: query
        description: UUID сценария для фильтрации
        schema:
          type: string
          format: uuid
      - $ref: '../components/parameters.yaml#/PerPage'
    responses:
      '200':
        description: Список прогонов с пагинацией
        content:
          application/json:
            schema:
              type: object
              required: [surveys, pagination]
              properties:
                surveys:
                  type: array
                  items:
                    $ref: '../components/schemas/runs.yaml#/SurveySummary'
                pagination:
                  $ref: '../components/schemas/common.yaml#/Pagination'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'

item:
  get:
    tags: [Опросы]
    summary: Получить состояние прогона
    security:
      - BearerAuth: []
    description: >
      Возвращает полный payload прогона: текущий узел, его отрендеренное
      содержимое и историю пройденных шагов. Прогон автоматически
      продвигается до ближайшего интерактивного узла перед возвратом.
    parameters:
      - name: runId
        in: path
        required: true
        description: UUID прогона
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Состояние прогона
        content:
          application/json:
            schema:
              $ref: '../components/schemas/runs.yaml#/RunPayload'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
