collection:
  get:
    tags: [Actions]
    operationId: listActionRuns
    summary: Список выполнений actions
    parameters:
      - name: filter[status]
        in: query
        schema:
          type: string
          enum: [pending, running, success, failed, skipped]
      - name: page[size]
        in: query
        description: Максимальное число записей, от 1 до 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      '200':
        description: Последние выполнения actions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/actions.yaml#/ActionRunListResponse'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'

completed:
  get:
    tags: [Actions]
    operationId: listCompletedActionRuns
    summary: Список успешно выполненных actions
    parameters:
      - name: page[size]
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      '200':
        description: Успешные выполнения.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/actions.yaml#/ActionRunListResponse'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'

failed:
  get:
    tags: [Actions]
    operationId: listFailedActionRuns
    summary: Список завершившихся ошибкой actions
    parameters:
      - name: page[size]
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
    responses:
      '200':
        description: Выполнения с ошибкой; причина находится в `reason` и `error`.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/actions.yaml#/ActionRunListResponse'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
