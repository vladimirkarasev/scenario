collection:
  get:
    tags: [ Группы ]
    summary: Список групп
    security:
      - BearerAuth: [ ]
    parameters:
      - name: filter[search]
        in: query
        description: Поиск по названию или slug
        schema:
          type: string
      - name: filter[is_active]
        in: query
        description: Фильтр по активности
        schema:
          type: boolean
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/PageNumber'
      - $ref: '../components/parameters.yaml#/IncludeGroupRelations'
      - $ref: '../components/parameters.yaml#/FieldsGroups'
      - $ref: '../components/parameters.yaml#/FieldsUsers'
    responses:
      '200':
        description: Список групп (JSON:API коллекция)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/JsonApiCollection'
                - type: object
                  required: [ meta ]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/groups.yaml#/UserGroup'
                    included:
                      type: array
                      description: Авторы (users) при ?include=createdBy,updatedBy.
                      items:
                        $ref: '../components/schemas/users.yaml#/UserResource'
                    meta:
                      $ref: '../components/schemas/common.yaml#/CollectionMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'

  post:
    tags: [ Группы ]
    summary: Создать группу
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/groups.yaml#/UserGroupRequest'
    responses:
      '201':
        description: Группа создана
        content:
          application/json:
            schema:
              type: object
              required: [ data, meta ]
              properties:
                data:
                  $ref: '../components/schemas/groups.yaml#/UserGroup'
                meta:
                  $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

item:
  parameters:
    - name: group
      in: path
      required: true
      description: UUID группы
      schema:
        type: string
        format: uuid

  get:
    tags: [ Группы ]
    summary: Получить группу
    security:
      - BearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/IncludeGroupRelations'
      - $ref: '../components/parameters.yaml#/FieldsGroups'
      - $ref: '../components/parameters.yaml#/FieldsUsers'
    responses:
      '200':
        description: Группа
        content:
          application/json:
            schema:
              type: object
              required: [ data, meta ]
              properties:
                data:
                  $ref: '../components/schemas/groups.yaml#/UserGroup'
                included:
                  type: array
                  description: Авторы (users) при ?include=createdBy,updatedBy.
                  items:
                    $ref: '../components/schemas/users.yaml#/UserResource'
                meta:
                  $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

  patch:
    tags: [ Группы ]
    summary: Обновить группу
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/groups.yaml#/UserGroupRequest'
    responses:
      '200':
        description: Обновлённая группа
        content:
          application/json:
            schema:
              type: object
              required: [ data, meta ]
              properties:
                data:
                  $ref: '../components/schemas/groups.yaml#/UserGroup'
                meta:
                  $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

  delete:
    tags: [ Группы ]
    summary: Удалить группу
    security:
      - BearerAuth: [ ]
    responses:
      '204':
        description: Группа удалена
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

members:
  parameters:
    - name: group
      in: path
      required: true
      description: UUID группы
      schema:
        type: string
        format: uuid

  get:
    tags: [ Группы ]
    summary: Участники группы
    security:
      - BearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/PageNumber'
      - $ref: '../components/parameters.yaml#/FieldsUsers'
    responses:
      '200':
        description: Список участников (JSON:API коллекция)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/JsonApiCollection'
                - type: object
                  required: [ meta ]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/users.yaml#/UserResource'
                    meta:
                      $ref: '../components/schemas/common.yaml#/CollectionMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

  post:
    tags: [ Группы ]
    summary: Добавить пользователя в группу
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ user_id ]
            properties:
              user_id:
                type: integer
                description: ID пользователя
                example: 42
    responses:
      '204':
        description: Пользователь добавлен
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

memberItem:
  parameters:
    - name: group
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: user
      in: path
      required: true
      schema:
        type: integer

  delete:
    tags: [ Группы ]
    summary: Удалить пользователя из группы
    security:
      - BearerAuth: [ ]
    responses:
      '204':
        description: Пользователь удалён из группы
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

memberCandidates:
  parameters:
    - name: group
      in: path
      required: true
      schema:
        type: string
        format: uuid

  get:
    tags: [ Группы ]
    summary: Найти пользователей для добавления в группу
    security:
      - BearerAuth: [ ]
    parameters:
      - name: filter[search]
        in: query
        schema:
          type: string
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/PageNumber'
    responses:
      '200':
        description: Пользователи текущего проекта, ещё не состоящие в группе
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/JsonApiCollection'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/users.yaml#/UserResource'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
