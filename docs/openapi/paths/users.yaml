collection:
  get:
    tags: [ Пользователи ]
    summary: Список пользователей
    security:
      - BearerAuth: [ ]
    parameters:
      - name: filter[search]
        in: query
        description: Поиск по имени, ФИО, email, логину
        schema:
          type: string
      - name: filter[group_ids][]
        in: query
        description: Фильтр по UUID групп текущего проекта
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: filter[role_ids][]
        in: query
        description: Фильтр по ID ролей
        schema:
          type: array
          items:
            type: integer
      - $ref: '../components/parameters.yaml#/PageNumber'
      - $ref: '../components/parameters.yaml#/PageSize'
      - $ref: '../components/parameters.yaml#/IncludeUserRelations'
      - $ref: '../components/parameters.yaml#/FieldsGroups'
      - $ref: '../components/parameters.yaml#/FieldsRoles'
    responses:
      '200':
        description: Список пользователей (JSON:API коллекция)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/JsonApiCollection'
                - type: object
                  required: [ meta ]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/users.yaml#/UserResource'
                    included:
                      type: array
                      description: Включённые роли/группы (при ?include=roles,groups).
                      items:
                        oneOf:
                          - $ref: '../components/schemas/users.yaml#/IncludedRole'
                          - $ref: '../components/schemas/users.yaml#/IncludedGroup'
                    meta:
                      $ref: '../components/schemas/common.yaml#/CollectionMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

  post:
    tags: [ Пользователи ]
    summary: Создать пользователя
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/UserStoreRequest'
    responses:
      '201':
        description: Пользователь создан
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/users.yaml#/UserResource'
                - type: object
                  required: [ meta ]
                  properties:
                    meta:
                      $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

item:
  parameters:
    - name: user
      in: path
      required: true
      description: ID пользователя
      schema:
        type: integer

  get:
    tags: [ Пользователи ]
    summary: Получить пользователя
    security:
      - BearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/IncludeUserRelations'
      - $ref: '../components/parameters.yaml#/FieldsGroups'
      - $ref: '../components/parameters.yaml#/FieldsRoles'
    responses:
      '200':
        description: Пользователь (с ролями/группами при ?include=roles,groups)
        content:
          application/json:
            schema:
              type: object
              required: [ data, meta ]
              properties:
                data:
                  $ref: '../components/schemas/users.yaml#/UserResource'
                included:
                  type: array
                  description: Включённые роли/группы (при ?include=roles,groups).
                  items:
                    oneOf:
                      - $ref: '../components/schemas/users.yaml#/IncludedRole'
                      - $ref: '../components/schemas/users.yaml#/IncludedGroup'
                meta:
                  $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

  put:
    tags: [ Пользователи ]
    summary: Обновить пользователя
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/UserUpdateRequest'
    responses:
      '200':
        description: Обновлённый пользователь
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/users.yaml#/UserResource'
                - type: object
                  required: [ meta ]
                  properties:
                    meta:
                      $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

  delete:
    tags: [ Пользователи ]
    summary: Удалить пользователя из текущего проекта
    description: Учётная запись удаляется полностью, только если пользователь больше не состоит ни в одном проекте.
    security:
      - BearerAuth: [ ]
    responses:
      '204':
        description: Пользователь удалён из проекта
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

launchToken:
  post:
    tags: [ Пользователи ]
    summary: Выпустить одноразовый launch-токен
    description: >
      Выдаёт одноразовый launch-токен (`_token`) для пользователя текущего
      проекта, найденного по `external_id`. Фронт обменивает `_token` на пару
      access/refresh через `/embed/auth/exchange`. Требует право
      `user_impersonate`.
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/LaunchTokenRequest'
    responses:
      '200':
        description: Launch-токен создан
        content:
          application/json:
            schema:
              type: object
              required: [ data, meta ]
              properties:
                data:
                  $ref: '../components/schemas/users.yaml#/LaunchTokenResponse'
                meta:
                  $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

tokens:
  parameters:
    - name: user
      in: path
      required: true
      description: ID пользователя текущего проекта
      schema:
        type: integer

  get:
    tags: [ Пользователи ]
    summary: Список API-токенов пользователя
    security:
      - BearerAuth: [ ]
    responses:
      '200':
        description: Токены без секретного значения
        content:
          application/json:
            schema:
              type: object
              required: [ data, meta ]
              properties:
                data:
                  type: array
                  items:
                    $ref: '../components/schemas/users.yaml#/UserToken'
                meta:
                  $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

  post:
    tags: [ Пользователи ]
    summary: Выпустить API-токен пользователю
    description: Нельзя выпустить токен пользователю с более широкими правами, чем у текущего пользователя.
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/UserTokenStoreRequest'
    responses:
      '201':
        description: Токен создан; секрет возвращается только один раз
        content:
          application/json:
            schema:
              type: object
              required: [ data, meta ]
              properties:
                data:
                  $ref: '../components/schemas/users.yaml#/UserTokenCreated'
                meta:
                  $ref: '../components/schemas/common.yaml#/ApiMeta'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

tokenItem:
  parameters:
    - name: user
      in: path
      required: true
      schema:
        type: integer
    - name: tokenId
      in: path
      required: true
      schema:
        type: integer

  delete:
    tags: [ Пользователи ]
    summary: Отозвать API-токен пользователя
    security:
      - BearerAuth: [ ]
    responses:
      '204':
        description: Токен отозван или уже отсутствовал
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'

members:
  parameters:
    - name: group
      in: path
      required: true
      description: UUID группы
      schema:
        type: string
        format: uuid

  get:
    tags: [ Группы ]
    summary: Участники группы
    security:
      - BearerAuth: [ ]
    responses:
      '200':
        description: Список участников (JSON:API коллекция)
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/JsonApiCollection'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/users.yaml#/UserResource'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  post:
    tags: [ Группы ]
    summary: Добавить пользователя в группу
    security:
      - BearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ user_id ]
            properties:
              user_id:
                type: integer
                description: ID пользователя
                example: 42
    responses:
      '204':
        description: Пользователь добавлен
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '422':
        $ref: '../components/responses.yaml#/ValidationError'

memberItem:
  parameters:
    - name: group
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: user
      in: path
      required: true
      schema:
        type: integer

  delete:
    tags: [ Группы ]
    summary: Удалить пользователя из группы
    security:
      - BearerAuth: [ ]
    responses:
      '204':
        description: Пользователь удалён из группы
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
