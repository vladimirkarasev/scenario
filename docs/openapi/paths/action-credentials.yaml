collection:
  get:
    tags: [Actions]
    operationId: listActionCredentials
    summary: Список доступов actions
    responses:
      '200':
        description: Доступы без открытых значений secrets.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/actions.yaml#/ActionCredentialListResponse'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'

  post:
    tags: [Actions]
    operationId: createActionCredential
    summary: Создать доступ action
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/actions.yaml#/ActionCredentialRequest'
    responses:
      '201':
        description: Доступ создан.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/actions.yaml#/ActionCredentialItemResponse'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

item:
  parameters:
    - name: credential
      in: path
      required: true
      description: Числовой ID доступа.
      schema:
        type: integer

  put:
    tags: [Actions]
    operationId: updateActionCredential
    summary: Обновить доступ action
    description: Пустые значения secrets не заменяют уже сохранённые секреты.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/actions.yaml#/ActionCredentialRequest'
    responses:
      '200':
        description: Доступ обновлён.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/actions.yaml#/ActionCredentialItemResponse'
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
      '422':
        $ref: '../components/responses.yaml#/ValidationErrors'

  delete:
    tags: [Actions]
    operationId: deleteActionCredential
    summary: Удалить доступ action
    responses:
      '204':
        description: Доступ удалён.
      '401':
        $ref: '../components/responses.yaml#/UnauthorizedErrors'
      '403':
        $ref: '../components/responses.yaml#/ForbiddenErrors'
      '404':
        $ref: '../components/responses.yaml#/NotFoundErrors'
