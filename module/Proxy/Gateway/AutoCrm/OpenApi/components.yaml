openapi: 3.1.0
components:
  schemas:
    AccessLog:
      type: object
      description: 'Модель журнала доступа пользователей'
      properties:
        action:
          type: string
          description: Действие
        additional:
          type: array
          description: 'Дополнительные данные'
        createdAt:
          type: string
          format: 'DD.MM.YYYY HH:MM'
          description: 'Дополнительные данные'
        requestMethod:
          type: string
          description: 'Тип запроса'
        requestUrl:
          type: string
          description: Url
        responseCode:
          type: string
          description: 'Код ответа'
        userAgent:
          type: string
          description: 'User-agent пользователя'
        userEmail:
          type: string
          description: 'E-mail пользователя'
        userId:
          type: integer
          description: 'id пользователя'
        userIp:
          type: string
          description: 'IP пользователя'
        userName:
          type: string
          description: 'ФИО пользователя'
    Activity:
      required:
        - client_type
        - name
      type: object
      properties:
        id:
          type: integer
          description: 'Код сферы деятельности'
        name:
          type: string
          description: Наименование
        client_type:
          type: integer
          description: 'Тип клиента (0 - Физ лицо, 1 - Юр лицо)'
      description: 'Модель сфера деятельности'
    AdditionalFeatureOption:
      type: object
      properties:
        id:
          type: integer
          description: 'Код (генерируется автоматически)'
        code:
          type: string
          description: Код
        name:
          type: string
          description: Наименование
        price:
          type: number
          description: Цена
      description: 'Модель Дополнительное оборудование'
    Attachment:
      type: object
      properties:
        is_required:
          type: boolean
          description: 'Необходимо загрузить файл(ы)'
        attachment_types:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentType'
    AttachmentType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    BTL:
      type: object
      properties:
        id:
          type: integer
          description: 'Уникальный идентификатор BTL мероприятия'
        type:
          type: string
          description: 'Тип мероприятия'
        name:
          type: string
          description: 'Название мероприятия'
        brand_id:
          type: integer
          description: 'ID бренда'
        date_from:
          type: string
          format: date
          description: 'Дата начала мероприятия'
        date_to:
          type: string
          format: date
          description: 'Дата окончания мероприятия'
        coverage:
          type: string
          description: 'Покрытие мероприятия'
        schedule_by_model:
          type: boolean
          description: 'Расписание по моделям'
        external_page_id:
          type: integer
          nullable: true
          description: 'ID внешней страницы'
        btl_configurator_id:
          type: integer
          nullable: true
          description: 'ID конфигуратора BTL'
        user_id:
          type: integer
          description: 'ID пользователя-создателя'
        utm_id:
          type: integer
          nullable: true
          description: 'ID UTM метки'
        utm_medium_id:
          type: integer
          nullable: true
          description: 'ID UTM medium'
        created_at:
          type: string
          format: date-time
          description: 'Дата создания'
        updated_at:
          type: string
          format: date-time
          description: 'Дата обновления'
        dealer_ids:
          type: array
          description: 'Массив ID дилеров, участвующих в мероприятии'
          items:
            type: integer
        request_type_ids:
          type: array
          description: 'Массив ID типов заявок для мероприятия'
          items:
            type: integer
        city_ids:
          type: array
          description: 'Массив ID городов, где проводится мероприятие (через дилеров)'
          items:
            type: integer
        model_alias_ids:
          type: array
          description: 'Массив ID алиасов моделей для мероприятия'
          items:
            type: integer
        dealers:
          type: array
          description: 'Полные данные дилеров (доступно через expand=dealers)'
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        requestTypes:
          type: array
          description: 'Полные данные типов заявок (доступно через expand=requestTypes)'
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        model_aliases:
          type: array
          description: 'Полные данные алиасов моделей (доступно через expand=model_aliases)'
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
        links:
          type: array
          description: 'Массив ссылок для регистрации (доступно через expand=links)'
          items:
            type: object
            properties:
              link:
                type: string
              source_id:
                type: integer
              date_start:
                type: string
              date_end:
                type: string
              status:
                type: integer
        schedules:
          type: array
          description: 'Расписание мероприятия (доступно через expand=schedules)'
          items:
            type: object
            properties:
              id:
                type: integer
              date:
                type: string
                format: date
              duration:
                type: integer
              model_alias_id:
                type: integer
                nullable: true
              count:
                type: integer
        slots:
          type: array
          description: 'Слоты мероприятия (доступно через expand=slots)'
          items:
            type: object
            properties:
              id:
                type: integer
              begin_at:
                type: string
                format: date-time
              end_at:
                type: string
                format: date-time
              status:
                type: string
        brand:
          type: object
          nullable: true
          description: 'Данные бренда (доступно через expand=brand)'
          properties:
            id:
              type: integer
            name:
              type: string
        settings:
          type: object
          nullable: true
          description: 'Данные полей для заполнения (доступно через expand=settings)'
          properties:
            common:
              type: object
              properties:
                may_process_personal_data_link:
                  type: string
                may_process_personal_data_link_title:
                  type: string
                client_confirm_communication_link:
                  type: string
                client_confirm_communication_link_title:
                  type: string
            fields:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: object
                    properties:
                      value:
                        type: string
                  name:
                    type: object
                    properties:
                      value:
                        type: string
                  required:
                    type: object
                    properties:
                      value:
                        type: integer
                  hint:
                    type: string
                  multiple:
                    type: integer
        description:
          type: string
          example: 'null'
          description: 'Описание (доступно через expand=description)'
        image:
          type: string
          example: 'null'
          description: 'Главное изображение (доступно через expand=image)'
        additionalImages:
          type: array
          description: 'Дополнительные изображения (доступно через expand=additionalImages)'
          items:
            type: string
    Bank:
      type: object
      properties:
        id:
          type: integer
          description: ID
        name:
          type: string
          description: Наименование
        type:
          type: string
          description: 'Тип банка (bank, leasing)'
        client_company_inn:
          type:
            - 'null'
            - string
          description: 'ИНН клиента'
        client_company_bic:
          type:
            - 'null'
            - string
          description: 'БИК клиента'
        client_company_correspondent_account:
          type:
            - 'null'
            - string
          description: 'Корреспондентский счет клиента'
      description: 'Модель бренда'
    BaseBrand:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
          description: 'Код бренда (генерируется автоматически)'
        name:
          type: string
          description: 'Наименование бренда'
        name_eng:
          type: string
          description: 'Наименование бренда (англ)'
        name_market:
          type: string
          description: 'Маркетинговое наименование бренда'
        logo:
          type: string
          description: 'Логотип бренда'
        importer_db_name:
          type: string
          description: 'Название базы импортера'
        host:
          type: string
          description: 'url дистрибуции бренда'
        token:
          type: string
          description: токен
        ecm_id:
          type: string
        is_supported:
          type: integer
        origin_id:
          type: integer
        is_vin_manufacturer:
          type: string
        color:
          type: string
          description: 'цвет в формате hex'
          example: '#2a62ff'
        is_recent:
          type: string
          description: 'актуальный бренд/модель'
        vehicle_type:
          type: string
      description: 'Модель бренд автомобиля'
      example:
        id: 1
        name: Audi
    Box:
      type: object
      description: 'Ящик для отправки писем'
      required:
        - box
        - from_name
      properties:
        id:
          type: integer
          description: 'ID ящика'
        box:
          type: string
          description: 'E-mail отправителя'
        from_name:
          type: string
          description: 'Имя отправителя'
        base_url:
          type: string
          description: 'Базовый URL для ссылок'
        subscribe_template:
          type: string
          description: 'Шаблон страницы подписки'
        unsubscribe_template:
          type: string
          description: 'Шаблон страницы отписки'
        is_active:
          type: integer
          description: Активный
          enum:
            - '0 - Нет'
            - '1 - Да'
        user_id:
          type: integer
          description: 'ID автора'
        created_at:
          type: string
          description: 'Создано (ГГГГ-ММ-ДД ЧЧ:ММ:СС)'
        updated_at:
          type: string
          description: 'Изменено (ГГГГ-ММ-ДД ЧЧ:ММ:СС)'
    Brand:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/BaseBrand/properties/id'
        name:
          $ref: '#/components/schemas/BaseBrand/properties/name'
      description: 'Модель бренда'
    BroadcastDistributor:
      type: object
      description: 'Модель связи рассылки и дистрибьютора'
      required:
        - broadcast_id
        - distributor_id
      properties:
        broadcast_id:
          type: integer
          description: 'ID рассылки'
        distributor_id:
          type: integer
          description: 'ID дистрибьютора'
    Call:
      required:
        - call_at
        - dest
        - src
      type: object
      properties:
        id:
          type: integer
          description: 'Код звонка (генерируется автоматически)'
        src:
          type: string
          description: 'Кто звонил'
        dest:
          type: string
          description: 'Кому звонили'
        call_at:
          type: string
          description: 'Время звонка в формате yyyy-MM-dd HH:mm:ss'
        answer_at:
          type: string
          description: 'Время когда на звонок ответили в формате yyyy-MM-dd HH:mm:ss'
        hangup_at:
          type: string
          description: 'Время звонок завершили в формате yyyy-MM-dd HH:mm:ss'
        record_url:
          type: string
          description: 'Ссылка на запись разговора'
        record_base64:
          type: string
          description: 'Запись разговора в формате base64'
        user_login:
          type: string
          description: 'Логин пользователя в DNM в формате x@x.x'
      description: 'Модель бренд автомобиля'
      example:
        id: 1
        src: '+79001234567'
        dest: '+79001234568'
        call_at: '2019-01-02 23:59:59'
    Campaign:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
          description: 'ID кампании (генерируется автоматически)'
        name:
          type: string
          description: Название
        descr:
          type: string
          description: Описание
        is_deleted:
          type: integer
          description: 'Удален или нет'
      description: 'Модель Кампания'
    CancelReason:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
          description: 'ID источника (генерируется автоматически)'
        parent_id:
          type: integer
          description: 'ID родительского причины'
        name:
          type: string
          description: 'Наименование причины'
      description: 'Модель Причина отказа'
    Car:
      required:
        - brand_id
        - code
        - model_alias_id
        - model_id
      type: object
      properties:
        id:
          type: integer
          description: 'ID потребности (генерируется автоматически)'
        dealer_id:
          type: integer
          description: 'ID дилера, подставляется автоматически'
        type:
          type: string
          description: 'Тип need - потребность, vehicle - автомобиль'
        code:
          type: string
          description: 'Код потребности/автомобиля во внешней системе'
        brand_id:
          type: integer
          description: 'ID бренда'
        model_id:
          type: integer
          description: 'ID модели'
        model_alias_id:
          type: integer
          description: 'ID алиас модели'
        model_year_id:
          type: integer
          description: 'ID модельного года'
        serie_id:
          type: integer
          description: 'ID серии'
        generation_id:
          type: integer
          description: 'ID поколения'
        version:
          type: string
          description: Комплектация
        color:
          type: string
          description: Цвет
        vin:
          type: string
          description: VIN
        vin_manufacturer:
          type: string
          description: 'VIN производителя'
        job:
          type: string
          description: JOB
        mileage:
          type: integer
          description: Пробег
        reg_number:
          type: string
          description: 'Государственный регистрационный номер (формат А777АА77)'
        is_test_drive:
          type: integer
          description: 'Машина для тест драйвов'
      description: 'Модель Потребность'
    Channel:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
          description: 'ID канала (генерируется автоматически)'
        code:
          type: string
          description: Код
        name:
          type: string
          description: Название
        status:
          type: integer
          description: 'Состояние 0 - Активна, 1000 - удалено'
      description: 'Модель Канал'
    CheckList:
      type: object
      properties:
        id:
          type: integer
          description: 'ID Чек-листа'
        name:
          type: string
          description: Наименование
      description: Чек-лист
    CheckListAttachment:
      type: object
      properties:
        id:
          type: integer
          description: 'ID файла чек-листа'
        name:
          type: string
          description: Название
        description:
          type: string
          description: Описание
        url:
          type: string
          description: url
        thumbnail_url:
          type: string
          description: 'url превью'
        mimetype:
          type: string
          description: mimetype
        type:
          type: string
          description: 'Тип 0 - Фото, 1 - Другое'
      description: 'Файлы чек-листа'
    CheckListBlock:
      type: object
      properties:
        id:
          type: integer
          description: 'ID Чек-листа'
        name:
          type: string
          description: Наименование
        questions:
          type: array
          description: Вопросы
          items:
            $ref: '#/components/schemas/CheckListQuestion'
      description: 'Блок чек-листа'
    CheckListQuestion:
      type: object
      properties:
        id:
          type: integer
          description: 'ID Вопроса'
        name:
          type: string
          description: Вопрос
        point:
          type: string
          description: Балл
        is_required_comment:
          type: integer
          description: 'Требует комментария'
        is_required_attachment:
          type: integer
          description: 'Требует приложения'
        is_important:
          type: integer
          description: Важный
        is_only_for_distributor:
          type: integer
          description: 'Только для дистрибьютора'
        is_display_showcase:
          type: integer
          description: 'Выводить на витрину'
        answer:
          type: string
          description: 'Ответ 1 - Да, 0 - Нет'
        attachments:
          type: array
          description: Файлы
          items:
            $ref: '#/components/schemas/CheckListAttachment'
      description: 'Вопрос чек-листа'
    City:
      required:
        - country_id
        - id
        - name
        - region_id
      type: object
      properties:
        id:
          type: integer
          description: 'ID (генерируется автоматически)'
          example: 1
        name:
          maxLength: 255
          type: string
          description: 'Название региона'
          example: Абаза
        english_name:
          maxLength: 255
          type: string
          description: 'Название региона (англ.)'
          example: Abaza
        timezone:
          maxLength: 255
          type: string
          description: 'Часовой пояс'
          example: Asia/Krasnoyarsk
        country_id:
          type: integer
          description: 'Идентификатор страны'
          example: 1
        region_id:
          type: integer
          description: 'Идентификатор региона'
          example: 29
        lat:
          type: number
          description: Широта
          example: 64.2479758
        lng:
          type: number
          description: Долгота
          example: 95.1104176
      description: 'Модель региона'
    ClientCommonVehicle:
      type: object
      properties:
        id:
          type: integer
          description: 'ID (генерируется автоматически)'
        client_id:
          type: integer
          description: 'ID клиента'
        common_vehicle_id:
          type: integer
          description: 'ID авто'
        own_begin:
          type: string
          description: 'Начало владения'
        own_end:
          type: string
          description: 'Начало владения'
        is_confirmed:
          type: integer
          description: 'Признак подтверждения владения (0 - не подтверждено, 1 - подтверждено, 2 - ожидает подтверждения)'
        confirmed_at:
          type: string
          description: 'Дата подтверждения владения'
        vehicle_reg_number:
          type: string
          description: 'Регистр. номер'
      description: 'Модель связи клиента дилера и автомобиля дистрибьютора'
    ClientCommonVehicleForm:
      required:
        - clientId
        - vin
      type: object
      properties:
        id:
          type: integer
          description: 'ID (генерируется автоматически)'
        clientId:
          type: integer
          description: 'Идентификатор клиента'
        vin:
          type: integer
          description: 'Vin автомобиля'
        regNumber:
          type: string
          description: 'Регистр. номер'
        ownBegin:
          type: string
          description: 'Начало владения (формат dd.mm.yyyy)'
        isConfirmed:
          type: integer
          description: 'Признак подтверждения владения (0 - не подтверждено, 1 - подтверждено, 2 - ожидает подтверждения)'
        files:
          type: array
          description: 'Массив файлов (POST, multipart/form-data)'
      description: 'Модель формы связи клиента дилера и автомобиля дистрибьютора'
    ClientComplaint:
      type: object
      properties:
        id:
          type: integer
          description: ID
        code:
          type: string
          description: Код
        name:
          type: string
          description: Наименование
      description: 'Модель Состояние'
    ClientField:
      required:
        - client_id
        - field_id
        - value
      type: object
      properties:
        id:
          type: integer
          description: 'ID значения атрибута (генерируется автоматически)'
        field_id:
          type: integer
          description: 'Id атрибута'
        client_id:
          type: integer
          description: 'Id клиента'
        value:
          type: string
          description: 'значение атрибута'
      description: 'Модель Значение атрибута клиента'
    ClientIdentifier:
      required:
        - client_id
        - type
        - value
      type: object
      properties:
        id:
          type: integer
          description: 'ID значения атрибута (генерируется автоматически)'
        type:
          type: integer
          description: 'Тип идентификатора 1 - GoogleID, 2 - YandexID, 3 - GITID, 4 - GWM ID, 5 - Номер заказа в ЛК, 6 - Серийный номер оплаты, 7 - Ссылка на профиль Telegram, 8 - Ссылка на профиль ВКонтакте, 9 - Ссылка на профиль Одноклассники'
        client_id:
          type: integer
          description: 'Id клиента'
        value:
          type: string
          description: 'значение атрибута'
      description: 'Модель Идентификатор клиента в Internet'
    ClientPhone:
      required:
        - id
        - number
        - type
      type: object
      properties:
        id:
          type: integer
          description: 'ID (генерируется автоматически)'
        number:
          type: string
          description: 'Номер телефона +70000000000'
        type:
          type: integer
          description: 'Тип телефона'
      description: Телефон
    ClientRequest:
      required:
        - code
        - name
      type: object
      properties:
        dealer_id:
          type: integer
          description: 'ID дилера, подставляется автоматически'
        distributor_id:
          type: integer
          description: 'ID дистрибьютора'
        type:
          type: integer
          description: 'Тип клиента. Значение по умолчанию - 0'
        name:
          type: string
          description: 'Имя клиента физ. лица или представителя юр. лица'
        middle_name:
          type: string
          description: Отчество
        last_name:
          type: string
          description: Фамилия
        city_id:
          type: string
          description: 'ID города'
        phone_hash:
          type: string
          description: "md5 хеш телефона длиной 32 символа, результат функции md5('+79991234567')"
        email:
