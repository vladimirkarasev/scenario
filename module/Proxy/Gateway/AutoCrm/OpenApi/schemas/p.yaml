openapi: 3.1.0
components:
  schemas:
    PartManufacturer:
      type: object
      description: 'Модель производителя запасных частей'
      properties:
        id:
          type: integer
          description: 'ID производителя'
        name:
          type: string
          description: 'Наименование производителя'
        status:
          type: string
          description: 'Статус производителя'
          enum:
            - active
            - deleted
          example: active
    PaymentTerm:
      required:
        - name
        - types
        - year
        - discount_percent
      type: object
      properties:
        id:
          type: integer
          description: ID
        name:
          type: string
          description: Название
        types:
          type: array
          description: 'Тип (test-drive - Тест-драйв, replacement - Подменный, consignment - Консигнация)'
        year:
          type: integer
          description: 'Год выпуска'
        discount_percent:
          type: float
          description: Скидка
          example: 1.5
        show_in_request:
          type: boolean
          description: 'Отображать в запросе счета'
        active:
          type: boolean
          description: Активность
      description: 'Условия оплаты'
    PersonalDataAgreementDocumentForm:
      required:
        - file
      type: object
      properties:
        dealer_id:
          type: integer
          description: 'ID дилера (обязателен для ролей дистрибьютора)'
        file:
          type: string
          description: 'Файл скана анкеты СОПД в формате Base64'
        file_name:
          type: string
          description: 'Название файла'
      description: 'Файл скана анкеты СОПД'
    PersonalDataAgreementEvent:
      type: object
      description: 'Модель анкеты согласия на обработку персональных данных'
      properties:
        id:
          type: integer
          description: 'ID анкеты'
        uuid:
          type: string
          description: UUID
        dealer_id:
          type: integer
          description: 'ID дилера'
        client_id:
          type: integer
          description: 'ID клиента дилера'
        first_name:
          type: string
          description: Имя
        middle_name:
          type: string
          description: Отчество
        last_name:
          type: string
          description: Фамилия
        gender:
          type: integer
          description: 'Пол (1 - Мужчина, 2 - Женщина)'
        phones:
          type: array
          description: Телефоны
          items:
            $ref: '#/components/schemas/PersonalDataAgreementPhone'
        emails:
          type: array
          items:
            type: string
          description: E-mail
        birthday_at:
          type: string
          description: 'Дата рождения (ДД.ММ.ГГГГ)'
        passportType:
          type: integer
          description: 'Тип документа удостоверяющего личность (1 - Паспорт РФ, 2 - Загран. паспорт)'
        passportSeries:
          type: string
          description: 'Серия документа'
        passportNumber:
          type: string
          description: 'Номе документа'
        passportIssueDate:
          type: string
          description: 'Дата выдачи (ДД.ММ.ГГГГ)'
        passportAuthority:
          type: string
          description: 'Кем выдан'
        postal_code:
          type: string
          description: 'Почтовый индекс'
        city:
          type: string
          description: Город
        address:
          type: string
          description: Адрес
        may_process_personal_data:
          type: integer
          description: 'Согласие на обработку персональных данных дилером'
        client_confirm_communication:
          type: integer
          description: 'Согласие на коммуникацию с дилером'
        may_process_personal_data_third_person:
          type: integer
          description: 'Согласие на обработку персональных данных третьими лицами'
        client_confirm_communication_third_person:
          type: integer
          description: 'Согласие на коммуникацию с третьим лицами'
        third_person_list_confirmed:
          type: integer
          description: 'Согласие с перечнем третьих лиц'
        role:
          type: integer
          description: 'Роль (1 - Владелец, 2 - Пользователь автомобиля)'
        type:
          type: integer
          description: 'Тип анкеты (1 - Продажа, 2 - Сервис)'
        brand_id:
          type: integer
          description: 'Бренд автомобиля'
        model_id:
          type: integer
          description: 'Модель автомобиля'
        vin:
          type: string
          description: 'VIN автомобиля'
        date:
          type: string
          description: 'Дата посещения (ДД.ММ.ГГГГ)'
        generateLink:
          type: string
          description: 'Ссылка для генерации печатной формы анкеты согласия на обработку персональных данных'
        cpd:
          type: string
          description: 'Скан анкеты согласия на обработку персональных данных'
        status:
          type: integer
          description: '1 - Ошибки заполнения, 2 - На рассмотрении, 3 - Подтверждена, 4 - Отклонена, 7 - Скан отсутствует, 9 - Удалена, 10 - Повторная'
    PersonalDataAgreementEventCreateForm:
      type: object
      description: 'Модель формы создания анкеты согласия на обработку персональных данных'
      properties:
        dealer_id:
          type: integer
          description: 'ID дилера'
        first_name:
          type: string
          required: true
          description: Имя
        middle_name:
          type: string
          description: Отчество
        last_name:
          type: string
          required: true
          description: Фамилия
        middleNameRequired:
          type: boolean
          description: 'Отчество обязательно (по умолчанию значение = Да)'
        gender:
          type: integer
          required: true
          description: 'Пол (1 - Мужчина, 2 - Женщина)'
        phone:
          type: string
          description: Телефон
        phoneType:
          type: integer
          description: 'Тип телефона (1 - Мобильный, 2 - Рабочий, 3 - Домашний)'
        email:
          type: string
          description: E-mail
        birthdayAt:
          type: string
          required: true
          description: 'Дата рождения (ДД.ММ.ГГГГ)'
        passportType:
          type: integer
          required: true
          description: 'Тип документа удостоверяющего личность (1 - Паспорт РФ, 2 - Загран. паспорт)'
        passportSeries:
          type: string
          description: 'Серия документа'
        passportNumber:
          type: string
          required: true
          description: 'Номе документа'
        passportIssueDate:
          type: string
          required: true
          description: 'Дата выдачи (ДД.ММ.ГГГГ)'
        passportAuthority:
          type: string
          required: true
          description: 'Кем выдан'
        postal_code:
          type: string
          description: 'Почтовый индекс'
        address:
          type: string
          required: true
          description: Адрес
        role:
          type: integer
          required: true
          description: 'Роль (1 - Владелец, 2 - Пользователь автомобиля)'
        type:
          type: integer
          required: true
          description: 'Тип анкеты (1 - Продажа, 2 - Сервис)'
        brand_id:
          type: integer
          required: true
          description: 'Бренд автомобиля'
        model_id:
          type: integer
          description: 'Модель автомобиля'
        vin:
          type: string
          required: true
          description: 'VIN автомобиля'
        date:
          type: string
          required: true
          description: 'Дата посещения (ДД.ММ.ГГГГ)'
    PersonalDataAgreementEventUpload:
      type: object
      properties:
        id:
          type: integer
          description: ID
        dealer_id:
          type: integer
          description: 'ID дилера'
        upload_id:
          type: integer
          description: 'ID документа согласия на обработку персональных данных'
        status:
          type: integer
          description: 'Код статуса обработки документа'
        created_at:
          type: string
          description: 'Время создания'
          format: 'yyyy-MM-dd HH:mm:ss'
        updated_at:
          type: string
          description: 'Время обновления'
          format: 'yyyy-MM-dd HH:mm:ss'
        created_by:
          type: integer
          description: 'ID пользователя загрузившего СОПД'
        updated_by:
          type: integer
          description: 'ID пользователя редактировавшего СОПД'
      description: 'Файл СОПД'
    PersonalDataAgreementEventUploadForm:
      required:
        - mayProcessPersonalData
        - status
      type: object
      properties:
        uuid:
          type: string
          description: 'UUID анкеты СОПД'
        status:
          type: integer
          description: 'Статус проверки (1 - успех, 2 - ошибка, 3 - отклонен)'
        mayProcessPersonalData:
          type: boolean
          description: 'Согласие на обработку персональных данных'
        code:
          type: string
          description: 'Код брака'
      description: 'Модель загрузки результата проверки скана согласия на обработку персональных данных'
    PersonalDataAgreementEventWithAppealStatus:
      allOf:
        -
          $ref: '#/components/schemas/PersonalDataAgreementEvent'
        -
          properties:
            appeal_status:
              oneOf:
                -
                  type: string
                -
                  type: 'null'
              description: 'Статус апелляции'
    PersonalDataAgreementPhone:
      type: object
      description: 'Модель телефона в анкете согласия на обработку персональных данных'
      properties:
        phone:
          type: string
          description: 'Номер телефона'
        type:
          type: integer
          description: 'Тип (1 - Мобильный, 2 - Рабочий, 3 - Домашний)'
    PersonalDataAgreementPrintForm:
      type: object
      properties:
        event_id:
          type: integer
          description: 'ID СОПД'
        client_name:
          type: string
          description: 'Имя клиента, для которого сгенерирована печатная форма СОПД'
        base64_content:
          type: string
          description: 'печатная форма СОПД в Base64'
      description: 'Запрос на получение печатной форма СОПД'
    PersonalDataClient:
      required:
        - client_id
        - type_id
        - status_id
        - started_at
      type: object
      properties:
        id:
          type: integer
          description: 'ID значения атрибута (генерируется автоматически)'
        type_id:
          type: integer
          description: 'Id типа согласия'
        client_id:
          type: integer
          description: 'Id клиента'
        status_id:
          type: integer
          description: 'Id статуса согласия'
          enum:
            - '1 - Активно'
            - '2 - Неактивно'
        started_at:
          type: string
          description: 'Дата получения согласия'
        expired_at:
          type: string
          description: 'Дата окончания действия согласия'
      description: 'Модель согласия клиента'
    PersonalDiscount:
      type: object
      properties:
        id:
          type: integer
          description: 'ID персональной скидки'
        name:
          type: string
          description: Наименование
        description:
          type: string
          description: Описание
        valid_from:
          type: string
          description: 'Дата начала активации'
        valid_to:
          type: string
          description: 'Дата окончания активации'
        valid_interval:
          type: integer
          description: 'Срок активации (дней)'
        is_reusable:
          type: boolean
          description: 'Многоразовая для клиента'
        is_reusable_for_vehicle:
          type: boolean
          description: 'Многоразовая для автомобиля'
        issue_limit:
          type: integer
          description: 'Лимит выдачи'
        activation_limit:
          type: integer
          description: 'Лимит активации'
        discount_value:
          type: integer
          description: 'Размер скидки, руб'
      description: 'Персональная скидка'
    PersonalDiscountClient:
      type: object
      properties:
        discount_id:
          type: integer
          description: 'ID скидки'
        common_client_id:
          type: integer
          description: 'ID клиента дистрибьютора'
        client_id:
          type: integer
          description: 'ID клиента дилера'
        vin:
          type: string
          description: 'VIN автомобиля'
        code:
          type: string
          description: 'Код для активации скидки'
        amount:
          type: number
          description: 'Размер скидки'
        description:
          type: string
          description: 'Причина выдачи скидки'
        issued_dealer_id:
          type: integer
          description: 'ID дилера выдавшего скидку'
        issued_at:
          type: string
          description: 'Дата выдачи'
        activated_dealer_id:
          type: integer
          description: 'ID дилера активировавшего скидку'
        activated_at:
          type: string
          description: 'Дата активации'
        activationLink:
          type: string
          description: 'Ссылка для активации скидки'
        activate_till:
          type: string
          description: 'Дата окончания срока активации (YYYY-MM-DD)'
        status:
          type: integer
          description: Статус
      description: 'Персональная скидка клиента'
    Poll:
      type: object
      properties:
        id:
          type: integer
          description: 'ID опроса'
        type:
          type: integer
          description: 'Тип (0 - На одной странице, 1 - Пошаговое заполнение по блокам, 2 - Пошаговое заполнение по вопросам)'
        name:
          type: string
          description: Название
        context:
          type: integer
          description: 'Контекст (1 - Рабочий лист, 2 - Клиент, 3 - Заказ-наряд, 4 - Планирование Yandex.Courier)'
        template:
          type: string
          description: Шаблон
        template_beginning:
          type: string
          description: 'Шаблон начала разговора'
        template_end:
          type: string
          description: 'Шаблон окончания разговора'
        is_only_for_distributor:
          type: integer
          description: 'Только для дистрибьютора'
        is_deleted:
          type: integer
          description: Удалён
        blocks:
          type: array
          description: Блоки
          items:
            $ref: '#/components/schemas/PollBlock'
      description: 'Запрос счёта'
    PollAnswer:
      type: object
      properties:
        id:
          type: integer
          description: 'ID ответа'
        text:
          type: string
          description: Текст
        external_code:
          type: string
          description: 'Внешний код'
        point:
          type: integer
          description: Балл
        need_comment:
          type: integer
          description: 'Нужен комментарий'
        is_exclusive:
          type: integer
          description: 'Эксклюзивный ответ'
        is_deleted:
          type: integer
          description: Удалён
        ord:
          type: integer
          description: Порядок
      description: 'Ответы опроса'
    PollAnswerForm:
      required:
        - data
      type: object
      properties:
        data:
          type: object
          properties: {  }
          description: 'Данные ответов на вопросы'
        scheduledAt:
          type: string
          description: 'Дата и время планирования опросов в формате ГГГГ-ММ-ДД ЧЧ:ММ:СС'
        date:
          type: string
          description: 'Дата и время получения ответов в формате ГГГГ-ММ-ДД ЧЧ:ММ:СС'
        mode:
          type: integer
          description: 'Режим поиска вопросов(1 - по внешнему коду, 2 - по внутреннему идентификатору)'
        externalId:
          type: string
          description: 'Внешний идентификатор'
        astraPageStatus:
          type: integer
          description: 'статус звонка (0 - Новый, 1 - Соединение, 2 - Номер не обслуживается, 3 - Некорректный номер, 4 - Не берут трубку, 5 - Занято, 6 - Вне зоны доступа, 7 - Автоответчик)'
        astraPageResult:
          type: integer
          description: 'результат по звонку (0 - Новый, 1 -  Результативный звонок, 2 - Перезвонить, 3 - Отказ от опроса, 4 - Отказ от записи разговора, 5 - Номер не принадлежит клиенту, 6 - Недозвон, 7 - Некорректный номер, 8 - Апелляция от ДЦ)'
        privacy:
          type: integer
          description: 'Конфиденциальность (0 - нет, 1 - частичная анонимность, 2 - полная анонимность)'
        state:
          type: integer
          description: 'Состояние (0 - Отменено, 1 - Запланировано, 2 - Завершено, 3 - Ожидает заполнения, 4 - Частично заполнено, 5 - Заполнено клиентом, 6 - Ссылка просрочена, 7 - Заполнено клиентской службой, 8 - Просрочен, 9 - Удалено)'
        source:
          type: integer
          description: 'Источник (1 - Вручную, 2 - По E-mail, 3 - По SMS, 4 - По QR-коду, 5 - По телефону (MTT), 6 - По Whatsapp, 7 - По телефону (AstraPage))'
        sends:
          type: array
          description: 'Отправки анкеты опроса'
          items:
            $ref: '#/components/schemas/PollEventSend'
      description: 'Ответы на вопросы опроса'
    PollBlock:
      type: object
      properties:
        id:
          type: integer
          description: 'ID блока'
        name:
          type: string
          description: Название
        is_deleted:
          type: integer
          description: Удалён
        ord:
          type: integer
          description: Порядок
        questions:
          type: array
          description: Вопросы
          items:
            $ref: '#/components/schemas/PollQuestion'
      description: 'Блок опроса'
    PollEvent:
      type: object
      properties:
        id:
          type: integer
          description: 'ID анкеты опроса'
        assignee_id:
          type: integer
          description: 'Автор изменений'
        poll_id:
          type: integer
          description: 'ID опроса'
        dealer_id:
          type: integer
          description: Дилер
        nps_type_id:
          type: integer
          description: NPS
        worksheet_id:
          type: integer
          description: 'Рабочий лист'
        client_id:
          type: integer
          description: 'ID клиента'
        purchase_id:
          type: integer
          description: З\Н
        occurred_at:
          type: integer
          description: 'Дата возникновения события'
        scheduled:
          type: string
          description: 'Дата планирования опроса (формат dd.MM.yyyy hh:mm)'
        comment:
          type: string
          description: Комментарий
        state:
          type: integer
          description: Состояние
        satisfaction_index:
          type: integer
          description: 'Индекс удовлетворенности'
        point:
          type: integer
          description: Баллы
        user_id:
          type: integer
          description: 'Автор изменений'
        created_at:
          type: string
          description: 'Создано (формат yyyy-MM-dd hh:mm:ss)'
        updated_at:
          type: string
          description: 'Обновлено (формат yyyy-MM-dd hh:mm:ss)'
        is_reported:
          type: integer
          description: Отчет
        published_at:
          type: string
          description: 'Дата публикации (формат yyyy-MM-dd hh:mm:ss)'
        event_id:
          type: integer
          description: Событие
        client_fill:
          type: integer
          description: 'Заполнен клиент'
        call_status:
          type: string
          description: 'Статус MTT-звонка'
        yandex_courier_planning_location_id:
          type: integer
          description: 'Места планирования яндекс курьера'
        privacy:
          type: integer
          description: 'Конфиденциальность (0 - Нет, 1 - Частичная анонимность, 2 - Полная анонимность)'
        external_id:
          type: string
          description: 'Внешний идентификатор'
        created_by:
          type: integer
          description: 'Кем создан'
        assignee_appointed_at:
          type: string
          description: 'Дата прикрепления (формат yyyy-MM-dd hh:mm:ss)'
        request_id:
          type: integer
          description: Запрос
        sale_id:
          type: integer
          description: Рапорт
        astra_page_status:
          type: integer
          description: 'Статус AP-звонка'
        astra_page_result:
          type: integer
          description: 'Результат по AP-звонку'
        astra_page_enable:
          type: integer
          description: 'Доступ к API для AP'
        common_client_id:
          type: integer
          description: Клиент
        source:
          type: integer
          description: 'Источник проведения'
        warehouse_vehicle_id:
          type: integer
          description: 'Автомобиль на складе'
        vin:
          type: string
          description: VIN
        link:
          $ref: '#/components/schemas/PollEventSend'
        client:
          type: object
          description: Клиент
          properties:
            id:
              type: integer
              description: 'Код клиента (генерируется автоматически)'
            fullName:
              type: string
              description: 'Полное имя'
            type:
              type: integer
              description: 'Тип клиента. Значение по умолчанию - 0'
            name:
              type: string
              description: 'Имя клиента физ. лица или представителя юр. лица'
            middle_name:
              type: string
              description: Отчество
            last_name:
              type: string
              description: Фамилия
            sex:
              type: integer
              description: Пол
            birthday:
              type: string
              description: 'День рождения (формат yyyy-MM-dd)'
            company_legal_form:
              type: string
              description: 'Форма собственности'
              enum:
                - ООО
                - АО
                - ОАО
                - ТОО
                - ИП
                - СООО
                - ЗАО
            company_name:
              type: string
              description: 'Название юридического лица  (Обязательно если тип: Юр лицо)'
            phones:
              type: array
              description: 'Массив всех телефонов клиента. Переданный массив полностью заменяет существующие данные'
              items:
                $ref: '#/components/schemas/ClientPhone'
        poll:
          type: object
          description: 'Приходит если отправить expand=poll'
          properties:
            id:
              type: integer
