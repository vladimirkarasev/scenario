openapi: 3.1.0
components:
  schemas:
    ImplementationReport:
      required:
        - date
      type: object
      properties:
        id:
          type: integer
          description: 'ID отчета'
        dealer_id:
          type: string
          description: 'ID дилера'
        date:
          type: string
          description: 'Период (в формате YYYY-mm-dd)'
        valid:
          type: boolean
          description: Статус
        created_at:
          type: string
          description: 'Дата создания отчета'
        updated_at:
          type: string
          description: 'Дата редактирования отчета'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImplementationReportItem'
      description: 'Модель отчет по реализации'
    ImplementationReportItem:
      required:
        - article
        - channel
        - cost
        - count
        - doc_date
        - doc_number
        - implementation_report_id
      type: object
      properties:
        id:
          type: integer
          description: 'ID строки отчета, генерируется автоматически'
        implementation_report_id:
          type: integer
          description: 'ID отчета по реализации'
        article:
          type: string
        count:
          type: integer
          description: Количество
        cost:
          type: number
          description: 'Закупочная стоимость за единицу без НДС'
        price:
          type: number
          description: 'Стоимость конечной реализации за единицу, с НДС'
        channel:
          type: string
          description: 'Канал реализации'
        doc_number:
          type: string
          description: 'Номер документа реализации'
        doc_date:
          type: string
          description: 'Дата документа реализации (в формате YYYY-mm-dd)'
      description: 'Модель строка отчета по реализации'
    ImportHistoryRequest:
      type: object
      required:
        - connector
        - date_from
        - date_to
        - dealer_id
      properties:
        connector:
          type: integer
          description: 'ID коннектора для импорта'
          example: 6
        date_from:
          type: string
          description: 'Дата начала периода импорта в формате ДД.ММ.ГГГГ'
          example: 01.01.2024
        date_to:
          type: string
          description: 'Дата окончания периода импорта в формате ДД.ММ.ГГГГ'
          example: 31.12.2024
        dealer_id:
          type: array
          items:
            type: integer
          description: 'Массив ID дилеров для импорта'
          example:
            - 2
      description: 'Запрос на импорт исторических заказов ЗЧ'
    ImportHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 'Успешность выполнения'
          example: true
        url_file:
          type: string
          description: 'URL файла с результатами импорта'
          example: 'https://52bb3d86-982f-40ea-bece-aa8a49debb77.selstorage.ru/2025/10/16/history-orders-68f1021fbc292.json'
        uploadId:
          type: integer
          description: 'ID загрузки файла'
          example: 11091982
      description: 'Ответ на запрос импорта исторических заказов ЗЧ'
    Incadea:
      required:
        - dealer_code
        - vehicle_vin
      type: object
      properties:
        id:
          type: integer
          description: 'Код (генерируется автоматически)'
        dealer_code:
          type: string
          description: 'Код дилера'
        vehicle_vin:
          type: string
          description: 'VIN автомобиля'
        order_type_code:
          type: string
          description: 'Тип заказа'
        order_type_code_date:
          type: string
          description: 'Дата смены типа заказа в формате yyyy-mm-dd'
        planned_delivery_at:
          type: string
          description: 'Планируемая дата выдачи в формате yyyy-mm-dd'
        vehicle_dealer_sale_at:
          type: string
          description: 'Дата продажи в формате yyyy-mm-dd'
        vehicle_receipt_date:
          type: string
          description: 'Дата прихода на склад в формате yyyy-mm-dd'
        status:
          type: string
          description: 'Статус записи'
          enum:
            - 'active - Новая'
            - 'deleted - Выполнена'
            - 'error - Ошибка'
            - 'progress - Обрабатывается'
        comment:
          type: string
          description: 'Описание ошибки'
      description: 'Модель запись из истории изменений автомобиля на складе'
    Interest:
      required:
        - first_name
        - last_name
        - request_type_id
        - source_id
      type: object
      description: 'Модель Обращение'
      properties:
        id:
          type: integer
          description: 'ID обращения (генерируется автоматически)'
        activity_id:
          type: integer
          description: 'ID сферы деятельности'
        add_more_time:
          type: integer
          description: 'Добавлено время в минутах к KPI'
        additional_request_type_id:
          type: integer
          description: 'Уточняющая цель обращения'
        address:
          type: string
          description: 'Адрес клиента'
        available_dealers:
          type: string
          description: 'Доступные дилеры'
        birthday_at:
          type: string
          description: 'День рождения клиента (гггг-мм-дд)'
          example: 949276800
        block:
          type: string
          description: Корпус
        brand_id:
          type:
            - 'null'
