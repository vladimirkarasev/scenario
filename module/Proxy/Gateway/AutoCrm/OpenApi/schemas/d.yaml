openapi: 3.1.0
components:
  schemas:
    DamageReport:
      type: object
      properties:
        id:
          type: integer
          description: 'ID отчёта'
        type_id:
          type: integer
          enum:
            - 1
            - 2
          description: "Тип отчёта\n`1` - Приёмка `2` - Отгрузка"
        code:
          type: string
          description: 'Номер ТН/CMR'
        vin:
          type: string
          description: VIN
        transporter_number:
          type: string
          description: 'Номер автовоза'
        trailer_number:
          type: string
          description: 'Номер прицепа'
        date:
          type: string
          description: 'Дата приемки/отгрузки (см. `type_id`)'
          format: date
        entityType:
          type: string
          description: 'Тип сущности "Дилер/Склад"'
          enum:
            - warehouse
            - dealer
          readOnly: true
        entityID:
          type: integer
          description: 'ID сущности "Дилер/Склад"'
          readOnly: true
        entity:
          oneOf:
            - $ref: '#/components/schemas/DamageReportPartnerBase'
            - $ref: '#/components/schemas/DamageReportDealer'
          properties: { }
          description: 'Сущность "Дилер/Склад"'
          readOnly: true
        shippingCompany:
          $ref: '#/components/schemas/DamageReportPartnerBase'
          readOnly: true
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDriver'
        rapport:
          $ref: '#/components/schemas/DamageReportRapport'
          readOnly: true
        damages:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDamage'
          readOnly: true
        vehicle:
          $ref: '#/components/schemas/DamageReportVehicle'
          readOnly: true
        upload:
          $ref: '#/components/schemas/DamageReportUpload'
          readOnly: true
      description: 'Модель ОУПТС'
    DamageReportBrand:
      type: object
      properties:
        id:
          type: integer
          description: 'ID бренда'
        name:
          type: string
          description: 'Наименование бренда'
      description: 'Модель бренда'
    DamageReportDamage:
      type: object
      properties:
        id:
          type: integer
          description: 'ID повреждения'
        report_id:
          $ref: '#/components/schemas/DamageReport/properties/id'
        element_id:
          $ref: '#/components/schemas/DamageReportElement/properties/id'
        damage_type:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory/properties/name'
          writeOnly: true
        damage_size:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory/properties/name'
          writeOnly: true
        damage_stage_id:
          $ref: '#/components/schemas/DamageReportStage/properties/id'
        comment:
          type: string
          description: Комментарий
        uploads:
          type: array
          description: Фотографии
          items:
            $ref: '#/components/schemas/DamageReportUpload'
          readOnly: true
        damageTypes:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory'
          readOnly: true
          description: 'Тип повреждений'
        damageSizes:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory'
          readOnly: true
          description: 'Размер повреждений'
        damageStatuses:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory'
          readOnly: true
          description: 'Статус повреждений'
      description: 'Модель повреждения в отчёте'
    DamageReportDamageForm:
      required:
        - report_id
        - element_id
        - 'damage_type[]'
        - 'damage_size[]'
        - damage_stage_id
        - 'damageStatuses[]'
      properties:
        report_id:
          $ref: '#/components/schemas/DamageReport/properties/id'
        element_id:
          $ref: '#/components/schemas/DamageReportElement/properties/id'
        'damage_type[]':
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory/properties/name'
          description: 'ID из справочника `GET service/damage-report/type`'
        'damage_size[]':
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory/properties/name'
          description: 'ID из справочника `GET service/damage-report/size`'
        damage_stage_id:
          $ref: '#/components/schemas/DamageReportStage/properties/id'
        'damageStatuses[]':
          type: array
          items:
            type: integer
          description: 'ID из справочника `GET service/damage-report/status`'
        comment:
          $ref: '#/components/schemas/DamageReportDamage/properties/comment'
        'files[]':
          type: array
          description: 'Фотографии повреждения'
          items:
            type: string
            format: binary
    DamageReportDealer:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Dealer/properties/id'
        code:
          $ref: '#/components/schemas/Dealer/properties/code'
        name:
          $ref: '#/components/schemas/Dealer/properties/name'
        marketing_name:
          $ref: '#/components/schemas/Dealer/properties/marketing_name'
    DamageReportDirectory:
      type: object
      properties:
        id:
          oneOf:
            - type: string
            - type: integer
          description: 'ID элемента справочника'
        name:
          type: string
          description: 'Значение элемента справочника'
        description:
          type: string
          description: 'Описание элемента справочника'
      description: 'Модель справочника для ОУПТС'
    DamageReportDriver:
      required:
        - first_name
      type: object
      properties:
        id:
          type: integer
          description: 'ID водителя'
        first_name:
          type: string
          description: 'Имя водителя'
        middle_name:
          type: string
          description: 'Отчество водителя'
        last_name:
          type: string
          description: 'Фамилия водителя'
        active:
          type: boolean
          description: Активность
      description: 'Модель водителя'
    DamageReportElement:
      required:
        - type
        - name
      type: object
      properties:
        id:
          type: integer
          description: 'ID элемента ущерба'
        name:
          type: string
          description: 'Наименование элемента ущерба'
        code:
          type: string
          description: 'Код элемента ущерба'
        type:
          type: integer
          enum:
            - 1
            - 2
          description: "Тип элемента ущерба\n`1` - Элемент а/м (дверь, капот, шина) `2` - Сопроводительный товар (аптечка, домкрат)"
        base_element:
          type: string
          description: 'Элемент на схеме'
      description: 'Модель элемента ущерба'
    DamageReportForm:
      required:
        - date
      type: object
      properties:
        requiredAttribute:
          type: string
          description: "Дилер/Склад\n`dealer_id` - Дилер `warehouse_id` - Склад"
          enum:
            - dealer_id
            - warehouse_id
          default: warehouse_id
        date:
          type: string
          description: 'Дата приемки/отгрузки'
          format: date
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          default: 01.01.2024
        drivers:
          type: array
          items:
            required:
              - type
              - first_name
              - id
            type: object
            properties:
              type:
                type: string
                description: "Тип водителя\n`new` - Новый `exist` - Существующий"
                enum:
                  - new
                  - exist
              id:
                $ref: '#/components/schemas/DamageReportDriver/properties/id'
              first_name:
                $ref: '#/components/schemas/DamageReportDriver/properties/first_name'
              middle_name:
                $ref: '#/components/schemas/DamageReportDriver/properties/middle_name'
              last_name:
                $ref: '#/components/schemas/DamageReportDriver/properties/last_name'
        report:
          required:
            - vin
            - type_id
            - transporter_number
            - shipping_company_id
            - dealer_id
            - warehouse_id
          properties:
            vin:
              $ref: '#/components/schemas/DamageReport/properties/vin'
            type_id:
              $ref: '#/components/schemas/DamageReport/properties/type_id'
            code:
              $ref: '#/components/schemas/DamageReport/properties/code'
            transporter_number:
              $ref: '#/components/schemas/DamageReport/properties/transporter_number'
            trailer_number:
              $ref: '#/components/schemas/DamageReport/properties/trailer_number'
            dealer_id:
              $ref: '#/components/schemas/Dealer/properties/id'
            warehouse_id:
              $ref: '#/components/schemas/DamageReportPartnerBase/properties/id'
            shipping_company_id:
              $ref: '#/components/schemas/DamageReportPartnerBase/properties/id'
    DamageReportPairForm:
      required:
        - id
        - date
      type: object
      properties:
        id:
          type: integer
          description: 'ID исходной ОУПТС'
        date:
          type: string
          description: 'Дата приемки/отгрузки'
          format: date
          pattern: '^\d{2}\.\d{2}\.\d{4}$'
          default: 01.01.2024
        copyDamages:
          type: boolean
          description: 'Перенос повреждений'
          default: true
        report:
          properties:
            shipping_company_id:
              $ref: '#/components/schemas/DamageReportPartnerBase/properties/id'
            code:
              $ref: '#/components/schemas/DamageReport/properties/code'
            transporter_number:
              $ref: '#/components/schemas/DamageReport/properties/transporter_number'
            trailer_number:
              $ref: '#/components/schemas/DamageReport/properties/trailer_number'
            drivers:
              type: array
              items:
                $ref: '#/components/schemas/DamageReportDriver'
    DamageReportPartner:
      required:
        - name
      type: object
      allOf:
        - $ref: '#/components/schemas/DamageReportPartnerBase'
      properties:
        requisites:
          type: object
          description: Реквизиты
          properties:
            legal_form:
              type: string
              description: 'Форма собственности'
            legal_form_full:
              type: string
              description: 'Форма собственности полностью'
            legal_entity:
              type: string
              description: 'Юридическое лицо'
            legal_entity_eng:
              type: string
              description: 'Юридическое лицо Eng.'
            inn:
              type: string
              description: ИНН
            kpp:
              type: string
              description: КПП
            ogrn:
              type: string
              description: ОГРН
            okpo:
              type: string
              description: ОКПО
            company_phone:
              type: string
              description: Телефон
            bank_name:
              type: string
              description: 'Наименование банка'
            settlement_account:
              type: string
              description: 'Расчётный мчёт'
            correspondent_account:
              type: string
              description: 'Кореспондентский счёт'
            bik:
              type: string
              description: БИК
          readOnly: true
        addresses:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID
              address:
                type: string
                description: Адрес
              code_address:
                type: string
                description: 'Код адреса'
              postal_code:
                type: string
                description: Индекс
              city:
                type: string
                description: Город
              region:
                type: string
                description: Регион
              delivery_time:
                type: array
                description: 'Время работы'
                items:
                  type: object
                  properties:
                    begin:
                      type: string
                    end:
                      type: string
                    is_day_off:
                      type: string
              persons:
                type: array
                description: 'Ответственные за прием'
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: ID
                    first_name:
                      type: string
                      description: Имя
                    last_name:
                      type: string
                      description: Фамилия
                    middle_name:
                      type: string
                      description: Отчество
                    phone:
                      type: string
                      description: Телефон
                    email:
                      type: string
                      description: Email
          readOnly: true
      description: 'Модель склада дистрибьютора'
    DamageReportPartnerBase:
      required:
        - name
      type: object
      properties:
        id:
          type: integer
          description: 'ID склада дистрибьютора'
        name:
          type: string
          description: 'Наименование склада дистрибьютора'
        active:
          type: boolean
          description: Активность
        types:
          type: array
          items:
            $ref: '#/components/schemas/DamageReportDirectory'
          readOnly: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
          readOnly: true
      description: 'Модель склада дистрибьютора'
    DamageReportPartnerForm:
      allOf:
        - $ref: '#/components/schemas/DamageReportPartnerBase'
      properties:
        typeIDs:
          type: array
          items:
            type: integer
          writeOnly: true
        userIDs:
          type: array
          items:
            type: integer
          writeOnly: true
    DamageReportRapport:
      type: object
      properties:
        id:
          type: integer
          description: 'ID транспортной претензии'
        client_id:
          type: integer
          description: 'ID клиента'
        car_id:
          type: integer
          description: 'ID автомобиля'
        dealer_id:
          type: integer
          description: 'ID дилера'
        purchase_id:
          type: integer
          description: 'ID заказ-наряда'
      description: 'Модель транспортной претензии'
    DamageReportStage:
      type: object
      properties:
        id:
          type: integer
          description: 'ID степени ущерба'
        name:
          type: string
          description: 'Наименование степени ущерба'
        code:
          type: string
          description: 'Код степени ущерба'
        need_photo:
          type: boolean
          description: 'Требуется фото'
        is_active:
          type: boolean
          description: Активность
      description: 'Модель степени ущерба'
    DamageReportUpload:
      type: object
      properties:
        id:
          type: integer
          description: 'ID файла'
        name:
          type: string
          description: 'Наименование файла'
        url:
          type: string
          description: 'Ссылка на файл'
        mimetype:
          type: string
          description: 'MIME-тип файла'
      description: 'Модель загруженного файла'
    DamageReportUploadForm:
      properties:
        file:
          type: string
          description: 'Содержимое файла в формате Base64'
        name:
          type: string
          description: 'Название файла'
        url:
          type: string
          description: 'Ссылка на файл'
      description: 'Модель загрузки файла'
    DamageReportVehicle:
      type: object
      properties:
        vehicle_id:
          type: integer
          description: 'ID автомобиля'
        vehicle_vin:
          type: string
          description: 'VIN автомобиля'
        brand:
          $ref: '#/components/schemas/DamageReportBrand'
      description: 'Модель автомобиля на складе'
    Dealer:
      type: object
      properties:
        id:
          type: integer
          description: 'ID Дилера'
        code:
          type: string
          description: 'Код дилера'
        dealer_type:
          type: integer
          description: "Тип дилера: 1 - Продажи, сервис, запчасти, 2 - Сервис, запчасти, 3 - Продажи, 4 - Запчасти, 5 - Продажи, запчасти, 6 - Независимая сервисная станция, 7 - Параллельный импорт\n"
        name:
          type: string
          description: Наименование
        english_name:
          type: string
          description: 'Наименование (англ.)'
        marketing_name:
          type: string
          description: 'Маркетинговое название'
        english_marketing_name:
          type: string
          description: 'Маркетинговое название (англ.)'
        address:
          type: string
          description: Адрес
        english_address:
          type: string
          description: 'Адрес (англ.)'
        service_address:
          type: string
          description: 'Адрес СТО'
        english_service_address:
          type: string
          description: 'Адрес СТО (англ.)'
        juridical_region_id:
          type: integer
          description: 'id региона'
        juridical_city_id:
          type: integer
          description: 'id города'
        juridical_zip_code:
          type: string
          description: 'Почтовый индекс'
        juridical_street:
          type: string
          description: Улица
        juridical_house:
          type: string
          description: Дом
        juridical_building:
          type: string
          description: Строение
        tags:
          type: array
          items:
            $ref: '#/components/schemas/DealerTag'
        website:
          type: string
          description: 'Веб сайт'
        email:
          type: string
          description: Email
        phone:
          type: string
          description: Телефон
        replacement_phone:
          type: string
          description: 'Подменный номер для сайта'
        lat:
          type: number
          description: Широта
        lng:
          type: number
          description: Долгота
        service_lat:
          type: number
          description: 'Широта (СТО)'
        service_lng:
          type: number
          description: 'Долгота (СТО)'
        registerDealerAt:
          type: string
          description: 'Дата начала работы как дилер в формате dd.MM.yyyy'
        inactiveSince:
          type: string
          description: 'Дата завершения работы как дилер в формате dd.MM.yyyy'
        serviceDeactivatedAt:
          type: string
          description: 'Дата завершения работы как сервис в формате dd.MM.yyyy'
        country_id:
          type: integer
          description: 'ID страны'
        city_id:
          type: integer
          description: 'ID города'
        region_id:
          type: integer
          description: 'ID региона'
        workTime:
          type: array
          description: 'Рабочее время'
          items:
            $ref: '#/components/schemas/WorkTime'
        departmentsWorkTime:
          type: array
          description: 'Рабочее время отделов'
          items:
            $ref: '#/components/schemas/DepartmentWorkTime'
        holding_code:
          type: string
          description: 'Код дилера в INCADEA'
        legal_form:
          type: string
          description: 'Форма собственности'
        legal_form_full:
          type: string
          description: 'Форма собственности полностью'
        legal_entity:
          type: string
          description: 'Юридическое лицо'
        legal_entity_eng:
          type: string
          description: 'Юридическое лицо Eng'
        settlement_account:
          type: string
          description: 'Расчетный счет'
        bik:
          type: string
          description: БИК
        correspondent_account:
          type: string
          description: 'Корреспондентский счет'
        bank_name:
          type: string
          description: 'Наименование банка'
        inn:
          type: string
          description: ИНН
        kpp:
          type: string
          description: КПП
        ogrn:
          type: string
          description: ОГРН
        okpo:
          type: string
          description: ОКПО
        distributor_id:
          type: integer
          description: 'ID дистрибьютора'
        minimum_sales_plan:
          type: number
          description: 'Минимальный план продаж дилера'
        estimated_delivery_days:
          type: integer
          description: 'Средний срок доставки автомобиля к дилеру в днях'
        sm_id:
          type: number
          description: 'Сотрудник СМ отв. за дилера'
        contract_type:
          type: string
          description: 'Тип соглашения о сотрудничестве'
        consignmentAllowedDate:
          type: string
          description: 'Разрешена консигнация (при вкл. "Условия оплаты")'
        contractSigningAt:
          type: string
          description: 'Дата соглашения'
        contractFinishAt:
          type: string
          description: 'Дата окончания соглашения'
        land_area:
          type: number
          description: 'Общ. площадь земельного участка'
        building_area:
          type: number
          description: 'Общ. площадь здания'
        authorized_capital:
          type: number
          description: 'Уставной капитал, руб.'
        employees:
          type: number
          description: 'Общ. численность ДЦ'
        registerCompanyAt:
          type: string
          description: 'Дата регистрации компании'
        brand_list:
          type: string
          description: 'Другие бренды компании/холдинга'
        dc_legal_form:
          type: string
          description: 'Вид собственности ДЦ'
        land_legal_form:
          type: string
          description: 'Вид собственности земли'
        landLeaseFinishAt:
          type: string
          description: 'Аренда земли до'
        buildingLeaseFinishAt:
          type: string
          description: 'Аренда здания до'
        dealer_number:
          type: string
          description: '№ Дилерского соглашения'
        founders:
          type: string
          description: Учредители
        type_id:
          type: number
          description: 'Вид ДЦ'
        directorPosition:
          type: string
          description: 'Должность руководителя'
        directorActsOnBasis:
          type: string
          description: 'Действует на основании'
        directorFio:
          type: string
          description: 'ФИО руководителя'
        external_id:
          type: string
          description: 'Внешний ID'
        combining_with_brands:
          type: string
          description: 'Совмещение с брендами в здании/шоуруме'
        service_center_phone:
          type: string
          description: 'Телефон сервисного центра'
        status_id:
          type: number
          description: 'Статус дилера'
        general_director:
          $ref: '#/components/schemas/DealerPerson'
        dealership_head:
          $ref: '#/components/schemas/DealerPerson'
        juridical_address:
          $ref: '#/components/schemas/DealerAddress'
        actual_address:
          $ref: '#/components/schemas/DealerAddress'
        correspondence_address:
          $ref: '#/components/schemas/DealerAddress'
        dealer_address:
          $ref: '#/components/schemas/DealerAddress'
        after_sale_service_address:
          type: array
          description: 'Адрес послепродажного обслуживания'
          items:
            $ref: '#/components/schemas/DealerAddress'
        secure_parking_address:
          type: array
          description: 'Адрес охраняемой стоянки автомобилей'
          items:
            $ref: '#/components/schemas/DealerAddress'
        spare_delivery_address:
          type: array
          description: 'Адрес доставки запасных частей и аксессуаров'
          items:
            $ref: '#/components/schemas/DealerAddress'
        territory:
          type: array
          description: 'Территория деятельности дилерского центра'
          items:
            $ref: '#/components/schemas/DealerTerritory'
        chief_accountant:
          $ref: '#/components/schemas/DealerContactPerson'
        contact_person_for_acts:
          type: array
