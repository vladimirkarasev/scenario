        gwm_id:
          type: string
          description: 'Gwm ID'
        order_no:
          type: string
          description: 'Order No'
        payment_serial_number:
          type: string
          description: 'Payment Serial Number'
        telegram_profile:
          type: string
          description: 'Ссылка на профиль Telegram'
        vk_profile:
          type: string
          description: 'Ссылка на профиль ВКонтакте'
        ok_profile:
          type: string
          description: 'Ссылка на профиль Одноклассники'
        is_double:
          type: boolean
