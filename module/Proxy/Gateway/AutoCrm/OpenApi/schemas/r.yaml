        extra:
          type: string
          description: 'Дополнительные данные обращения'
        carRepairAppDate:
          type: string
          format: date
          description: 'Дата обращения гарантийного ремонта'
        carRepairEndDate:
          type: string
          format: date
          description: 'Дата окончания ремонта'
    RequestAiAnalysisCheckListAssessment:
      description: 'Оценка по результатам проверки чек-листа'
      type: object
      properties:
        id:
          type: integer
          description: 'идентификатор оценки'
        checklist_template_id:
          type: integer
          description: 'идентификатор шаблона чек-листа'
        title:
          type: string
          description: 'наименование оценки'
        percent_from:
          type: integer
          description: 'процент от'
        percent_to:
          type: integer
          description: 'процент до'
        distributor_id:
          oneOf:
            - type: 'null'
            - type: integer
          description: 'идентификатор дистрибьютора'
    RequestBuy:
      type: object
      properties:
        id:
          type: integer
          description: 'ID лида'
        purchaseDateFrom:
          type: string
          description: 'Желаемая дата покупки от (формат dd.MM.yyyy)'
