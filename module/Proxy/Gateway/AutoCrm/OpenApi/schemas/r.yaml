openapi: 3.1.0
components:
  schemas:
    RecallCampaign:
      required:
        - code
        - name
        - start_at
        - type
      type: object
      properties:
        id:
          type: integer
          description: 'Идентификатор (генерируется автоматически)'
        code:
          type: string
          description: Код
        name:
          type: string
          description: Наименование
        description:
          type: string
          description: Описание
        description_link:
          type: string
          description: 'Ссылка на описание'
        start_at:
          type: string
          description: 'Дата начала'
        end_at:
          type: string
          description: 'Дата окончания'
        reason:
          type: string
          description: 'Причина объявления отзывной кампании'
        repair_action:
          type: string
          description: 'Необходимое ремонтное воздействие'
        repair_time:
          type: string
          description: 'Необходимое время на ремонтное воздействие'
        type:
          type: integer
          description: 'Тип (1 - Сервисная, 2 - Отзывная)'
        status:
          type: integer
          description: 'Статус (1 - Активно, 2 - Удалено)'
        works:
          type: array
          description: 'Коды работ'
          items:
            $ref: '#/components/schemas/RecallCampaignWork'
        vins:
          type: array
          description: 'VIN номера'
          items:
            $ref: '#/components/schemas/RecallCampaignVin'
        spareParts:
          type: array
          description: ЗЧ
          items:
            $ref: '#/components/schemas/RecallCampaignSparePart'
      description: 'Модель отзывная кампания'
    RecallCampaignSparePart:
      type: object
      properties:
        revocable_campaign_id:
          type: integer
          description: 'Идентификатор кампании'
        code:
          type: string
          description: 'Код зч'
      description: 'Модель зч отзывной кампании'
    RecallCampaignVin:
      type: object
      properties:
        revocable_campaign_id:
          type: integer
          description: 'Идентификатор кампании'
        vin:
          type: string
          description: VIN
        dealer_id:
          type: string
          description: 'Идентификатор дилера'
        repair_at:
          type: string
          description: 'Дата выполнения'
        mileage:
          type: string
          description: Пробег
        complaint_code:
          type: string
          description: 'Номер рекламации'
        showroomCode:
          type: string
          description: 'Код шоурума'
        recallCampaign:
          $ref: '#/components/schemas/RecallCampaign'
        dealer:
          $ref: '#/components/schemas/Dealer'
      description: 'Модель VIN номер отзывной кампании'
    RecallCampaignWork:
      type: object
      properties:
        revocable_campaign_id:
          type: integer
          description: 'Идентификатор кампании'
        code:
          type: string
          description: 'Код работы'
      description: 'Модель работа отзывной кампании'
    ReclamationRegistry:
      type: object
      properties:
        id:
          type: integer
          description: 'ID СВР'
        code:
          type: string
          description: 'Номер ведомости'
        dealer_code:
          type: string
          description: 'Код дилера'
        dealer_legal_name:
          type: string
          description: 'Наименование дилера'
        period:
          type: string
          description: 'Период ведомости в формате dd.mm.yyyy'
          example: 01.12.2023
        nds_rate:
          type: number
          format: float
          description: 'Ставка НДС'
        nds_sum:
          type: number
          format: float
          description: 'Сумма НДС'
        reclamation_sum:
          type: number
          format: float
          description: 'Общая сумма ГТ в ведомости'
        reclamations:
          type: array
          description: 'Список ГТ в ведомости'
          items:
            type: object
            properties:
              id:
                type: integer
              code:
                type: string
              car_vin:
                type: string
              work_sum:
                type: number
                format: float
              spare_sum:
                type: number
                format: float
              subcontractor_sum:
                type: number
                format: float
              total_sum:
                type: number
                format: float
    ReclamationRegistryStage:
      type: object
      properties:
        taskStageCode:
          type: string
          description: 'Код этапа (system_0, system_1 или user_{id})'
          example: user_3
        name:
          type: string
          description: 'Название этапа'
          example: Отклонена
        documentProvidedAtRequired:
          type: boolean
          description: 'Требуется ли дата предоставления документов для перехода на этап'
    ReclamationRegistryWorkflowRequest:
      type: object
      required:
        - taskStageCode
      properties:
        taskStageCode:
          type: string
          description: 'Код этапа задачи (например, user_5, system_0, system_1)'
          example: user_5
        documentProvidedAt:
          type: string
          description: 'Дата предоставления документов в формате dd.MM.yyyy (требуется для некоторых этапов)'
          example: 15.12.2023
    ReclamationRegistryWorkflowResponse:
      type: object
      properties:
        save:
          type: boolean
          description: 'Признак успешного сохранения'
        id:
          type: integer
          description: 'ID сводной ведомости'
    Region:
      required:
        - country_id
        - federal_district_id
        - id
        - name
        - status
      type: object
      properties:
        id:
          type: integer
          description: 'ID (генерируется автоматически)'
          example: 1
        name:
          maxLength: 255
          type: string
          description: 'Название страны'
          example: 'Республика Адыгея (Адыгея)'
        english_name:
          maxLength: 255
          type: string
          description: 'Название страны (англ.)'
          example: 'Agdzabedinskij rajon'
        okato:
          maxLength: 255
          type: string
          description: 'Код по ОКАТО'
          example: '79'
        timezone:
          maxLength: 255
          type: string
          description: 'Часовой пояс'
          example: Europe/Moscow
        status:
          type: integer
          description: Статус
          example: 0
        country_id:
          type: integer
          description: 'Идентификатор страны'
          example: 1
        federal_district_id:
          type: integer
          description: 'Идентификатор федерального округа'
          example: 2
        lat:
          type: number
          description: Широта
          example: 44.8229155
        lng:
          type: number
          description: Долгота
          example: 40.1754463
      description: 'Модель региона'
    RepairCalc:
      type: object
      properties:
        id:
          type: integer
          description: ID
        code:
          type: string
          description: 'Код калькуляции'
        date_next_contact:
          type: string
          description: 'Дата следующего контакта (формат: ГГГГ-ММ-ДД)'
        comment:
          type: string
          description: 'Комментарий к Калькуляции'
        status:
          type: integer
          description: 'Статус (1 - Активна, 2 - Выполнена, 3 - Выполнена частично, 4 - Не актуально, 5 - Удалена)'
        car_id:
          type: integer
          description: Авто
        purchase_id:
          type: integer
          description: Заказ-наряд
        client_id:
          type: integer
          description: Клиент
        dealer_id:
          type: integer
          description: Дилер
        total_sum:
          type: number
          description: 'Итоговая сумма'
        created_at:
          type: string
          description: 'Дата создания'
        updated_at:
          type: string
          description: 'Дата обновления'
      description: Модель
    RepairCalcForm:
      required:
        - car_id
        - client_id
        - code
        - dealer_id
        - purchase_id
      type: object
      properties:
        client_id:
          type: integer
          description: Клиент
        car_id:
          type: integer
          description: Авто
        dealer_id:
          type: integer
          description: Дилер
        code:
          type: string
          description: 'Код калькуляции'
        date_next_contact:
          type: string
          description: 'Дата следующего контакта (формат: ДД.ММ.ГГГ)'
        comment:
          type: string
          description: 'Комментарий к Калькуляции'
        status:
          type: integer
          description: 'Статус (1 - Активна, 2 - Выполнена, 3 - Выполнена частично, 4 - Не актуально, 5 - Удалена)'
        purchase_id:
          type: integer
          description: Заказ-наряд
        works:
          type: array
          description: Работы
          items:
            $ref: '#/components/schemas/RepairCalcWorkForm'
        spares:
          type: array
          description: ЗЧ
          items:
            $ref: '#/components/schemas/RepairCalcSpareForm'
      description: 'Обязательно либо комментарий, либо работы, либо ЗЧ'
    RepairCalcSpare:
      type: object
      properties:
        id:
          type: integer
          description: ID
        repair_calc_id:
          type: integer
          description: Калькуляция
        code:
          type: string
          description: Артикул
        name:
          type: string
          description: Наименование
        price:
          type: number
          description: 'Цена (руб.)'
        sum:
          type: number
          description: 'Сумма (руб.)'
        quantity:
          type: number
          description: Кол-во
        status:
          type: integer
          description: 'Статус (1 - Рекомендация, 2 - Выполнен, 3 - Отказ)'
        created_at:
          type: string
          description: 'Дата создания'
        updated_at:
          type: string
          description: 'Дата обновления'
    RepairCalcSpareForm:
      required:
        - code
        - name
        - price
        - quantity
        - sum
      type: object
      properties:
        code:
          type: string
          description: Код
        name:
          type: string
          description: Наименование
        price:
          type: number
          description: Цена
        quantity:
          type: number
          description: Кол-во
        status:
          type: integer
          description: 'Статус (1 - Рекомендация, 2 - Выполнен, 3 - Отказ)'
        sum:
          type: number
          description: Сумма
    RepairCalcUpdateForm:
      type: object
      properties:
        client_id:
          type: integer
          description: Клиент
        car_id:
          type: integer
          description: Авто
        dealer_id:
          type: integer
          description: Дилер
        code:
          type: string
          description: 'Код калькуляции'
        date_next_contact:
          type: string
          description: 'Дата следующего контакта (формат: ДД.ММ.ГГГ)'
        comment:
          type: string
          description: 'Комментарий к Калькуляции'
        status:
          type: integer
          description: 'Статус (1 - Активна, 2 - Выполнена, 3 - Выполнена частично, 4 - Не актуально, 5 - Удалена)'
        purchase_id:
          type: integer
          description: Заказ-наряд
        works:
          type: array
          description: Работы
          items:
            $ref: '#/components/schemas/RepairCalcWorkForm'
        spares:
          type: array
          description: ЗЧ
          items:
            $ref: '#/components/schemas/RepairCalcSpareForm'
      description: 'Обязательно либо комментарий, либо работы, либо ЗЧ'
    RepairCalcView:
      type: object
      properties:
        id:
          type: integer
          description: ID
        code:
          type: string
          description: 'Код калькуляции'
        date_next_contact:
          type: string
          description: 'Дата следующего контакта'
        comment:
          type: string
          description: 'Комментарий к Калькуляции'
        status:
          type: string
          description: 'Статус (1 - Активна, 2 - Выполнена, 3 - Выполнена частично, 4 - Не актуально, 5 - Удалена)'
        car_id:
          type: integer
          description: Авто
        purchase_id:
          type: integer
          description: Заказ-наряд
        client_id:
          type: integer
          description: Клиент
        dealer_id:
          type: integer
          description: Дилер
        total_sum:
          type: number
          description: 'Итоговая сумма'
        created_at:
          type: string
          description: 'Дата создания'
        updated_at:
          type: string
          description: 'Дата обновления'
        works:
          type: array
          description: Работы
          items:
            $ref: '#/components/schemas/RepairCalcWork'
        spares:
          type: array
          description: Запчасти
          items:
            $ref: '#/components/schemas/RepairCalcSpare'
    RepairCalcWork:
      type: object
      properties:
        id:
          type: integer
          description: ID
        repair_calc_id:
          type: integer
          description: Калькуляция
        code:
          type: string
          description: Артикул
        name:
          type: string
          description: Наименование
        price:
          type: number
          description: 'Цена (руб.)'
        sum:
          type: number
          description: 'Сумма (руб.)'
        quantity:
          type: number
          description: Кол-во
        status:
          type: integer
          description: 'Статус (1 - Рекомендация, 2 - Выполнен, 3 - Отказ)'
        created_at:
          type: string
          description: 'Дата создания'
        updated_at:
          type: string
          description: 'Дата обновления'
    RepairCalcWorkForm:
      required:
        - code
        - name
        - price
        - quantity
        - sum
      type: object
      properties:
        code:
          type: string
          description: Код
        name:
          type: string
          description: Наименование
        price:
          type: number
          description: Цена
        quantity:
          type: number
          description: Кол-во
        status:
          type: integer
          description: 'Статус (1 - Рекомендация, 2 - Выполнен, 3 - Отказ)'
        sum:
          type: number
          description: Сумма
    Request:
      type: object
      description: 'Модель Лид'
      properties:
        id:
          type: integer
          description: 'ID лида (генерируется автоматически)'
        campaign_id:
          type: integer
          description: 'ID Кампании'
        department_id:
          type: integer
          description: 'Тип подразделения'
        request_type_id:
          type: integer
          description: 'Цель обращения'
        client_id:
          type: integer
          description: 'ID клиента'
        contact_person_id:
          type: integer
          description: 'ID контактного лица'
        client:
          $ref: '#/components/schemas/ClientRequest'
        contactPerson:
          $ref: '#/components/schemas/ClientRequest'
        channel_id:
          type: integer
          description: Канал
        source_id:
          type: integer
          description: Источник
        dealer_id:
          type: integer
          description: Дилер
        dealerCode:
          type: string
          description: 'Код дилера'
        user_id:
          type: integer
          description: 'пользователь, создавший обращение'
        assigned_id:
          type: integer
          description: 'ID сотрудника, назначенного исполнителем по лиду'
        comment:
          type: string
          description: Комментарий
        is_business:
          type: integer
          description: 'Признак юридического лица'
        business_name:
          type: string
          description: 'Название компании'
        business_inn:
          type: string
          description: ИНН
        business_kpp:
          type: string
          description: КПП
        business_address:
          type: string
          description: 'Юридический адрес'
        first_name:
          type: string
          description: Имя
        middle_name:
          type: string
          description: Отчество
        last_name:
          type: string
          description: Фамилия
        birthday_at:
          type: string
          description: 'Дата рождения'
        prefix:
          type: integer
          description: Обращение
        email:
          type: string
          description: Email
        address:
          type: string
          description: Адрес
        may_process_personal_data:
          type: boolean
          description: 'клиент согласен на обработку персональных данных'
        client_confirm_communication:
          type: boolean
          description: 'Клиент дал согласие на коммуникацию'
        communication_method:
          type: string
          description: 'Предпочтительный способ связи'
        brand_id:
          type: integer
          description: Марка
        model_id:
          type: integer
          description: Модель
        procurementCars:
          type: array
          description: 'Массив автомобилей поставки'
          items:
            $ref: '#/components/schemas/ProcurementCar'
        generation_id:
          type: integer
          description: Поколение
        serie_id:
          type: integer
          description: Серия
        equipment_id:
          type: integer
          description: Комплектация
        color_id:
          type: integer
          description: 'ID цвета экстерьера'
        trim_id:
          type: integer
          description: 'ID цвета интерьера'
        vin:
          type: string
          description: 'вин автомобиля'
        job:
          type: string
          description: 'JOB номер'
        interest_id:
          type: integer
          description: 'ID потребности'
        is_deal:
          type: string
          description: 'есть сделка(РЛ или ЗН)'
        commonVehicles:
          type: string
          description: 'автомобили клиента'
        utm_id:
          type: integer
          description: 'UTM метка'
        created_at:
          type: string
          description: Создано
        updated_at:
          type: string
          description: 'дата изменения'
        timeleft:
          type: string
          description: 'оставшееся время для взятия в работу'
        canLinkWorksheet:
          type: boolean
          description: 'возможность прикрепить РЛ'
        canLinkPurchase:
          type: boolean
          description: 'возможность прикрепить ЗН'
        canSendWorksheet:
          type: boolean
          description: 'возможность отправить РЛ'
        canSendPurchase:
          type: boolean
          description: 'возможность отправить ЗН'
        is_voximplant:
          type: string
          description: 'передан в воксимплант'
        voximplant_process:
          type: string
          description: 'обработан voximplant'
        voximplant_call_record_url:
          type: string
          description: 'Ссылка на разговор в воксимплант'
        voximplant_call_date:
          type: string
          description: 'Дата звонка через воксимплант'
        voximplant_call_duration:
          type: string
          description: 'Продолжительность звонка через воксимплант'
        voximplant_status:
          type: integer
          description: 'ID Статуса звонка через воксимплант'
        voximplant_status_name:
          type: string
          description: 'Статус звонка через воксимплант'
        voximplant_time_to_first_call:
          type: string
          description: 'время до первого звонка'
        voximplant_is_connect:
          type: string
          description: 'был звонок клиенту'
        voximplantHistory:
          type: array
