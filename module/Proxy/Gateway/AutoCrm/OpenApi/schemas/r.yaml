            $ref: '#/components/schemas/RequestVoximplant'
        status:
          type: integer
          description: 'статус лида'
        vehicleModel:
          type: string
          description: модель
        vehicleBrand:
          $ref: '#/components/schemas/BaseBrand'
        buy:
          $ref: '#/components/schemas/RequestBuy'
        credit:
          $ref: '#/components/schemas/RequestCredit'
        service:
          $ref: '#/components/schemas/RequestService'
        tradeIn:
          $ref: '#/components/schemas/RequestTradeIn'
        reserve:
          $ref: '#/components/schemas/RequestReserve'
        usedVehicle:
          $ref: '#/components/schemas/RequestUsedVehicle'
        source:
          $ref: '#/components/schemas/Source'
        requestType:
          $ref: '#/components/schemas/RequestType'
        interest:
          $ref: '#/components/schemas/Interest'
          readonly: true
        stages:
          type: array
          description: 'этапы лида'
          items:
            $ref: '#/components/schemas/Stage'
        statuses:
          type: array
          description: 'внешние статусы лида'
          items:
            $ref: '#/components/schemas/RequestStatus'
        commentsData:
          type: array
          description: 'Массив с комментариями по лиду'
