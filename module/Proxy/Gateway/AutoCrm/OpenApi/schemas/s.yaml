openapi: 3.1.0
components:
  schemas:
    Sale:
      required:
        - bank_id
        - client_id
        - date
        - manager_id
        - source_id
        - trade_in
        - type
        - vehicle_id
      type: object
      properties:
        id:
          type: integer
          description: 'Код (генерируется автоматически)'
        dealer_id:
          type: 'integer,'
          description: 'ID дилера'
        vehicle_id:
          type: integer
          description: 'ID автомобиля'
        vehicle:
          type: object
          properties:
            vehicle_vin:
              type: string
              description: 'VIN автомобиля'
            is_trade_in:
              type: integer
              description: Б\У
          description: 'Модель автомобиля'
        common_client_id:
          type: integer
          description: 'ID клиента дистрибьютора'
        client_id:
          type: integer
          description: 'ID клиента'
        client:
          $ref: '#/components/schemas/ClientResponse'
          description: 'Модель клиента'
          client_json:
            type: string
            description: 'Модель клиента в формате JSON'
        date:
          type: string
          description: 'дата рапорта'
        source_id:
          type: integer
          description: 'ID источника'
        manager_id:
          type: integer
          description: 'ID менеджера'
        manager:
          $ref: '#/components/schemas/Manager'
          description: 'Модель менеджера'
        type:
          type: string
          description: 'тип оплаты case, bank, leasing'
        bank_id:
          type: integer
          description: 'ID банка / лизинговой компании'
        leasing_contract_number:
          type: string
          description: 'Номер договора лизинга'
        leasing_contract_date:
          type: string
          description: 'Дата договора лизинга'
        leasing_end_date:
          type: string
          description: 'Дата окончания лизинга'
        leasing_payment_sum:
          type: string
          description: 'Лизинговый платеж'
        leasing_sum:
          type: string
          description: 'Сумма лизинга'
        leasing_expired:
          type: string
          description: 'Срок лизинга'
        is_received:
          type: boolean
          description: 'Рапорт выгружен во внешнюю систему'
        trade_in:
          type: boolean
          description: Трейд-ин
        iov_agreement:
          type: boolean
          description: 'Соглашение IOV заключено'
        iov_agreement_version:
          type: integer
          description: 'Версия соглашения IOV (1 - "2021-1", 2 - "2021-2")'
        iov_agreement_phone:
          type: string
          description: 'Телефон соглашения IOV'
        iov_agreement_client_name:
          type: string
          description: 'Имя пользователя IOV'
        iov_agreement_client_surname:
          type: string
          description: 'Фамилия пользователя IOV'
        iovAgreementVersionName:
          type: string
          description: 'Название версии соглашения IOV'
        iovAgreementLink:
          type: string
          description: 'Ссылка на скан соглашения IOV'
        conditional_sale:
          type: integer
          description: 'Признак условной реализации (0 - Нет, 1 - Да)'
        user_id:
          type: integer
          description: 'ID пользователя'
        created_at:
          type: string
          description: 'Дата создания (в формате YYYY-mm-dd H:i:s)'
        updated_at:
          type: string
          description: 'Дата обновления (в формате YYYY-mm-dd H:i:s)'
      description: 'Модель рапорт'
    SaleAdditionalService:
      required:
        - additional_service_id
        - vin
      type: object
      properties:
        additional_service_id:
          type: integer
          description: 'id услуги'
        vin:
          type: string
          description: 'VIN автомобиля'
        start:
          type: string
          description: 'Дата окончания услуги (ГГГГ-ММ-ДД)'
        end:
          type: string
          description: 'Дата начала услуги (ГГГГ-ММ-ДД)'
      description: 'Модель для добавления дополнительной услуги к рапорту'
    SaleAdditionalServiceDelete:
      required:
        - additional_service_id
        - vin
      type: object
      properties:
        additional_service_id:
          type: integer
          description: 'id услуги'
        vin:
          type: string
          description: 'VIN автомобиля'
      description: 'Модель для удаления дополнительной услуги из рапорта'
    SaleAdditionalServicePrice:
      type: object
      properties:
        brand_id:
          type: integer
          description: 'ID бренда'
        model_id:
          type: integer
          description: 'ID модели'
        generation_id:
          type: integer
          description: 'ID поколения'
        serie_id:
          type: integer
          description: 'ID серии'
        modification_id:
          type: integer
          description: 'ID модификации'
        equipment_id:
          type: integer
          description: 'ID комплектации'
        price:
          type: number
          format: float
          description: Стоимость
        start_date:
          type: string
          description: 'Действует с, формат DD.MM.YYYY'
        end_date:
          type: string
          description: 'Действует по, формат DD.MM.YYYY'
      description: 'Стоимость дополнительной услуги по автомобилю'
    SaleAdditionalServicePriceGroup:
      type: object
      properties:
        id:
          type: integer
          description: 'ID группы стоимости'
        service_id:
          type: integer
          description: 'ID услуги'
        service_name:
          type: string
          description: 'Название услуги'
        status:
          type: integer
          description: 'Статус группы (1 - Активный, 2 - Удалено)'
        prices:
          type: array
          description: 'Список стоимостей по автомобилям'
          items:
            $ref: '#/components/schemas/SaleAdditionalServicePrice'
      description: 'Группа стоимостей дополнительной услуги'
    SaleAdditionalServiceSale:
      required:
        - additional_service_id
        - vin
      type: object
      properties:
        additional_service_id:
          type: integer
          description: 'id услуги'
        vin:
          type: string
          description: 'VIN автомобиля'
        start:
          type: string
          description: 'Дата окончания услуги (ГГГГ-ММ-ДД)'
        end:
          type: string
          description: 'Дата начала услуги (ГГГГ-ММ-ДД)'
        sale_at:
          type: string
          description: 'Дата начала услуги (ГГГГ-ММ-ДД)'
      description: 'Модель для добавления дополнительной услуги к рапорту'
    SalePublic:
      required:
        - bank_id
        - client_id
        - date
        - manager_id
        - source_id
        - trade_in
        - type
        - vehicle_id
      type: object
      properties:
        id:
          type: integer
          description: 'Код (генерируется автоматически)'
        dealer_id:
          type: 'integer,'
          description: 'ID дилера'
        vehicle_id:
          type: integer
          description: 'ID автомобиля'
        vehicle:
          type: object
          properties:
            vehicle_vin:
              type: string
              description: 'VIN автомобиля'
            is_trade_in:
              type: integer
              description: Б\У
          description: 'Модель автомобиля'
        common_client_id:
          type: integer
          description: 'ID клиента дистрибьютора'
        client_id:
          type: integer
          description: 'ID клиента'
        client:
          $ref: '#/components/schemas/ClientResponse'
          description: 'Модель клиента'
          client_json:
            type: string
            description: 'Модель клиента в формате JSON'
        date:
          type: string
          description: 'дата рапорта'
        source_id:
          type: integer
          description: 'ID источника'
        manager_id:
          type: integer
          description: 'ID менеджера'
        manager:
          $ref: '#/components/schemas/Manager'
          description: 'Модель менеджера'
        type:
          type: string
          description: 'тип оплаты case, bank, leasing'
        bank_id:
          type: integer
          description: 'ID банка / лизинговой компании'
        leasing_contract_number:
          type: string
          description: 'Номер договора лизинга'
        leasing_contract_date:
          type: string
          description: 'Дата договора лизинга'
        leasing_end_date:
          type: string
          description: 'Дата окончания лизинга'
        leasing_payment_sum:
          type: string
          description: 'Лизинговый платеж'
        leasing_sum:
          type: string
          description: 'Сумма лизинга'
        leasing_expired:
          type: string
          description: 'Срок лизинга'
        is_received:
          type: boolean
          description: 'Рапорт выгружен во внешнюю систему'
        trade_in:
          type: boolean
          description: Трейд-ин
        iov_agreement:
          type: boolean
          description: 'Соглашение IOV заключено'
        iov_agreement_version:
          type: integer
          description: 'Версия соглашения IOV (1 - "2021-1", 2 - "2021-2")'
        iov_agreement_phone:
          type: string
          description: 'Телефон соглашения IOV'
        iov_agreement_client_name:
          type: string
          description: 'Имя пользователя IOV'
        iov_agreement_client_surname:
          type: string
          description: 'Фамилия пользователя IOV'
        iovAgreementVersionName:
          type: string
          description: 'Название версии соглашения IOV'
        iovAgreementLink:
          type: string
          description: 'Ссылка на скан соглашения IOV'
        conditional_sale:
          type: integer
          description: 'Признак условной реализации (0 - Нет, 1 - Да)'
        user_id:
          type: integer
          description: 'ID пользователя'
        created_at:
          type: string
          description: 'Дата создания (в формате YYYY-mm-dd H:i:s)'
        updated_at:
          type: string
          description: 'Дата обновления (в формате YYYY-mm-dd H:i:s)'
      description: 'Модель рапорт'
      example:
        id: 1
        name: Плательщик
    SaleReportByDayModel:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Дата
        dealerShowroomCode:
          type: string
          description: Код
        dealerMarketingName:
          type: string
          description: Маркет.наименование
        dealerName:
          type: string
          description: Юр.наименование
        brandName:
          type: string
          description: Бренд
        modelName:
          type: string
          description: Модель
        modelYear:
          type: integer
          description: 'Модельный год'
        primaryCalls:
          type: integer
          description: Звонки
        primaryVisits:
          type: integer
          description: Визиты
        primaryInternet:
          type: integer
          description: Интернет
        primaryColdCalls:
          type: integer
          description: 'Хол зв'
        primaryTrafficTotal:
          type: integer
          description: 'Итого трафик'
        worksheetsWithContacts:
          type: integer
          description: 'Вз. конт.(ФПК)'
        worksheetsWithContactsPercentage:
          type: number
          format: float
          description: 'Вз. конт.(ФПК) % от Итого трафик'
        visitsCallInternet:
          type: integer
          description: 'Итого посещений По звонку, интернету'
        visitsCallInternetPercentage:
          type: number
          format: float
          description: 'Итого посещений По звонку, интернету % от Итого трафик'
        visitsTotal:
          type: integer
          description: 'Итого посещений'
        testDrives:
          type: integer
          description: Тест-драйвы
        testDrivesPercentage:
          type: number
          format: float
          description: 'Тест-драйвы % от Итого посещений'
        contractsTotal:
          type: integer
          description: 'Контракты Всего'
        contracts:
          type: integer
          description: 'Контракты Без отказов'
        contractsPercentage:
          type: number
          format: float
          description: 'Контракты Всего % от Итого посещений'
        canceledContracts:
          type: integer
          description: 'Отказы от контракта'
        canceledContractsPercentage:
          type: number
          format: float
          description: 'Отказы от контракта % от контрактов'
        issues:
          type: integer
          description: Выдача
        issuesPercentage:
          type: number
          format: float
          description: 'Выдача % от Итого посещений'
        reports:
          type: integer
          description: Рапорт
        reportsPercentage:
          type: number
          format: float
          description: 'Рапорт % от Итого посещений'
      description: 'Отчёт по продажам'
    SaleType:
      type: object
      properties:
        id:
          type: integer
          description: 'ID записи (генерируется автоматически)'
        status:
          type: string
          description: 'Статус ("active", "deleted")'
        name:
          type: string
          description: Наименование
        description:
          type: string
          description: Описание
        warehouse_code:
          type: string
          description: 'Код на складе'
      description: 'Модель тип продажи'
    Schedule:
      required:
        - date
        - status
        - user_id
      type: object
      properties:
        id:
          type: integer
          description: 'ID записи (генерируется автоматически)'
        user_id:
          type: integer
          description: 'Идентификатор пользователя'
        date:
          type: string
          description: 'Дата в формате YYYY-MM-DD'
        times:
          type: array
          description: 'Временные интервалы'
          items:
            type: object
            properties:
              time_from:
                type: string
                description: 'Начало рабочего дня'
              time_to:
                type: string
                description: 'Конец рабочего дня'
              status:
                type: integer
                description: 'Состояние 1 - Работает, 2 - Не работает'
      description: 'Модель запись графика работы сотрудника'
    ScheduleForm:
      required:
        - date
        - user_id
      type: object
      properties:
        user_id:
          type: integer
          description: 'Идентификатор пользователя'
        date:
          type: string
          description: 'Дата, формат Год-месяц-день'
        time_from:
          type: string
          description: 'Начало рабочего дня'
        time_to:
          type: string
          description: 'Конец рабочего дня'
        status:
          type: integer
          description: 'Состояние 1 - Работает, 2 - Не работает'
        times:
          type: array
          description: 'Временные интервалы'
          items:
            type: object
            properties:
              time_from:
                type: string
                description: 'Начало рабочего дня'
              time_to:
                type: string
                description: 'Конец рабочего дня'
              status:
                type: integer
                description: 'Состояние 1 - Работает, 2 - Не работает'
      description: 'Модель запись графика работы сотрудника'
    ScheduleTimeForm:
      required:
        - status
      type: object
      properties:
        time_from:
          type: string
          description: 'Начало рабочего дня'
        time_to:
          type: string
          description: 'Конец рабочего дня'
        status:
          type: integer
          description: 'Состояние 1 - Работает, 2 - Не работает'
      description: 'Модель временного интервала графика работы сотрудника'
    ScheduleWithoutDate:
      required:
        - status
        - user_id
      type: object
      properties:
        id:
          type: integer
          description: 'ID записи (генерируется автоматически)'
        user_id:
          type: integer
          description: 'Идентификатор пользователя'
        time_from:
          type: string
          description: 'Начало рабочего дня'
        time_to:
          type: string
          description: 'Конец рабочего дня'
        status:
          type: integer
          description: 'Состояние 1 - Работает, 2 - Не работает'
        times:
          type: array
          description: 'Временные интервалы'
          items:
            type: object
            properties:
              time_from:
                type: string
                description: 'Начало рабочего дня'
              time_to:
                type: string
                description: 'Конец рабочего дня'
              status:
                type: integer
                description: 'Состояние 1 - Работает, 2 - Не работает'
      description: 'Модель запись графика работы сотрудника без даты'
    Serie:
      type: object
      properties:
        id:
          type: integer
          description: 'ID серии'
        name:
          type: string
          description: Наименование
        model_id:
          type: integer
          description: 'ID модели'
        generation_id:
          type: integer
          description: 'ID поколения'
        is_recent:
          type: integer
          description: Актуальная
      description: Серия
    ServiceNote:
      type: object
      properties:
        maintenance:
          type: string
          description: ТО
        date:
          type: string
          description: 'Дата записи'
        mileage:
          type: integer
          description: Пробег
        purchase_code:
          type: integer
          description: 'Код заказ-наряда'
        dealer_name:
          type: string
          description: 'Название дилера'
        dealer_code:
          type: string
          description: 'Код дилера'
        number:
          type: integer
          description: 'Номер ТО'
      description: 'Модель сервисной записи'
    Shipment:
      type: object
      description: 'Модель отгрузки'
      required:
        - vin
        - nomenclature_id
        - consignee_point_id
        - planed_at
        - status
      properties:
        id:
          type: integer
          description: 'Код (генерируется автоматически)'
        vin:
          type: string
          description: VIN
        nomenclature_id:
          type: integer
          description: 'ID номенклатуры'
        nomenclature_name:
          type: string
          description: 'Наименование номенклатуры'
        nomenclature_weight:
          type: string
          description: 'Вес а/м'
        consignee_point_id:
          type: integer
          description: 'ID грузополучателя'
        consignee_point_contacts:
          description: 'Список контактных лиц грузополучателя'
          $ref: '#/components/schemas/DealerPerson'
        consignee_point_inn:
          type: string
          description: 'ИНН грузополучателя'
        consignee_point_address_code:
          type: string
          description: 'Код адреса доставки'
        consignee_point_legal_entity:
          type: string
          description: 'ЮЛ грузополучателя'
        consignee_point_kpp:
          type: string
          description: 'КПП грузополучателя'
        warehouse_id:
          type: integer
          description: 'ID склада отгрузки'
        warehouse_address:
          type: string
          description: 'Адрес отгрузки'
        delivery_warehouse_id:
          type: integer
          description: 'ID склада доставки'
        delivery_warehouse_inn:
          type: integer
          description: 'ИНН грузоотправителя'
        delivery_warehouse_legal_entity:
          type: integer
          description: 'ЮЛ грузоотправителя'
        delivery_warehouse_kpp:
          type: integer
          description: 'КПП грузоотправителя'
        loading_address:
          type: string
          description: 'Адрес доставки'
        tariff_service_id:
          type: integer
          description: 'ID тарифа'
        delivery_type:
          type: integer
          description: 'Тип отгрузки'
          enum:
            - '1 - Дилерская'
            - '2 - Перемещение'
            - '3 - Самовывоз'
        planed_at:
          type: string
          description: 'Планируемая дата доставки, в формате dd.MM.yyyy'
        sent_at:
          type: string
          description: 'Планируемая дата доставки, в формате dd.MM.yyyy'
        invoice_price:
          type: number
          description: 'Входная стоимость'
        invoice_paid_at:
          type: string
          description: 'Дата оплаты счёта, в формате dd.MM.yyyy'
        status:
          type: integer
          description: Статус
          enum:
            - '1 - Заявлено'
            - '2 - Принято'
            - '3 - Отгружено'
            - '4 - Доставлено'
            - '5 - Передано в ТК'
            - '6 - Запланировано'
            - '7 - Удалена'
        amount:
          type: number
          description: 'Стоимость перевозки'
        confirmed_at:
          type: string
          description: 'Дата подтверждения, в формате dd.MM.yyyy'
        request_id:
          type: integer
          description: 'ID заявки в транспортную компанию'
        plan_shipped_at:
          type: string
          description: 'Плановая дата отгрузки от ТК , в формате dd.MM.yyyy'
        fact_shipped_at:
          type: string
          description: 'Фактическая дата отгрузки, в формате dd.MM.yyyy'
        warehouse_fact_shipped_at:
          type: string
          description: 'Фактическая дата отгрузки от склада, в формате dd.MM.yyyy'
        plan_shipped_at_by_contract:
          type: string
          description: 'Плановая дата отгрузки по договору, в формате dd.MM.yyyy'
        plan_delivered_at:
          type: string
          description: 'Плановая дата доставки, в формате dd.MM.yyyy'
        plan_delivered_at_by_contract:
          type: string
          description: 'Плановая дата доставки по договору, в формате dd.MM.yyyy'
        fact_delivered_at:
          type: string
          description: 'Фактическая дата доставки, в формате dd.MM.yyyy'
        consignment_number:
          type: string
          description: 'Номер ТН'
        carrier_number:
          type: string
          description: 'Номер Автовоза'
        updated_at:
          type: string
          description: 'Изменено, в формате dd.MM.yyyy HH:mm'
        comment:
          type: string
        transit_period_plan:
          type: integer
          description: 'Срок транзита план'
        transit_period_fact:
          type: integer
          description: 'Срок транзита факт'
        final_plan_shipped_at_date:
          type: string
          description: 'Плановая дата отгрузки финал, в формате dd.MM.yyyy'
        final_plan_shipped_at_time:
          type: string
          description: 'Плановое время отгрузки финал, в формате HH:mm'
