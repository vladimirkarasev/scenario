openapi: 3.1.0
info:
  title: 'Dealer Network Management - vehicle-trim'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: vehicle-trim
    description: 'Управление обивкой'
paths:
  /vehicle-trim:
    get:
      tags:
        - vehicle-trim
      summary: 'Получение списка обивки'
      description: 'Получение списка обивки'
      parameters:
        -
          name: model_id
          in: query
          description: 'ID модели'
          schema:
            type: integer
        -
          name: name
          in: query
          description: Наименование
          schema:
            type: string
        -
          name: code
          in: query
          description: Код
          schema:
            type: string
        -
          name: common_skin_id
          in: query
          description: 'ID общей обивки'
          schema:
            type: integer
        -
          name: serie_id
          in: query
          description: 'ID серии'
          schema:
            type: integer
        -
          name: is_deleted
          in: query
          description: 'Удалён (0 - Нет, 1 - Да)'
          schema:
            type: integer
            default: 0
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
        -
          name: expand
          in: query
          description: 'Получение дополнительных полей, можно передать несколько значений через запятую * **series** - Сущность серии * **skinSeries** - ID серий'
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список обивки'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Skin'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/vehicle-trim/{id}':
    get:
      tags:
        - vehicle-trim
      summary: 'Получение списка обивки по ID'
      description: 'Получение списка обивки по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id обивки'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список обивки по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Skin'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
