openapi: 3.1.0
info:
  title: 'Dealer Network Management - nami'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: nami
    description: 'Управление отчетами НАМИ'
paths:
  /nami:
    get:
      tags:
        - nami
      summary: 'Получение списка отчетов НАМИ'
      description: 'Получение списка отчетов НАМИ'
      parameters:
        - name: id
          in: query
          description: 'ID записи'
          schema:
            type: integer
        - name: vin
          in: query
          description: VIN
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список отчетов НАМИ'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Nami'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/nami/{id}':
    get:
      tags:
        - nami
      summary: 'Получение отчета по id'
      description: 'Получение отчета по id'
      parameters:
        - name: id
          in: path
          description: 'id отчета'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает отчет по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Nami'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
