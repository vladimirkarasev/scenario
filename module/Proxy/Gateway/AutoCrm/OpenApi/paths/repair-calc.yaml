openapi: 3.1.0
info:
  title: 'Dealer Network Management - repair-calc'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: repair-calc
    description: 'Калькуляция отложенных работ'
paths:
  /repair-calc:
    get:
      tags:
        - repair-calc
      summary: 'Получение списка калькуляций'
      description: 'Получение списка калькуляций'
      parameters:
        - name: code
          in: query
          description: 'Код калькуляции'
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список калькуляций'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepairCalc'
    post:
      tags:
        - repair-calc
      summary: 'Создание калькуляций'
      description: 'Создание калькуляций'
      requestBody:
        description: 'Объект калькуляции'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairCalcForm'
        required: true
      responses:
        200:
          description: 'Возвращает список калькуляций'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepairCalcView'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/repair-calc/{id}':
    get:
      tags:
        - repair-calc
      summary: 'Получение калькуляций'
      description: 'Получение калькуляций'
      parameters:
        - name: id
          in: path
          description: 'Код калькуляции'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список калькуляций'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepairCalcView'
    put:
      tags:
        - repair-calc
      summary: 'Редактирование калькуляций'
      description: 'Редактирование калькуляций'
      parameters:
        - name: id
          in: path
          description: 'Код калькуляции'
          required: true
          schema:
            type: string
      requestBody:
        description: 'Объект калькуляции'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairCalcUpdateForm'
        required: true
      responses:
        200:
          description: 'Возвращает список калькуляций'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepairCalcView'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
