      responses:
        200:
          description: 'Возвращает список статусов заказов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderReference'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
