        - name: name
          in: query
          description: Название
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список статусов оплаты'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderReference'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /order/reference/refund-reason:
    get:
      tags:
        - order-reference
      description: 'Получить список причин возвратов'
      summary: 'Получить список причин возвратов'
      parameters:
        - name: id
          in: query
          description: 'ID причины возврата'
          schema:
