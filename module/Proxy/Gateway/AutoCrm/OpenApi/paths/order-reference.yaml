        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /order/reference/refund-status:
    get:
      tags:
        - order-reference
      description: 'Получить список статусов возвратов'
      summary: 'Получить список статусов возвратов'
      parameters:
        - name: id
          in: query
          description: 'ID статуса возврата'
          schema:
            type: integer
        - name: external_id
          in: query
          description: 'Внешний ID'
          schema:
            type: string
        - name: name
          in: query
          description: Название
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список статусов возвратов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderReference'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /order/reference/status:
    get:
      tags:
        - order-reference
      description: 'Получить список статусов заказов'
      summary: 'Получить список статусов заказов'
      parameters:
        - name: id
          in: query
