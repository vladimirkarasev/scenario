openapi: 3.1.0
info:
  title: 'Dealer Network Management - client-common-vehicle'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: client-common-vehicle
    description: 'Связь клиентов дилера и автомобилей дистрибьютора'
paths:
  /client-common-vehicle:
    get:
      tags:
        - client-common-vehicle
      summary: 'Получение списка связей клиента дилера и автомобиля дистрибьютора'
      description: 'Получение списка связей клиента дилера и автомобиля дистрибьютора'
      parameters:
        - name: client_id
          in: query
          description: 'ID клиента дилера'
          schema:
            type: integer
        - name: common_client_id
          in: query
          description: 'ID клиента дистрибьютора'
          schema:
            type: integer
        - name: expand
          in: query
          description: "Получение дополнительных полей:\n* **commonVehicle** - Автомобиль дистрибьютора\n"
      responses:
        200:
          description: 'Возвращает список'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientCommonVehicle'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - client-common-vehicle
      summary: 'Добавления связи клиента дилера и автомобиля дистрибьютора'
      description: 'Добавления связи клиента дилера и автомобиля дистрибьютора'
      requestBody:
        description: 'Модель формы'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCommonVehicleForm'
        required: true
      responses:
        201:
          description: 'Связь успешно добавлена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCommonVehicleForm'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/client-common-vehicle/{id}':
    put:
      tags:
        - client-common-vehicle
      summary: 'Изменение связи клиента дилера и автомобиля дистрибьютора'
      description: 'Изменение связи клиента дилера и автомобиля дистрибьютора'
      parameters:
        - name: id
          in: path
          description: 'ID связи'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Модель формы'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCommonVehicleForm'
        required: false
      responses:
        200:
          description: 'Связь успешно изменена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCommonVehicleForm'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    delete:
      tags:
        - client-common-vehicle
      summary: 'Удаление связи клиента дилера и автомобиля дистрибьютора'
      description: 'Удаление связи клиента дилера и автомобиля дистрибьютора'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Успешное удаление по ID'
          content: { }
        400:
          description: 'Ошибка клиента'
          content: { }
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
