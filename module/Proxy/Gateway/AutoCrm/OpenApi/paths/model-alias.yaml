openapi: 3.1.0
info:
  title: 'Dealer Network Management - model-alias'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: model-alias
    description: 'Управление алиасами моделей'
paths:
  /model-alias:
    get:
      tags:
        - model-alias
      summary: 'Получение списка алиасов моделей'
      description: 'Получение списка алиасов моделей'
      parameters:
        -
          name: name
          in: query
          description: Наименование
          schema:
            type: string
        -
          name: country_id
          in: query
          description: 'ID страны'
          schema:
            type: integer
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
        -
          name: expand
          in: query
          description: "Получение дополнительных полей, можно передать несколько значений через запятую\n* **country_ids** - Список ID стран * **equipment** * **modification**"
          schema:
            type: string
        -
          name: model_id
          in: query
          description: 'ID модели'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список алиасов моделей'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelAlias'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/model-alias/{id}':
    get:
      tags:
        - model-alias
      summary: 'Получение алиаса модели по ID'
      description: 'Получение алиаса модели по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id алиаса модели'
          required: true
          schema:
            type: integer
        -
          name: expand
          in: query
          description: "Получение дополнительных полей, можно передать несколько значений через запятую\n* **country_ids** - Список ID стран"
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает алиас модели по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelAlias'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
