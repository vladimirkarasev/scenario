openapi: 3.1.0
info:
  title: 'Dealer Network Management - service-note'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: service-note
    description: 'Сервисные записи'
paths:
  /service-note:
    get:
      tags:
        - service-note
      summary: 'Просмотр сервисных записей'
      description: 'Просмотр сервисных записей'
      parameters:
        - name: vin
          in: query
          description: 'VIN автомобиля'
          schema:
            type: string
        - name: loyalty_member_id
          in: query
          description: 'ID участника программы лояльности'
          schema:
            type: string
        - name: expand
          in: query
          description: 'Параметр, позволяющий получить в ответе связные данные (purchaseWorks - список работ из ЗН)'
          schema:
            type: string
      responses:
        200:
          description: 'Сервисные записи'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceNote'
        400:
          description: 'Некорректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
