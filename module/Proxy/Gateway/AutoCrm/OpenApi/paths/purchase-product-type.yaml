openapi: 3.1.0
info:
  title: 'Dealer Network Management - purchase-product-type'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: purchase-product-type
    description: 'Управление типами продукта'
paths:
  /purchase-product-type:
    get:
      tags:
        - purchase-product-type
      summary: 'Получение списка типов продуктов'
      description: 'Получение списка типов продуктов'
      parameters:
        - name: id
          in: query
          description: 'ID типов продуктов'
          schema:
            type: integer
        - name: status
          in: query
          description: 'Статус типов продуктов'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список типов продуктов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseProductType'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/purchase-product-type/{id}':
    get:
      tags:
        - purchase-product-type
      summary: 'Получение типа продукта по ID'
      description: 'Получение типа продукта по ID'
      parameters:
        - name: id
          in: path
          description: 'id типа продукта'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает тип продуктов по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseProductType'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
