openapi: 3.1.0
info:
  title: 'Dealer Network Management - voice-box-poll-filling'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: voice-box-poll-filling
    description: 'Заполнение опроса'
paths:
  '/client-service/voice-box-poll-filling/{id}':
    put:
      tags:
        - voice-box-poll-filling
      summary: 'Добавление результатов прохождения опроса'
      description: 'Добавление результатов прохождения опроса'
      parameters:
        - name: id
          in: path
          description: 'ID опроса'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Объект VoiceBoxPollEventForm'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceBoxPollEventForm'
        required: true
      responses:
        201:
          description: 'Опрос успешно проведен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceBoxPollEventForm'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
