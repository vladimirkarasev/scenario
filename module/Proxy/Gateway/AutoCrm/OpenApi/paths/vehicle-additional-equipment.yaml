openapi: 3.1.0
info:
  title: 'Dealer Network Management - vehicle-additional-equipment'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: vehicle-additional-equipment
    description: 'Управление доп. оборудованием'
paths:
  /vehicle-additional-equipment/group:
    get:
      tags:
        - vehicle-additional-equipment
      description: 'Получение списка групп доп. оборудования'
      parameters:
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список групп доп. оборудования'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleAdditionalEquipmentGroup'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - vehicle-additional-equipment
      description: 'Добавление группы доп. оборудования'
      requestBody:
        description: 'Объект VehicleAdditionalEquipmentGroup'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleAdditionalEquipmentGroup'
        required: true
      responses:
        201:
          description: 'Новая группа успешно добавлена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditionalEquipmentGroup'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/vehicle-additional-equipment/group/{id}':
    get:
      tags:
        - vehicle-additional-equipment
      description: 'Получение группы доп. оборудования'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает группу'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditionalEquipmentGroup'
        401:
          description: 'Необходима авторизация'
          content: { }
    put:
      tags:
        - vehicle-additional-equipment
      description: 'Редактирование группы доп. оборудования'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Объект VehicleAdditionalEquipmentGroup'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleAdditionalEquipmentGroup'
        required: true
      responses:
        201:
          description: 'Новая группа успешно отредактирована'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditionalEquipmentGroup'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    delete:
      tags:
        - vehicle-additional-equipment
      description: 'Удаление группы доп. оборудования'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Успешное удаление по ID'
          content: { }
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  /vehicle-additional-equipment/option:
    get:
      tags:
        - vehicle-additional-equipment
      description: 'Получение списка опций доп. оборудования'
      parameters:
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список опций доп. оборудования'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleAdditionalEquipmentOption'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - vehicle-additional-equipment
      description: 'Создание опции доп. оборудования'
      requestBody:
        description: 'Объект VehicleAdditionalEquipmentOption'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleAdditionalEquipmentOptionForm'
        required: true
      responses:
        201:
          description: 'Новая опция успешно добавлена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditionalEquipmentOption'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/vehicle-additional-equipment/option/{id}':
    get:
      tags:
        - vehicle-additional-equipment
      description: 'Получение опции доп. оборудования'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает опцию доп. оборудования'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditionalEquipmentOption'
        401:
          description: 'Необходима авторизация'
          content: { }
    put:
      tags:
        - vehicle-additional-equipment
      description: 'Редактирование опции доп. оборудования'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Объект VehicleAdditionalEquipmentGroup'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleAdditionalEquipmentOptionForm'
        required: true
      responses:
        201:
          description: 'Опция успешно отредактирована'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAdditionalEquipmentOption'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    delete:
      tags:
        - vehicle-additional-equipment
      description: 'Удаление опции доп. оборудования'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Успешное удаление по ID'
          content: { }
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
