openapi: 3.1.0
info:
  title: 'Dealer Network Management - activity'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: activity
    description: 'Управление сферами деятельности'
paths:
  /activity:
    get:
      tags:
        - activity
      summary: 'Получение списка сфер деятельности'
      description: 'Получение списка сфер деятельности'
      parameters:
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список сфер деятельности'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/activity/{id}':
    get:
      tags:
        - activity
      summary: 'Получение сфер деятельности по ID'
      description: 'Получение сфер деятельности по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id сферы деятельности'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает сферу деятельности по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
