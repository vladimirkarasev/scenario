openapi: 3.1.0
info:
  title: 'Dealer Network Management - purchase-payer'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: purchase-payer
    description: 'Управление плательщиками'
paths:
  /purchase-payer:
    get:
      tags:
        - purchase-payer
      summary: 'Получение списка плательщиков'
      description: 'Получение списка плательщиков'
      parameters:
        - name: id
          in: query
          description: 'ID плательщика'
          schema:
            type: integer
        - name: status
          in: query
          description: 'Статус плательщика'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список плательщиков'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchasePayer'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/purchase-payer/{id}':
    get:
      tags:
        - purchase-payer
      summary: 'Получение плательщика по ID'
      description: 'Получение плательщика по ID'
      parameters:
        - name: id
          in: path
          description: 'id плательщика'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает плательщика по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePayer'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
