openapi: 3.1.0
info:
  title: 'Dealer Network Management - vehicle'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: vehicle
    description: 'Управление клиентскими автомобилями'
paths:
  /vehicle:
    get:
      tags:
        - vehicle
      summary: 'Получение автомобиля'
      description: 'Получение автомобиля'
      parameters:
        - name: code
          in: query
          description: 'Внешний код автомобиля'
          schema:
            type: string
        - name: vin
          in: query
          description: 'VIN номер'
          schema:
            type: string
        - name: vin_manufacturer
          in: query
          description: 'VIN номер производителя'
          schema:
            type: string
        - name: id
          in: query
          description: 'ID автомобиля'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список автомобилей'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - vehicle
      summary: 'Добавление нового автомобиля'
      description: 'Добавление нового автомобиля'
      requestBody:
        description: 'Объект Автомобиль'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
        required: true
      responses:
        201:
          description: 'Новый автомобиль успешно создан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /vehicle/maintenance:
    get:
      tags:
        - vehicle
      summary: 'Получение даты следующего ТО автомобиля по VIN'
      description: 'Получение даты следующего ТО автомобиля по VIN'
      parameters:
        - name: vin
          in: query
          description: 'VIN номер'
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список автомобилей'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleMaintenance'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/vehicle/{id}':
    get:
      tags:
        - vehicle
      summary: 'Получение автомобиля по ID'
      description: 'Получение автомобиля по ID'
      parameters:
        - name: id
          in: path
          description: 'id автомобиля'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает автомобиль по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - vehicle
      summary: 'Изменение автомобиля'
      description: 'Изменение автомобиля'
      parameters:
        - name: id
          in: path
          description: 'id автомобиля'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель автомобиль'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
        required: false
      responses:
        200:
          description: 'Автомобиль успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
