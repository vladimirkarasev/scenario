openapi: 3.1.0
info:
  title: 'Dealer Network Management - request'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: request
    description: 'Управление Лидами'
paths:
  /lms/request:
    get:
      tags:
        - request
      summary: 'Получение списка лидов'
      description: 'Получение списка лидов'
      parameters:
        -
          name: id
          in: query
          description: ID
          schema:
            type: integer
        -
          name: created_from
          in: query
          description: 'Дата создания лида ПОСЛЕ в формате dd.mm.yyyy'
          schema:
            type: string
        -
          name: created_to
          in: query
          description: 'Дата создания лида ДО в формате dd.mm.yyyy'
          schema:
            type: string
        -
          name: excludeTag
          in: query
          description: 'Не содержит ID тега'
          schema:
            type: integer
        -
          name: pay_status
          in: query
          description: 'Статус оплаты (1 - новый, 2 - Ожидание, 3 - Холдирование, 4 - Ошибка, 5 - Оплачен, 6 - Возвращен)'
          schema:
            type: integer
        -
          name: leadResult
          in: query
          description: 'Результат лида'
          schema:
            type: integer
        -
          name: status
          in: query
          description: 'Статус лида (1 - новый, 2 - в работе, 3 - закрыт)'
          schema:
            type: string
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
        -
          name: interest_id
          in: query
          description: 'Идентификатор обращения'
          schema:
            type: integer
        -
          name: request_type_id
          in: query
          description: 'Цель обращения'
          schema:
            type: integer
        -
          name: existAssigned
          in: query
          description: 'Наличие исполнителя (1 - Да, 2 - Нет)'
          schema:
            type: integer
        -
          name: 'statuses[]'
          in: query
          description: 'Массив статусов (1 - новый, 2 - в работе, 3 - закрыт)'
          style: form
          schema:
            type: array
            items:
              type: integer
        -
          name: brand_id
          in: query
          description: 'Бренд автомобиля'
          schema:
            type: integer
        -
          name: model_id
          in: query
          description: 'Модель автомобиля'
          schema:
            type: integer
        -
          name: job
          in: query
          description: 'JOB номер'
          schema:
            type: string
        -
          name: common_client_id
          in: query
          description: 'ID клиента дистрибьютора'
          schema:
            type: integer
        -
          name: channel_id
          in: query
          description: 'ID канала'
          schema:
            type: integer
        -
          name: department_id
          in: query
          description: 'ID департамента'
          schema:
            type: integer
        -
          name: type
          in: query
          description: 'Тип лида (1 - Лид, 2 - Колл-центр)'
          schema:
            type: integer
        -
          name: source_id
          in: query
          description: 'ID источника'
          schema:
            type: integer
        -
          name: client_type
          in: query
          description: 'Тип клиента (0 - Физическое лицо, 1 - Юридическое лицо)'
          schema:
            type: integer
        -
          name: dealer_id
          in: query
          description: 'ID дилера'
          schema:
            type: integer
        -
          name: clientPhone
          in: query
          description: 'Телефон клиента'
          schema:
            type: string
        -
          name: executor_category_id
          in: query
          description: 'ID категории исполнителя'
          schema:
            type: integer
        -
          name: expand
          in: query
          description: "Получение дополнительных полей, можно передать несколько значений через запятую\n* **commentsData** - Список комментариев\n* **stages** - Расширенная информация по этапам лида\n* **procurementCars** - Автомобили и потребности корпоративного клиента\n* **contactPerson** - Контактное лицо корпоративного клиента\n* **client** - Клиент\n* **interest** - Обращение\n* **usedVehicle** - Покупка автомобиля с пробегом\n* **worksheet** - Рабочий лист\n* **purchase** - Заказ-наряд\n"
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список лидов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Response'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/lms/request/status/{id}':
    post:
      tags:
        - request
      summary: 'Изменение лида'
      description: 'Добавление внешнего статуса лида'
      parameters:
        -
          name: id
          in: path
          description: 'id лида'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель статус лида'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestStatus'
        required: false
      responses:
        200:
          description: 'Статус успешно добавлен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatus'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  '/lms/request/upload/{id}':
    put:
      tags:
        - request
      summary: 'Загрузить файл'
      description: 'Загрузить файл'
      parameters:
        -
          name: id
          in: path
          description: 'ID лида'
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestFile_Upload'
        required: true
      responses:
        200:
          description: 'Файл успешно загружен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestFile'
        400:
          description: 'Некорректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/lms/request/voximplant/{id}':
    put:
      tags:
        - request
      summary: 'Изменение лида'
      description: 'Изменение свойств Voximplant лида'
      parameters:
        -
          name: id
          in: path
          description: "id лида или external_guid обращения\nПримеры:\n  - 12345 (id)\n  - 123dda20b871ee0001cda456 (external_guid)\n"
          required: true
          schema:
            oneOf:
              -
                type: integer
              -
                type: string
        -
          name: type
          in: query
          description: 'Тип идентификатора'
          required: false
          schema:
            type: string
            enum:
              - id
              - external_guid
            default: id
      requestBody:
        description: 'модель Лид'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestVoximplant'
        required: false
      responses:
        200:
          description: 'Лид успешно изменена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  '/lms/request/{id}':
    get:
      tags:
        - request
      summary: 'Получение лида по ID'
      description: 'Получение лида по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id лида'
          required: true
          schema:
            type: integer
        -
          name: expand
          in: query
          description: "Получение дополнительных полей, можно передать несколько значений через запятую\n* **commentsData** - Список комментариев,\n* **stages** - Расширенная информация по этапам лида\n* **procurementCars** - Автомобили и потребности корпоративного клиента\n* **contactPerson** - Контактное лицо корпоративного клиента\n* **client** - Клиент\n* **interest** - Обращение\n* **usedVehicle** - Покупка автомобиля с пробегом\n* **worksheet** - Рабочий лист\n* **purchase** - Заказ-наряд\n* **aiAnalysis** - Данные обработки AI\n"
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает лид по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - request
      summary: 'Изменение лида'
      description: 'Данный метод используется в случае интеграции работы с лидами в систему дилера. Интеграция подразумевает online вывод списка новых лидов, без сохранения в систему до момента взятия лида в работу. Для этого, необходимо в сгенерированном списке сделать кнопку "Взять в работу" или "Создать рабочий лист" напротив каждого лида. При нажатии на кнопку необходимо выбрать менеджера и создать рабочий лист по стандартному бизнес процессу, реализованному в Вашей CRM системе. После создания рабочего листа необходимо отправить по API статус "Взят в работу" и отметку "Экспортирован".  При создании рабочего листа в CRM системе дилера важно сохранить ID лида из которого был создан рабочий лист. Данный ID необходимо передавать при синхронизации рабочих листов. Это избавит от необходимости привязывать вручную рабочий лист в системе CRM дистрибьютора. ID дилера можно изменить путем передачи его кода в поле в dealerCode'
      parameters:
        -
          name: id
          in: path
          description: 'id лида'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель Лид'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
        required: false
      responses:
        200:
          description: 'Лид успешно изменена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
