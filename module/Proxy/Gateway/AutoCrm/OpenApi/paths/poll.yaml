openapi: 3.1.0
info:
  title: 'Dealer Network Management - poll'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: poll
    description: Опросы
paths:
  /client-service/poll:
    get:
      tags:
        - poll
      summary: 'Получение списка опросов'
      description: 'Получение списка опросов'
      parameters:
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список опросов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Poll'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/client-service/poll/{id}':
    get:
      tags:
        - poll
      summary: 'Получение опроса по ID'
      description: 'Получение опроса по ID'
      parameters:
        - name: id
          in: path
          description: 'id опроса'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает опрос по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  /client-service/report/csi:
    get:
      tags:
        - poll
      summary: 'Отчёт по CSI (Сервис)'
      description: 'Отчёт по CSI (Сервис)'
      parameters:
        - name: pollId
          in: query
          description: 'id опроса'
          required: true
          schema:
            type: integer
        - name: 'period[]'
          in: query
          description: 'Период: (Список периодов в формате YYYY-MM)'
          style: form
          explode: true
          required: true
          schema:
            type: array
            items:
              type: string
        - name: userRole
          in: query
          description: 'id роли'
          schema:
            type: string
        - name: userPosition
          in: query
          description: 'id должности'
          schema:
            type: integer
        - name: userId
          in: query
          description: 'id сотрудника'
          schema:
            type: integer
      responses:
        200:
          description: 'Отчёт по CSI (Сервис)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PollReport'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
