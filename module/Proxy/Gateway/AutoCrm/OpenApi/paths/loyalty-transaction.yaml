openapi: 3.1.0
info:
  title: 'Dealer Network Management - loyalty-transaction'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: loyalty-transaction
    description: 'Транзакции участников программы лояльности'
paths:
  /loyalty/transaction:
    get:
      tags:
        - loyalty-transaction
      summary: 'Получить список транзакций программ лояльности'
      description: 'Получить список транзакций программ лояльности'
      parameters:
        -
          name: from
          in: query
          description: 'Дата транзакции от (в формате дд.мм.гггг)'
          schema:
            type: string
        -
          name: to
          in: query
          description: 'Дата транзакции от (в формате дд.мм.гггг)'
          schema:
            type: string
        -
          name: code
          in: query
          description: 'Код транзакции'
          schema:
            type: string
        -
          name: member_id
          in: query
          description: 'id участника программ лояльности'
          schema:
            type: integer
        -
          name: program_id
          in: query
          description: 'id программы лояльности'
          schema:
            type: integer
        -
          name: phone
          in: query
          description: 'Телефон участника программ лояльности'
          schema:
            type: string
        -
          name: status
          in: query
          description: 'Статус транзакции (1 — активна, 2 — удалена, 3 — списание баллов по истечению, 4 — резерв)'
          schema:
            type: integer
            enum:
              - 1
              - 2
              - 3
              - 4
        -
          name: external_order_number
          in: query
          description: 'Внешний номер заказа'
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает список транзакций'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoyaltyTransaction'
        401:
          description: 'Необходима авторизация'
          content: {  }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    post:
      tags:
        - loyalty-transaction
      summary: 'Добавить транзакцию для списания или начисления баллов по программе лояльности'
      description: 'Добавить транзакцию для списания или начисления баллов по программе лояльности'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyTransactionCreate'
        required: true
      responses:
        200:
          description: 'Возвращает созданную транзакцию'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyTransaction'
        401:
          description: 'Необходима авторизация'
          content: {  }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/loyalty/transaction/{id}':
    put:
      tags:
        - loyalty-transaction
      summary: 'Изменить транзакцию по программе лояльности'
      description: 'Изменить транзакцию по программе лояльности'
      parameters:
        -
          name: id
          in: path
          description: 'id транзакции'
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyTransactionUpdate'
        required: true
      responses:
        200:
          description: 'Возвращает транзакцию'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyTransaction'
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
