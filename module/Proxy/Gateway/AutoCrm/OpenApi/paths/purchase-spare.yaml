openapi: 3.1.0
info:
  title: 'Dealer Network Management - purchase-spare'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: purchase-spare
    description: 'Управление запчастями заказ-наряда'
paths:
  /purchase-spare:
    get:
      tags:
        - purchase-spare
      summary: 'Получение списка запчастей'
      description: 'Получение списка запчастей заказ нарядов'
      parameters:
        - name: purchase_id
          in: query
          description: 'ID заказ наряда'
          required: true
          schema:
            type: string
        - name: code
          in: query
          description: 'Внешний код запчасти заказ наряда'
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список запчастей заказ нарядов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseSpare'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - purchase-spare
      summary: 'Добавление новой запчасти в заказ наряд'
      description: 'Добавление новой запчасти в заказ наряд'
      requestBody:
        description: 'Объект PurchaseSpare'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseSpare'
        required: true
      responses:
        201:
          description: 'Новая запчасть в заказ-наряде успешно создана'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSpare'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/purchase-spare/{id}':
    get:
      tags:
        - purchase-spare
      summary: 'Получение запчасти заказ-наряда по ID'
      description: 'Получение запчасти заказ-наряда по ID'
      parameters:
        - name: id
          in: path
          description: 'id запчасти заказ-наряда'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает запчасть заказ-наряд по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSpare'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - purchase-spare
      summary: 'Изменение запчасти заказ-наряда'
      description: 'Изменение запчасти заказ-наряда'
      parameters:
        - name: id
          in: path
          description: 'id запчасти заказ-наряда'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель Запчасть заказ-наряда'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseSpare'
        required: false
      responses:
        200:
          description: 'Запчасть заказ-наряда успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSpare'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
