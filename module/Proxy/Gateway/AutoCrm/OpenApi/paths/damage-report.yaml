        422:
          description: 'Ошибка валидации данных'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/service/damage-report-damage/{id}/upload/{uploadId}':
    delete:
      tags:
        - damage-report
      summary: 'Удаление фото повреждения'
      description: 'Удаление фото повреждения'
      parameters:
        - name: id
          in: path
          description: 'ID повреждения'
          required: true
          schema:
            type: integer
        - name: uploadId
          in: path
          description: 'ID файла'
          required: true
          schema:
            type: integer
      responses:
