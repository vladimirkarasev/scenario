      summary: 'Справочник элементов'
      description: 'Справочник элементов'
      parameters:
        - name: directory
          in: path
          description: "Тип справочника\n`base` - Элемент а/м (дверь, капот, шина) `product` - Сопроводительный товар (аптечка, домкрат)"
          required: true
          schema:
            type: string
            enum:
              - base
              - product
      responses:
        200:
          description: 'Возвращает данные справочника'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DamageReportDirectory'
