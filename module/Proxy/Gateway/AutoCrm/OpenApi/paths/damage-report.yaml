openapi: 3.1.0
info:
  title: 'Dealer Network Management - damage-report'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: damage-report
    description: 'Работа с отчётами о повреждениях (ОУПТС)'
paths:
  /service/damage-report:
    get:
      tags:
        - damage-report
      summary: 'Список ОУПТС'
      description: 'Список ОУПТС'
      parameters:
        - name: id
          in: query
          description: 'ID ОУПТС'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DamageReport/properties/id'
        - name: vin
          in: query
          description: 'VIN (LIKE-поиск)'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DamageReport/properties/vin'
        - name: code
          in: query
          description: 'Номер ТН/CMR (LIKE-поиск)'
          schema:
            $ref: '#/components/schemas/DamageReport/properties/code'
        - name: transporter_number
          in: query
          description: 'Номер автовоза (LIKE-поиск)'
          schema:
            $ref: '#/components/schemas/DamageReport/properties/transporter_number'
        - name: trailer_number
          in: query
          description: 'Номер прицепа (LIKE-поиск)'
          schema:
            $ref: '#/components/schemas/DamageReport/properties/trailer_number'
        - name: createdFrom
          in: query
          description: 'Дата создания с (формат - dd.mm.yyyy)'
          schema:
            type: string
            format: date
            pattern: '^\d{2}\.\d{2}\.\d{4}$'
        - name: createdTo
          in: query
          description: 'Дата создания по (формат - dd.mm.yyyy)'
          schema:
            type: string
            format: date
            pattern: '^\d{2}\.\d{2}\.\d{4}$'
        - name: dateFrom
          in: query
          description: 'Дата приемки/отгрузки с (формат - dd.mm.yyyy)'
          schema:
            type: string
            format: date
            pattern: '^\d{2}\.\d{2}\.\d{4}$'
        - name: dateTo
          in: query
          description: 'Дата приемки/отгрузки по (формат - dd.mm.yyyy)'
          schema:
            type: string
            format: date
            pattern: '^\d{2}\.\d{2}\.\d{4}$'
        - name: 'shippingCompanyId[]'
          in: query
          description: 'ID транспортных компаний'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DamageReportPartnerBase/properties/id'
        - name: 'driverId[]'
          in: query
          description: 'ID водителей'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DamageReportDriver/properties/id'
        - name: driverLogic
          in: query
          description: "Логика поиска водителей\n`or` - или `and` - и"
          schema:
            type: string
            enum:
              - or
              - and
        - name: 'typeId[]'
          in: query
          description: "Тип отчёта\n`1` - Приёмка `2` - Отгрузка"
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DamageReportPartnerBase/properties/type_id'
        - name: warehouseId
          in: query
          description: 'ID складов'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DamageReportPartnerBase/properties/id'
        - name: dealerId
          in: query
          description: 'ID дилеров'
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Dealer/properties/id'
        - name: dealerStatus
          in: query
          description: "Статус дилера\n`active` - активный `deleted` - удалённый"
          schema:
            type: string
            enum:
              - active
              - deleted
        - name: brandId
          in: query
          description: 'ID брендов'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Brand/properties/id'
        - name: modelId
          in: query
          description: 'ID моделей'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Model/properties/id'
        - name: modelAliasId
          in: query
          description: 'ID алиасов моделей'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ModelAlias/properties/id'
        - name: 'damageStatus[]'
          in: query
          description: 'ID статусов повреждений (справочник)'
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DamageReportDirectory/properties/id'
        - name: damageStatusLogic
          in: query
          description: "Логика поиска статусов повреждений\n`or` - или `and` - и"
          schema:
            type: string
            enum:
              - or
              - and
      responses:
        200:
          description: 'Возвращает данные ОУПТС'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DamageReport'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    post:
      tags:
        - damage-report
      summary: 'Добавление ОУПТС'
      description: 'Добавление ОУПТС'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DamageReportForm'
        required: true
      responses:
        201:
          description: 'ОУПТС успешно добавлена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DamageReportForm'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка валидации данных'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /service/damage-report-damage:
    post:
      tags:
        - damage-report
      summary: 'Добавление повреждения'
      description: 'Добавление повреждения'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              allOf:
                - $ref: '#/components/schemas/DamageReportDamageForm'
            encoding:
              'damage_type[]':
                style: form
                explode: true
              'damage_size[]':
                style: form
                explode: true
              'damageStatuses[]':
                style: form
                explode: true
              'files[]':
                contentType: 'image/png, image/jpeg'
        required: true
      responses:
        201:
          description: 'Повреждение успешно добавлено'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DamageReportDamage'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка валидации данных'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/service/damage-report-damage/{id}':
    get:
      tags:
        - damage-report
      summary: 'Получение повреждения по ID'
      description: 'Получение повреждения по ID'
      parameters:
        - name: id
          in: path
          description: 'ID повреждения'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает повреждение по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DamageReportDamage'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - damage-report
      summary: 'Изменение повреждения по ID'
      description: 'Изменение повреждения по ID'
      parameters:
        - name: id
          in: path
          description: 'ID повреждения'
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DamageReportDamageForm'
        required: true
      responses:
        200:
          description: 'Элемент успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DamageReportDamage'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    delete:
      tags:
        - damage-report
      summary: 'Удаление повреждения по ID'
      description: 'Удаление повреждения по ID'
      parameters:
        - name: id
          in: path
          description: 'ID повреждения'
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Успешное удаление по ID'
          content: { }
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  '/service/damage-report-damage/{id}/upload':
    post:
      tags:
        - damage-report
      summary: 'Добавление фото повреждения'
      description: 'Добавление фото повреждения'
      parameters:
