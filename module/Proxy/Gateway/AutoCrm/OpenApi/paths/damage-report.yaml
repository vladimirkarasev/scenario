        - name: name
          in: query
          description: 'Наименование контрагента (LIKE-поиск)'
          schema:
            type: string
        - name: active
          in: query
          description: 'Активность (0 - Не активен, 1 - Активен)'
          schema:
            type: integer
        - name: 'typeIDs[]'
          in: query
          description: 'ID типов'
          schema:
            type: array
            items:
              type: integer
        - name: 'userIDs[]'
          in: query
          description: 'ID пользователей'
          schema:
            type: array
            items:
              type: integer
      responses:
        200:
          description: 'Возвращает данные контрагентов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DamageReportPartner'
        401:
