        - name: middle_name
          in: query
          description: 'Отчество водителя (LIKE-поиск)'
          schema:
            type: string
        - name: last_name
          in: query
          description: 'Фамилия водителя (LIKE-поиск)'
          schema:
            type: string
        - name: active
          in: query
          description: 'Активность (0 - Не активен, 1 - Активен)'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает данные водителей'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DamageReportDriver'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    post:
      tags:
        - damage-report
      summary: 'Добавление водителя'
      description: 'Добавление водителя'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DamageReportDriver'
        required: true
      responses:
        200:
