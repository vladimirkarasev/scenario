  /service/damage-report-element:
    get:
      tags:
        - damage-report
      summary: 'Список элементов'
      description: 'Список элементов'
      parameters:
        - name: fullCode
          in: query
          description: 'Код элемента (LIKE-поиск)'
          schema:
            type: string
        - name: name
          in: query
          description: 'Имя элемента (LIKE-поиск)'
          schema:
            $ref: '#/components/schemas/DamageReportElement/properties/name'
        - name: type
          in: query
          description: "Тип элемента ущерба\n`1` - Элемент а/м (дверь, капот, шина) `2` - Сопроводительный товар (аптечка, домкрат)"
          schema:
            $ref: '#/components/schemas/DamageReportElement/properties/type'
        - name: base_element
          in: query
          description: 'Элемент (справочник)'
          schema:
            $ref: '#/components/schemas/DamageReportElement/properties/base_element'
      responses:
