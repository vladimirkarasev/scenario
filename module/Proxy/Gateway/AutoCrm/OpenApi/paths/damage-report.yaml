              schema:
                $ref: '#/components/schemas/Exception'
  /service/damage-report-partner:
    get:
      tags:
        - damage-report
      summary: 'Список контрагентов'
      description: 'Список контрагентов'
      parameters:
        - name: id
          in: query
          description: 'ID контрагента'
          style: form
          explode: false
          schema:
            type: array
            items:
