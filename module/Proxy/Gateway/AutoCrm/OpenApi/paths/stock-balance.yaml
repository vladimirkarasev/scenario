openapi: 3.1.0
info:
  title: 'Dealer Network Management - stock-balance'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: stock-balance
    description: 'Управление отчетами по складским остаткам'
paths:
  /service/stock-balance:
    get:
      tags:
        - stock-balance
      summary: 'Получение списка отчетов по складским остаткам'
      description: 'Получение списка отчетов по складским остаткам'
      parameters:
        -
          name: id
          in: query
          schema:
            type: integer
        -
          name: year
          in: query
          schema:
            type: integer
        -
          name: month
          in: query
          schema:
            type: integer
        -
          name: valid
          in: query
          schema:
            type: integer
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список отчетов по складским остаткам'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockBalance'
        401:
          description: 'Необходима авторизация'
          content: {  }
    post:
      tags:
        - stock-balance
      summary: 'Добавление нового отчета по складским остаткам'
      description: 'Добавление нового отчета по складским остаткам'
      requestBody:
        description: 'Объект StockBalance'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockBalance'
        required: true
      responses:
        201:
          description: 'Новый отчет по складским остаткам успешно создан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalance'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: {  }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  /service/stock-balance/balance:
    post:
      tags:
        - stock-balance
      summary: 'Передача данных отчета по складским остаткам'
      description: 'Передача данных отчета по складским остаткам'
      parameters:
        -
          name: year
          in: query
          description: 'год отчета по складским остаткам'
          required: true
          schema:
            type: integer
        -
          name: month
          in: query
          description: 'месяц отчета по складским остаткам'
          required: true
          schema:
            type: integer
        -
          name: dealer_id
          in: query
          description: 'ид дилера отчета по складским остаткам'
          schema:
            type: integer
      requestBody:
        description: 'модель отчет по складским остаткам'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockBalanceBalance'
        required: false
      responses:
        200:
          description: 'Отчет по складским остаткам успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalanceBalance'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  /service/stock-balance/implementation:
    post:
      tags:
        - stock-balance
      summary: 'Передача данных отчета по реализации'
      description: 'Передача данных отчета по реализации'
      parameters:
        -
          name: year
          in: query
          description: 'год отчета по реализации'
          required: true
          schema:
            type: integer
        -
          name: month
          in: query
          description: 'месяц отчета по реализации'
          required: true
          schema:
            type: integer
        -
          name: dealer_id
          in: query
          description: 'ид дилера отчета по реализации'
          schema:
            type: integer
      requestBody:
        description: 'модель отчет по реализации'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockBalanceImplementation'
        required: false
      responses:
        200:
          description: 'Отчет по складским остаткам успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalanceImplementation'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  '/service/stock-balance/{id}':
    get:
      tags:
        - stock-balance
      summary: 'Получение отчета по складским остаткам по ID'
      description: 'Получение отчета по складским остаткам по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id отчета по складским остаткам'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает отчет по складским остаткам по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalance'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - stock-balance
      summary: 'Изменение отчета по складским остаткам'
      description: 'Изменение отчета по складским остаткам'
      parameters:
        -
          name: id
          in: path
          description: 'id отчета по складским остаткам'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель отчет по складским остаткам'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockBalance'
        required: false
      responses:
        200:
          description: 'Отчет по складским остаткам успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockBalance'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
