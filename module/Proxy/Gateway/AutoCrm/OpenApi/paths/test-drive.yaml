openapi: 3.1.0
info:
  title: 'Dealer Network Management - test-drive'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: test-drive
    description: 'Управление тест-драйвами'
paths:
  /test-drive:
    get:
      tags:
        - test-drive
      summary: 'Получение списка тест-драйвов'
      description: 'Получение списка тест-драйвов'
      parameters:
        -
          name: dealer_id
          in: query
          description: 'ID дилера'
          schema:
            type: integer
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список тест-драйвов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestDrive'
        401:
          description: 'Необходима авторизация'
          content: {  }
    post:
      tags:
        - test-drive
      summary: 'Добавление нового тест-драйва'
      description: 'Добавление нового тест-драйва'
      requestBody:
        description: 'Объект Тест-драйв'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestDrive'
        required: true
      responses:
        201:
          description: 'Тест-драйв успешно добавлен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDrive'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: {  }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/test-drive/{id}':
    get:
      tags:
        - test-drive
      summary: 'Получение тест-драйва'
      description: 'Получение тест-драйва'
      parameters:
        -
          name: id
          in: path
          description: 'id тест-драйва'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает тест-драйв по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDrive'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - test-drive
      summary: 'Изменение тест-драйва'
      description: 'Изменение тест-драйва'
      parameters:
        -
          name: id
          in: path
          description: 'id тест-драйва'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель Тест-драйв'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestDrive'
        required: false
      responses:
        200:
          description: 'Тест-драйв успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestDrive'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
