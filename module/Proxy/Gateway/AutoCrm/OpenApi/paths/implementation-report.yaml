openapi: 3.1.0
info:
  title: 'Dealer Network Management - implementation-report'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: implementation-report
    description: 'Управление отчетами по реализации'
paths:
  /infiniti/implementation-report:
    get:
      tags:
        - implementation-report
      summary: 'Получение списка отчетов по реализации'
      description: 'Получение списка отчетов по реализации'
      parameters:
        - name: id
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
        - name: valid
          in: query
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список отчетов по реализации'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImplementationReport'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - implementation-report
      summary: 'Добавление нового отчета по реализации'
      description: 'Добавление нового отчета по реализации'
      requestBody:
        description: 'Объект ImplementationReport'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImplementationReport'
        required: true
      responses:
        201:
          description: 'Новый отчет по реализации успешно создан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImplementationReport'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/infiniti/implementation-report/{id}':
    get:
      tags:
        - implementation-report
      summary: 'Получение отчета по реализации по ID'
      description: 'Получение отчета по реализации по ID'
      parameters:
        - name: id
          in: path
          description: 'id отчета по реализации'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает отчет по реализации по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImplementationReport'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - implementation-report
      summary: 'Изменение отчета по реализации'
      description: 'Изменение отчета по реализации'
      parameters:
        - name: id
          in: path
          description: 'id отчета по реализации'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель отчет по реализации'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImplementationReport'
        required: false
      responses:
        200:
          description: 'Отчет по реализации успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImplementationReport'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
