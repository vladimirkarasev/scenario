openapi: 3.1.0
info:
  title: 'Dealer Network Management - common-client-vehicle'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: common-client-vehicle
    description: 'Связь клиентов дистрибьютора и автомобилей дистрибьютора'
paths:
  /common-client-vehicle:
    get:
      tags:
        - common-client-vehicle
      summary: 'Получение автомобилей клиентов'
      description: 'Получение автомобилей клиентов'
      parameters:
        - name: id
          in: query
          schema:
            type: integer
        - name: common_client_id
          in: query
          description: 'ID клиента дистрибьютора'
          schema:
            type: integer
        - name: is_used_vehicle
          in: query
          description: 'Флаг Б/У автомобиля'
          schema:
            type: integer
            enum:
              - 0
              - 1
        - name: owner_status
          in: query
          description: 'Статус владельца'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
        - name: expand
          in: query
          description: 'Получение дополнительных полей, можно передать несколько значений через запятую commonVehicle - Данные об авто'
          schema:
            type: string
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommonClientVehicleResponse'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
    post:
      tags:
        - common-client-vehicle
      summary: 'Добавления автомобиля к клиенту'
      description: 'Добавления автомобиля к клиенту'
      requestBody:
        description: 'Идентификатор клиента'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommonClientVehicle'
        required: true
      responses:
        201:
          description: 'Автомобиль успешно добавлен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonClientVehicle'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
