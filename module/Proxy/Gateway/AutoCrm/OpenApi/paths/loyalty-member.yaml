  '/loyalty/member/{id}/private-benefits':
    post:
      tags:
        - loyalty-member
      summary: 'Изменение преимуществ участника программы лояльности'
      description: 'Изменение преимуществ участника программы лояльности'
      parameters:
        - name: id
          in: path
          description: 'id участника программы лояльности'
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyMemberPrivateBenefit'
        required: true
      responses:
        200:
          description: 'Преимущества изменены'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyMemberPrivateBenefit'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
