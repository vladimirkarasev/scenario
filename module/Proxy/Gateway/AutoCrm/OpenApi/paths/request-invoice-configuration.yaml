openapi: 3.1.0
info:
  title: 'Dealer Network Management - request-invoice-configuration'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: request-invoice-configuration
    description: 'Настройки запросов счёта'
paths:
  /request-invoice/configuration:
    get:
      tags:
        - request-invoice-configuration
      summary: 'Получение списка конфигураций запросов счёта'
      description: 'Получение списка конфигураций запросов счёта'
      parameters:
        -
          name: name
          in: query
          description: 'Название конфигурации (поиск по подстроке)'
          required: false
          schema:
            type: string
        -
          name: is_active
          in: query
          description: 'Активность (1 — да, 0 — нет)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
        -
          name: dealerId
          in: query
          description: 'ID дилера (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: brandId
          in: query
          description: 'ID бренда (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: modelId
          in: query
          description: 'ID модели (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: generationId
          in: query
          description: 'ID поколения (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: seriesId
          in: query
          description: 'ID серии (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: modificationId
          in: query
          description: 'ID модификации (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: equipmentId
          in: query
          description: 'ID комплектации (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: color
          in: query
          description: 'Коды цветов (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
        -
          name: trim
          in: query
          description: 'Коды отделок (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
        -
          name: productionYear
          in: query
          description: 'Годы производства (можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
        -
          name: logisticStatus
          in: query
          description: 'Логистические статусы (коды; можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
        -
          name: distributionWarehouse
          in: query
          description: 'Склады распределения (коды/имена; можно несколько)'
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
        -
          name: vin
          in: query
          description: 'VIN (можно несколько через запятую или пробел)'
          required: false
          schema:
            type: string
        -
          name: hasImporterReceiptDate
          in: query
          description: 'Есть дата получения импортером (1 — да, 0 — нет)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
        -
          name: importerReceiptDateFrom
          in: query
          description: 'Дата получения импортером с (формат d.m.Y)'
          required: false
          schema:
            type: string
            example: 01.08.2025
        -
          name: importerReceiptDateTo
          in: query
          description: 'Дата получения импортером по (формат d.m.Y)'
          required: false
          schema:
            type: string
            example: 30.08.2025
        -
          name: isFreeStock
          in: query
          description: 'Свободный склад (1 — да, 0 — нет)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
        -
          name: activeDateFrom
          in: query
          description: 'Активен с (формат d.m.Y H:i)'
          required: false
          schema:
            type: string
            example: '18.08.2025 09:25'
        -
          name: activeDateTo
          in: query
          description: 'Активен по (формат d.m.Y H:i)'
          required: false
          schema:
            type: string
            example: '31.12.2025 23:59'
        -
          name: page
          in: query
          description: 'Номер страницы'
          required: false
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список конфигураций запросов счёта'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestInvoiceConfiguration'
        401:
          description: 'Необходима авторизация'
          content: {  }
    post:
      tags:
        - request-invoice-configuration
      summary: 'Создание конфигурации запроса счёта'
      description: 'Создание конфигурации запроса счёта'
      requestBody:
        description: 'Данные конфигурации запроса счёта'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInvoiceConfigurationForm'
      responses:
        201:
          description: 'Конфигурация успешно создана'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestInvoiceConfiguration'
        400:
          description: 'Ошибка валидации'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/request-invoice/configuration/{id}':
    put:
      tags:
        - request-invoice-configuration
      summary: 'Изменение конфигурации запроса счёта'
      description: 'Изменение конфигурации запроса счёта'
      parameters:
        -
          name: id
          in: path
          description: 'id конфигурации'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'Данные конфигурации запроса счёта'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInvoiceConfigurationForm'
      responses:
        200:
          description: 'Конфигурация успешно изменена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestInvoiceConfiguration'
        400:
          description: 'Ошибка валидации'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Конфигурация не найдена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    get:
      tags:
        - request-invoice-configuration
      summary: 'Просмотр конфигурации запроса счёта'
      description: 'Просмотр конфигурации запроса счёта'
      parameters:
        -
          name: id
          in: path
          description: 'id конфигурации'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Конфигурация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestInvoiceConfiguration'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Конфигурация не найдена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    delete:
      tags:
        - request-invoice-configuration
      summary: 'Удаление конфигурации запроса счёта'
      description: 'Удаление конфигурации запроса счёта'
      parameters:
        -
          name: id
          in: path
          description: 'id конфигурации'
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Успешно удалено'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Конфигурация не найдена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
