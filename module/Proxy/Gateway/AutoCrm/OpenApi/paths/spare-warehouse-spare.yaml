openapi: 3.1.0
info:
  title: 'Dealer Network Management - spare-warehouse-spare'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: spare-warehouse-spare
    description: 'Управление списком запчастей дилеров'
paths:
  /spare-warehouse/spare:
    get:
      tags:
        - spare-warehouse-spare
      summary: 'Получение списка запчастей дилера'
      description: 'Получение списка запчастей дилера'
      parameters:
        - name: status
          in: query
          schema:
            type: integer
        - name: code
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: manufacture
          in: query
          schema:
            type: string
        - name: expand
          in: query
          description: 'Параметр позволяющий получить в ответе связные данные (spareReference, dealerName, upload)'
          schema:
            type: string
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список запчастей'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpareWarehouseSpare'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - spare-warehouse-spare
      summary: 'Добавление новой запчасти'
      description: 'Добавление новой запчасти'
      requestBody:
        description: Объект
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpareWarehouseSpare'
        required: true
      responses:
        201:
          description: 'Новая запчасть успешно создана'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpareWarehouseSpare'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/spare-warehouse/spare/{id}':
    get:
      tags:
        - spare-warehouse-spare
      summary: 'Получение запчасти по ID'
      description: 'Получение запчасти по ID'
      parameters:
        - name: id
          in: path
          description: 'id запчасти'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает запчасть по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpareWarehouseSpare'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - spare-warehouse-spare
      summary: 'Изменение запчасти по ID'
      description: 'Изменение запчасти по ID'
      parameters:
        - name: id
          in: path
          description: 'id запчасти'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель Запчасть'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpareWarehouseSpare'
        required: false
      responses:
        200:
          description: 'Запчасть успешно изменена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpareWarehouseSpare'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
