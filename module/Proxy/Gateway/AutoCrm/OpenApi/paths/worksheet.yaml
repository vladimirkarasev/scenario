openapi: 3.1.0
info:
  title: 'Dealer Network Management - worksheet'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: worksheet
    description: 'Управление рабочими листами'
paths:
  /worksheet:
    get:
      tags:
        - worksheet
      summary: 'Получение списка рабочих листов'
      description: 'Получение списка рабочих листов'
      parameters:
        - name: code
          in: query
          description: 'Код во внешней системе'
          schema:
            type: string
        - name: created_from
          in: query
          description: 'минимальное время создания рабочего листа в формате dd.MM.yyyy hh:mm:ss'
          schema:
            type: string
        - name: created_to
          in: query
          description: 'максимальное время создания рабочего листа в формате dd.MM.yyyy hh:mm:ss'
          schema:
            type: string
        - name: updated_from
          in: query
          description: 'минимальное время обновления рабочего листа в формате dd.MM.yyyy hh:mm:ss'
          schema:
            type: string
        - name: updated_to
          in: query
          description: 'максимальное время обновления рабочего листа в формате dd.MM.yyyy hh:mm:ss'
          schema:
            type: string
        - name: worksheet_update_date_from
          in: query
          description: 'минимальное время обновления объектов рабочего листа в формате dd.MM.yyyy hh:mm:ss'
          schema:
            type: string
        - name: worksheet_update_date_to
          in: query
          description: 'максимальное время обновления объектов рабочего листа в формате dd.MM.yyyy hh:mm:ss'
          schema:
            type: string
        - name: client_id
          in: query
          description: 'id клиента'
          schema:
            type: string
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
        - name: vin
          in: query
          description: 'VIN-номер автомобиля'
          schema:
            type: string
        - name: phone
          in: query
          description: 'Номер телефона'
          schema:
            type: string
        - name: 'eventTypeFilter[0][event_type][]'
          in: query
          description: 'Фильтр по этапам'
          required: false
          schema:
            type: string
            example: visit
        - name: 'eventTypeFilter[0][occurred_from]'
          in: query
          description: 'Фильтр по дате "завершения этапа с" в формате dd.MM.yyyy hh:mm:ss'
          required: false
          schema:
            type: string
            format: date
        - name: 'eventTypeFilter[0][occurred_to]'
          in: query
          description: 'Фильтр по дате "завершения этапа по" в формате dd.MM.yyyy hh:mm:ss'
          required: false
          schema:
            type: string
            format: date
      responses:
        200:
          description: 'Возвращает список рабочих листов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Worksheet'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - worksheet
      summary: 'Добавление нового рабочего листа'
      description: 'Добавление нового рабочего листа'
      requestBody:
        description: 'Объект Рабочий лист'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Worksheet'
        required: true
      responses:
        201:
          description: 'Новый рабочий лист успешно создан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worksheet'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/worksheet/{id}':
    get:
      tags:
        - worksheet
      summary: 'Получение рабочего листа по ID'
      description: 'Получение рабочего листа по ID'
      parameters:
        - name: id
          in: path
          description: 'id рабочего листа'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает рабочий лист по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worksheet'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - worksheet
      summary: 'Изменение рабочего листа'
      description: 'Изменение рабочего листа'
      parameters:
        - name: id
          in: path
          description: 'id рабочего листа'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель Рабочий лист'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Worksheet'
        required: false
      responses:
        200:
          description: 'Рабочий лист успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worksheet'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
