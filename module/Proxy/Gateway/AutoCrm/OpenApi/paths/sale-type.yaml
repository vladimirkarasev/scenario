openapi: 3.1.0
info:
  title: 'Dealer Network Management - sale-type'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: sale-type
    description: 'Типы продажи'
paths:
  /sale-type:
    get:
      tags:
        - sale-type
      summary: 'Получение списка типов продажи'
      description: 'Получение списка типов продажи'
      parameters:
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список типов продажи'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleType'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/sale-type/{id}':
    get:
      tags:
        - sale-type
      summary: 'Получение типа продажи по ID'
      description: 'Получение типа продажи по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id типа продажи'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает тип продажи по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleType'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
