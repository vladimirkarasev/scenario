openapi: 3.1.0
info:
  title: 'Dealer Network Management - personal-data-agreement-print-form'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: personal-data-agreement-print-form
paths:
  '/personal-data-agreement/event/print-form/{id}':
    get:
      tags:
        - personal-data-agreement-print-form
      summary: 'Получение печатной формы СОПД'
      description: 'Получение печатной формы в формате Base64 анкеты согласия на обработку ПД'
      parameters:
        -
          name: id
          in: path
          description: 'ID СОПД'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'печатная форма СОПД успешно сформирована'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalDataAgreementPrintForm'
        400:
          description: 'Некорректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        403:
          description: 'Нет прав на загрузку'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
