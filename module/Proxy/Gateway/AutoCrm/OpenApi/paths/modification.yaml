openapi: 3.1.0
info:
  title: 'Dealer Network Management - modification'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: modification
    description: 'Управление модификациями'
paths:
  /modification:
    get:
      tags:
        - modification
      summary: 'Получение списка модификаций'
      description: 'Получение списка модификаций'
      parameters:
        - name: serie_id
          in: query
          description: 'ID серии'
          schema:
            type: integer
        - name: is_recent
          in: query
          description: 'признак активности модификации 1 - только модификации которые выпускаются (по умолчанию), 0 - модификации, которые не выпускаются, пустое значение - все модификации'
          schema:
            type: integer
        - name: expand
          in: query
          description: "Получение дополнительных полей, можно передать несколько значений через запятую\n* **equipment_ids** - Список ID комплектаций"
          schema:
            type: string
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список модификаций'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Modification'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/modification/{id}':
    get:
      tags:
        - modification
      summary: 'Получение модификации по ID'
      description: 'Получение модификации по ID'
      parameters:
        - name: id
          in: path
          description: 'id модификации'
          required: true
          schema:
            type: integer
        - name: expand
          in: query
          description: "Получение дополнительных полей, можно передать несколько значений через запятую\n* **equipment_ids** - Список ID комплектаций"
          schema:
            type: string
      responses:
        200:
          description: 'Возвращает модификацию по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Modification'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
