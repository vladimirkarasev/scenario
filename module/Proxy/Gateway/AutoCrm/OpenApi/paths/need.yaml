openapi: 3.1.0
info:
  title: 'Dealer Network Management - need'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: need
    description: 'Управление потребностями'
paths:
  /need:
    get:
      tags:
        - need
      summary: 'Получение потребностей'
      description: 'Получение потребностей'
      parameters:
        - name: code
          in: query
          description: 'Внешний код потребности'
          schema:
            type: string
        - name: vin
          in: query
          description: 'VIN номер'
          schema:
            type: string
        - name: vin_manufacturer
          in: query
          description: 'VIN номер производителя'
          schema:
            type: string
        - name: job
          in: query
          description: 'JOB номер'
          schema:
            type: string
        - name: id
          in: query
          description: 'ID потребности'
          schema:
            type: integer
        - name: worksheet_id
          in: query
          description: 'ID рабочего листа'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список потребностей'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Car'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - need
      summary: 'Добавление новой потребности'
      description: 'Добавление новой потребности'
      requestBody:
        description: 'Объект Потребность'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Need'
        required: true
      responses:
        201:
          description: 'Новая потребность успешно создан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Car'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/need/{id}':
    get:
      tags:
        - need
      summary: 'Получение потребности по ID'
      description: 'Получение потребности по ID'
      parameters:
        - name: id
          in: path
          description: 'id потребности'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает потребность по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Car'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - need
      summary: 'Изменение потребности'
      description: 'Изменение потребности'
      parameters:
        - name: id
          in: path
          description: 'id потребности'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель потребность'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Need'
        required: false
      responses:
        200:
          description: 'Потребность успешно изменена'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Car'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
