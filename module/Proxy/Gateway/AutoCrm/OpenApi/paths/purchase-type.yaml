openapi: 3.1.0
info:
  title: 'Dealer Network Management - purchase-type'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: purchase-type
    description: 'Управление списком цехов'
paths:
  /purchase-type:
    get:
      tags:
        - purchase-type
      summary: 'Получение списка цехов'
      description: 'Получение списка цехов'
      parameters:
        - name: id
          in: query
          description: 'ID цеха'
          schema:
            type: integer
        - name: status
          in: query
          description: 'Статус цеха'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список цехов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseType'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/purchase-type/{id}':
    get:
      tags:
        - purchase-type
      summary: 'Получение цеха по ID'
      description: 'Получение цеха по ID'
      parameters:
        - name: id
          in: path
          description: 'id цеха'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает цех по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseType'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
