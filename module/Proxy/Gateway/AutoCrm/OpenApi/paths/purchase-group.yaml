openapi: 3.1.0
info:
  title: 'Dealer Network Management - purchase-group'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: purchase-group
    description: 'Управление типами оплаты'
paths:
  /purchase-group:
    get:
      tags:
        - purchase-group
      summary: 'Получение списка Типов оплаты'
      description: 'Получение списка Типов оплаты'
      parameters:
        -
          name: id
          in: query
          description: 'id типа оплаты'
          schema:
            type: integer
        -
          name: status
          in: query
          description: 'статус типа оплаты'
          schema:
            type: integer
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список типов оплаты'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseGroup'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/purchase-group/{id}':
    get:
      tags:
        - purchase-group
      summary: 'Получение типа оплаты по ID'
      description: 'Получение типа оплаты по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id типа оплаты'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает тип оплаты по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseGroup'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
