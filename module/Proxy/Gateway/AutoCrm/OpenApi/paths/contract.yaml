openapi: 3.1.0
info:
  title: 'Dealer Network Management - contract'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: contract
    description: 'Управление дилерскими контрактами'
paths:
  /bankGuarantee/contract:
    get:
      tags:
        - contract
      summary: 'Получение списка дилерских контрактов'
      description: 'Получение списка дилерских контрактов'
      parameters:
        - name: code
          in: query
          description: Код
          schema:
            type: string
        - name: name
          in: query
          description: Название
          schema:
            type: string
        - name: status
          in: query
          description: 'Статус дилерского контракта (1 - Активен, 0 - Удален)'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список дилерских контрактов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        401:
          description: 'Необходима авторизация'
          content: { }
    post:
      tags:
        - contract
      summary: 'Добавление нового дилерского контракта'
      description: 'Добавление нового дилерского контракта'
      requestBody:
        description: 'Объект Дилерский контракт'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contract'
        required: true
      responses:
        201:
          description: 'Дилерский контракт успешно добавлен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: { }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/bankGuarantee/contract/update-by-code/{code}':
    put:
      tags:
        - contract
      summary: 'Изменение дилерского контракта по code'
      description: 'Изменение дилерского контракта по code'
      parameters:
        - name: code
          in: path
          description: 'code дилерского контракта'
          required: true
          schema:
            type: string
      requestBody:
        description: 'модель дилерский контракт'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contract'
        required: false
      responses:
        200:
          description: 'Дилерский контракт успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
  '/bankGuarantee/contract/{id}':
    get:
      tags:
        - contract
      summary: 'Получение дилерского контракта по id'
      description: 'Получение дилерского контракта по id'
      parameters:
        - name: id
          in: path
          description: 'id дилерского контракта'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает дилерский контракт по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - contract
      summary: 'Изменение дилерского контракта по ID'
      description: 'Изменение дилерского контракта по ID'
      parameters:
        - name: id
          in: path
          description: 'id дилерского контракта'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель дилерский контракт'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contract'
        required: false
      responses:
        200:
          description: 'Дилерский контракт успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
