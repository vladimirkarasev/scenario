openapi: 3.1.0
info:
  title: 'Dealer Network Management - esk-record-type'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: esk-record-type
    description: 'Типы записей ЭСК'
paths:
  /esk-record-type:
    get:
      tags:
        - esk-record-type
      summary: 'Получение списка типов записей ЭСК'
      description: "Возвращает справочник типов записей ЭСК\n"
      parameters:
        -
          name: id
          in: query
          description: 'ID записи'
          schema:
            type: integer
        -
          name: maintenance
          in: query
          description: 'Номер ТО'
          schema:
            type: integer
        -
          name: name
          in: query
          description: Наименование
          schema:
            type: string
        -
          name: max_period_months
          in: query
          description: 'Максимальный срок проведения, месяцев'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список типов записей ЭСК'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EskRecordType'
        401:
          description: 'Необходима авторизация'
          content: {  }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
