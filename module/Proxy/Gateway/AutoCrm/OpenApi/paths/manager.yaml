openapi: 3.1.0
info:
  title: 'Dealer Network Management - manager'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: manager
    description: 'Управление менеджерами'
paths:
  /manager:
    get:
      tags:
        - manager
      summary: 'Получение списка менеджеров'
      description: 'Получение списка менеджеров'
      parameters:
        -
          name: code
          in: query
          description: 'ID записи во внешней системе'
          schema:
            type: string
        -
          name: first_name
          in: query
          description: 'Имя менеджера'
          schema:
            type: string
        -
          name: middle_name
          in: query
          description: 'Отчество менеджера'
          schema:
            type: string
        -
          name: last_name
          in: query
          description: 'Фамилия менеджера'
          schema:
            type: string
        -
          name: dealer_id
          in: query
          description: 'Фильтр по id дилера'
          schema:
            type: integer
        -
          name: role
          in: query
          description: "Фильтр по коду роли пользователя, например 'dealer-admin'"
          schema:
            type: string
        -
          name: position_id
          in: query
          description: 'Фильтр по id должностей, которые пользователь должен занимать одновременно (логика И)'
          style: form
          explode: false
          schema:
            type: array
            items:
              type: integer
        -
          name: show_in_maintenance_schedule
          in: query
          description: 'Участие в журнале записи (0 - нет, 1 - да)'
          schema:
            type: integer
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список менеджеров'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Manager'
        401:
          description: 'Необходима авторизация'
          content: {  }
    post:
      tags:
        - manager
      summary: 'Добавление нового менеджера'
      description: 'Добавление нового менеджера'
      requestBody:
        description: 'Объект Manager'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manager'
        required: true
      responses:
        201:
          description: 'Новый менеджер успешно создан'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'
        400:
          description: 'Не корректный запрос'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
        401:
          description: 'Необходима авторизация'
          content: {  }
        422:
          description: 'Ошибка в параметрах запроса'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Error'
  '/manager/{id}':
    get:
      tags:
        - manager
      summary: 'Получение менеджера по ID'
      description: 'Получение менеджера по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id менеджера'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает менеджера по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
    put:
      tags:
        - manager
      summary: 'Изменение менеджера'
      description: 'Изменение менеджера'
      parameters:
        -
          name: id
          in: path
          description: 'id менеджера'
          required: true
          schema:
            type: integer
      requestBody:
        description: 'модель Менеджер'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manager'
        required: false
      responses:
        200:
          description: 'Менеджер успешно изменен'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manager'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
