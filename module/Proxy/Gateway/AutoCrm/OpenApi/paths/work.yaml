openapi: 3.1.0
info:
  title: 'Dealer Network Management - work'
  version: '1.0'
servers:
  -
    url: /api
security:
  -
    basicAuth: {  }
  -
    bearerAuth: {  }
tags:
  -
    name: work
    description: 'Управление работами'
paths:
  /work:
    get:
      tags:
        - work
      summary: 'Получение списка работ'
      description: 'Получение списка работ'
      parameters:
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список работ'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Work'
        401:
          description: 'Необходима авторизация'
          content: {  }
  '/work/{id}':
    get:
      tags:
        - work
      summary: 'Получение работы по ID'
      description: 'Получение работы по ID'
      parameters:
        -
          name: id
          in: path
          description: 'id работы'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает работу по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        401:
          description: 'Необходима авторизация'
          content: {  }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
