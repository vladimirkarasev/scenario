openapi: 3.1.0
info:
  title: 'Dealer Network Management - model-year'
  version: '1.0'
servers:
  - url: /api
security:
  - basicAuth: { }
  - bearerAuth: { }
tags:
  - name: model-year
    description: 'Управление модельными годами'
paths:
  /model-year:
    get:
      tags:
        - model-year
      summary: 'Получение списка модельных годов'
      description: 'Получение списка модельный годов'
      parameters:
        - name: model_id
          in: query
          description: 'id модели'
          schema:
            type: integer
        - name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает список модельных годов'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelYear'
        401:
          description: 'Необходима авторизация'
          content: { }
  '/model-year/{id}':
    get:
      tags:
        - model-year
      summary: 'Получение модельного года по ID'
      description: 'Получение модельного года по ID'
      parameters:
        - name: id
          in: path
          description: 'id модельного года'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Возвращает модельного года по ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelYear'
        401:
          description: 'Необходима авторизация'
          content: { }
        404:
          description: 'Объект не найден'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exception'
