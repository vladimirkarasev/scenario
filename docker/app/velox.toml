[roadrunner]
ref = "v2025.1.5"

[github]
[github.token]
token = "${RT_TOKEN}"

# Mirrors the plugin set bundled in the official ghcr.io/roadrunner-server/roadrunner:2025.1.5
# image 1:1 (see container/plugins.go + go.mod at that tag) so switching to a custom build here
# doesn't silently drop functionality, plus the community `cron` plugin — the reason for this
# custom build in the first place: it runs cron-scheduled shell commands natively inside the RR
# Go process, replacing App\Jobs\RunScheduleTickJob's self-rescheduling PHP job chain.
[github.plugins]
amqp = { ref = "v5.2.3", owner = "roadrunner-server", repository = "amqp" }
app-logger = { ref = "v5.1.9", owner = "roadrunner-server", repository = "app-logger" }
beanstalk = { ref = "v5.1.9", owner = "roadrunner-server", repository = "beanstalk" }
boltdb = { ref = "v5.1.9", owner = "roadrunner-server", repository = "boltdb" }
centrifuge = { ref = "v5.1.9", owner = "roadrunner-server", repository = "centrifuge" }
fileserver = { ref = "v5.1.9", owner = "roadrunner-server", repository = "fileserver" }
google-pub-sub = { ref = "v5.1.9", owner = "roadrunner-server", repository = "google-pub-sub" }
grpc = { ref = "v5.2.3", owner = "roadrunner-server", repository = "grpc" }
gzip = { ref = "v5.1.9", owner = "roadrunner-server", repository = "gzip" }
headers = { ref = "v5.1.9", owner = "roadrunner-server", repository = "headers" }
http = { ref = "v5.2.8", owner = "roadrunner-server", repository = "http" }
informer = { ref = "v5.1.9", owner = "roadrunner-server", repository = "informer" }
jobs = { ref = "v5.1.9", owner = "roadrunner-server", repository = "jobs" }
kafka = { ref = "v5.2.5", owner = "roadrunner-server", repository = "kafka" }
kv = { ref = "v5.2.9", owner = "roadrunner-server", repository = "kv" }
lock = { ref = "v5.1.9", owner = "roadrunner-server", repository = "lock" }
logger = { ref = "v5.1.9", owner = "roadrunner-server", repository = "logger" }
memcached = { ref = "v5.1.9", owner = "roadrunner-server", repository = "memcached" }
memory = { ref = "v5.2.9", owner = "roadrunner-server", repository = "memory" }
metrics = { ref = "v5.1.9", owner = "roadrunner-server", repository = "metrics" }
nats = { ref = "v5.1.9", owner = "roadrunner-server", repository = "nats" }
otel = { ref = "v5.3.1", owner = "roadrunner-server", repository = "otel" }
prometheus = { ref = "v5.1.8", owner = "roadrunner-server", repository = "prometheus" }
proxy_ip_parser = { ref = "v5.1.9", owner = "roadrunner-server", repository = "proxy_ip_parser" }
redis = { ref = "v5.1.10", owner = "roadrunner-server", repository = "redis" }
resetter = { ref = "v5.1.9", owner = "roadrunner-server", repository = "resetter" }
rpc = { ref = "v5.1.9", owner = "roadrunner-server", repository = "rpc" }
send = { ref = "v5.1.6", owner = "roadrunner-server", repository = "send" }
server = { ref = "v5.2.10", owner = "roadrunner-server", repository = "server" }
service = { ref = "v5.1.9", owner = "roadrunner-server", repository = "service" }
sqs = { ref = "v5.1.9", owner = "roadrunner-server", repository = "sqs" }
static = { ref = "v5.1.7", owner = "roadrunner-server", repository = "static" }
status = { ref = "v5.1.9", owner = "roadrunner-server", repository = "status" }
tcp = { ref = "v5.1.9", owner = "roadrunner-server", repository = "tcp" }
temporal = { ref = "v5.9.0", owner = "temporalio", repository = "roadrunner-temporal" }

cron = { ref = "1.0.1", owner = "roadrunner-plugins", repository = "cron" }
