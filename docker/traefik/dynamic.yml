http:
  routers:
    scenario:
      rule: Host(`scenario.test`)
      entryPoints:
        - web
      service: scenario

    scenario-local-ip:
      rule: PathPrefix(`/`)
      priority: 1
      entryPoints:
        - web
      service: scenario

    scenario-centrifugo:
      rule: Host(`centrifugo.test`)
      entryPoints:
        - web
      service: scenario-centrifugo

    buggregator:
      rule: Host(`buggregator.test`)
      entryPoints:
        - web
      service: buggregator

  services:
    scenario:
      loadBalancer:
        servers:
          - url: http://scenario-laravel:8080

    scenario-centrifugo:
      loadBalancer:
        servers:
          - url: http://scenario-centrifugo:8000

    buggregator:
      loadBalancer:
        servers:
          - url: http://scenario-buggregator:8000
